<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3D2E" />
      <stop offset="100%" stop-color="#1F7A4C" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F7A4C" />
      <stop offset="100%" stop-color="#5CB85C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="10" />
  
  <!-- Glowing Seedling Graphic -->
  <g filter="url(#glow)" transform="translate(128, 128) scale(0.5)">
    <!-- Stem -->
    <path d="M256 500 C256 350 220 200 120 120 C180 200 220 300 220 500 Z" fill="url(#leafGrad)" />
    <!-- Left Leaf -->
    <path d="M220 350 C120 300 50 150 100 50 C200 100 220 250 220 350 Z" fill="url(#leafGrad)" />
    <!-- Right Leaf -->
    <path d="M256 280 C320 200 420 120 400 50 C320 80 280 200 256 280 Z" fill="url(#leafGrad)" />
  </g>
</svg>
