<!doctype html>
<html lang="en" data-theme="light" data-page="map">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Farm Map | Farm Assist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root{--green:#176b45;--dark:#103d2b;--line:#dbe6df;--panel:#fff}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{padding-bottom:0;background:#f4f7f5}.map-page{height:100dvh;display:flex;flex-direction:column;padding-top:var(--topbar-height,64px);padding-bottom:var(--bottomnav-height,72px)}.map-page.fullscreen{position:fixed;inset:0;padding:0;z-index:3000}.map-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}.map-title h1{font:700 18px Outfit,Arial,sans-serif;color:var(--dark);margin:0;text-transform:uppercase;letter-spacing:.04em}.map-title p{margin:3px 0 0;color:#6b7b72;font-size:12px}.map-tools{display:flex;align-items:center;gap:8px}.map-type{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.map-type button,.map-tool{min-height:36px;border:0;background:#fff;color:#587066;font-weight:700;font-size:12px;padding:0 12px;cursor:pointer}.map-type button+button{border-left:1px solid var(--line)}.map-type button.active,.map-tool:hover{background:var(--green);color:#fff}.map-tool{width:36px;padding:0;border:1px solid var(--line);border-radius:10px}.map-shell{position:relative;flex:1;min-height:0;background:#e7eee9}.google-map{position:absolute;inset:0}.map-message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;pointer-events:none}.map-message .message-card{max-width:360px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(16,61,43,.12);pointer-events:auto}.map-message h2{font:700 18px Outfit,Arial,sans-serif;color:var(--dark);margin:0 0 8px}.map-message p{margin:0;color:#60736a;font-size:13px;line-height:1.5}.map-message button,.farm-card a{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;padding:10px 14px;border-radius:10px;border:0;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:12px;cursor:pointer}.status-pill{position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.94);color:#587066;font-size:11px;font-weight:700;box-shadow:0 2px 12px rgba(16,61,43,.12)}.status-pill i{color:var(--green)}.farm-card{min-width:210px;padding:4px;color:#1c3027}.farm-card h3{font:700 15px Outfit,Arial,sans-serif;color:var(--dark);margin:0 0 8px}.farm-card p{font-size:12px;margin:4px 0;color:#5e7167}.farm-card a{margin-top:10px}.current-marker{width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 1px 8px #315aa7}.no-map{display:none}@media(max-width:600px){.map-page{padding-top:56px;padding-bottom:62px}.map-header{padding:10px 12px;gap:8px}.map-title h1{font-size:15px}.map-title p{font-size:10px}.map-tools{gap:5px}.map-type button{padding:0 8px;font-size:10px}.map-tool{width:34px}.status-pill{top:10px;left:10px}.map-message .message-card{padding:16px}.map-message h2{font-size:16px}}
  </style>
</head>
<body>
  <main class="map-page" id="map-page">
    <header class="map-header">
      <div class="map-title"><h1>Farm Map</h1><p>View your farms and plots on the map.</p></div>
      <div class="map-tools" aria-label="Map controls">
        <div class="map-type" role="group" aria-label="Map type"><button id="map-view" class="active" type="button">Map</button><button id="sat-view" type="button">Satellite</button></div>
        <button class="map-tool" id="locate" type="button" aria-label="Use my current location" title="My location"><i class="fa-solid fa-location-crosshairs"></i></button>
        <button class="map-tool" id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
      </div>
    </header>
    <section class="map-shell" aria-label="Farm locations map">
      <div id="google-map" class="google-map"></div>
      <div id="status" class="status-pill"><i class="fa-solid fa-spinner fa-spin"></i><span>Loading farm locations...</span></div>
      <div id="message" class="map-message" hidden></div>
    </section>
  </main>
  <script src="js/services.js"></script><script src="js/userStore.js"></script><script src="assets/js/navigation.js"></script><script src="assets/js/app.js"></script><script src="js/script.js"></script>
  <script>
  (function(){'use strict';var map,farms=[],markers=[],polygons=[],currentMarker;var status=document.getElementById('status'),message=document.getElementById('message');
    function api(path){return fetch((window.APP_CONFIG&&APP_CONFIG.API_BASE_URL||'http://localhost:8000/api/v1')+path,{headers:{Authorization:'Bearer '+(localStorage.getItem('fa-auth-token')||'')},credentials:'same-origin'}).then(function(r){if(r.status===401||r.status===403){location.href='login.html?redirect='+encodeURIComponent(location.pathname+location.search);throw new Error('auth')}if(!r.ok)throw new Error('request');return r.json()})}
    function setStatus(text,loading){status.querySelector('span').textContent=text;status.querySelector('i').className=loading?'fa-solid fa-spinner fa-spin':'fa-solid fa-location-dot';status.hidden=!text}
    function showMessage(title,text,link){message.hidden=false;message.innerHTML='<div class="message-card"><h2>'+title+'</h2><p>'+text+'</p>'+(link?'<a href="'+link.url+'">'+link.label+'</a>':'')+'</div>'}
    function validPoint(lat,lng){return Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))&&Number(lat)>=-90&&Number(lat)<=90&&Number(lng)>=-180&&Number(lng)<=180}
    function clearOverlays(){markers.forEach(function(m){m.setMap(null)});polygons.forEach(function(p){p.setMap(null)});markers=[];polygons=[]}
    function farmInfo(f){var address=[f.address,f.village,f.district,f.state].filter(Boolean).join(', ')||'Location saved';return '<div class="farm-card"><h3>'+escapeHtml(f.farm_name||'Farm')+'</h3><p><strong>Area:</strong> '+(f.total_area??'—')+' '+(f.area_unit||'Acres')+'</p><p><strong>Plots:</strong> '+((f.plots||[]).length)+'</p><p>'+escapeHtml(address)+'</p><a href="farm.html?farm_id='+encodeURIComponent(f.farm_id||'')+'">View Farm</a></div>'}
    function escapeHtml(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function draw(){clearOverlays();var bounds=new google.maps.LatLngBounds(),count=0;farms.forEach(function(f){if(!validPoint(f.latitude,f.longitude))return;var pos={lat:Number(f.latitude),lng:Number(f.longitude)};var marker=new google.maps.Marker({map:map,position:pos,title:f.farm_name||'Farm',icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#176b45',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}});var info=new google.maps.InfoWindow({content:farmInfo(f)});marker.addListener('click',function(){info.open({map:map,anchor:marker})});markers.push(marker);bounds.extend(pos);count++;(f.plots||[]).forEach(function(p){if(validPoint(p.latitude,p.longitude)){var pm=new google.maps.Marker({map:map,position:{lat:Number(p.latitude),lng:Number(p.longitude)},title:p.plot_name||'Plot',label:{text:'•',color:'#176b45',fontSize:'24px'}});markers.push(pm);bounds.extend(pm.getPosition())}var coords=normaliseBoundary(p.boundary_coordinates);if(coords.length>=3){var poly=new google.maps.Polygon({map:map,paths:coords,strokeColor:'#176b45',strokeOpacity:.9,strokeWeight:2,fillColor:'#5bbf88',fillOpacity:.22});polygons.push(poly);coords.forEach(function(c){bounds.extend(c)});}})});if(count){map.fitBounds(bounds);if(count===1)map.setZoom(Math.max(map.getZoom(),15));setStatus(count+' farm'+(count===1?'':'s')+' shown',false)}else{setStatus('',false);showMessage('Farm location has not been added yet.','Add coordinates in Farm Management to see your farm here.',{url:'farm.html',label:'Add Farm Location'})}}
    function normaliseBoundary(b){var raw=Array.isArray(b)?b:(b&&Array.isArray(b.coordinates)?b.coordinates:null);if(!raw)return [];if(raw[0]&&Array.isArray(raw[0]))raw=raw[0];return raw.map(function(p){if(Array.isArray(p)&&p.length>=2)return {lat:Number(p[0]),lng:Number(p[1])};if(p&&validPoint(p.lat??p.latitude,p.lng??p.longitude))return {lat:Number(p.lat??p.latitude),lng:Number(p.lng??p.longitude)};return null}).filter(Boolean).filter(function(p){return validPoint(p.lat,p.lng)})}
    function loadMap(){api('/maps/key').then(function(res){var key=res.data&&res.data.google_maps_api_key;if(!key)throw new Error('key');var s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback=FarmMapGoogleReady';s.async=true;s.defer=true;s.onerror=function(){throw new Error('maps')};document.head.appendChild(s)}).catch(function(){setStatus('',false);showMessage('Map unavailable','The map service could not be loaded. Please try again later.')})}
    window.FarmMapGoogleReady=function(){map=new google.maps.Map(document.getElementById('google-map'),{center:{lat:20.5937,lng:78.9629},zoom:5,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});api('/farms').then(function(res){farms=res.data||[];draw()}).catch(function(){setStatus('',false);showMessage('Unable to load farms','We could not retrieve your farm locations. Please check your connection and try again.')})};
    document.getElementById('map-view').onclick=function(){if(map)map.setMapTypeId('roadmap');this.classList.add('active');document.getElementById('sat-view').classList.remove('active')};document.getElementById('sat-view').onclick=function(){if(map)map.setMapTypeId('satellite');this.classList.add('active');document.getElementById('map-view').classList.remove('active')};document.getElementById('locate').onclick=function(){if(!navigator.geolocation){if(typeof showToast==='function')showToast('Location access is unavailable.','error');return}navigator.geolocation.getCurrentPosition(function(p){var pos={lat:p.coords.latitude,lng:p.coords.longitude};if(map){map.panTo(pos);map.setZoom(16);if(currentMarker)currentMarker.setMap(null);currentMarker=new google.maps.Marker({map:map,position:pos,title:'Your current location',icon:{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="#4285f4" stroke="white" stroke-width="3"/></svg>')}})}},function(){if(typeof showToast==='function')showToast('Location access is unavailable.','error')},{enableHighAccuracy:true,timeout:10000})};document.getElementById('fullscreen').onclick=function(){var page=document.getElementById('map-page');page.classList.toggle('fullscreen');this.innerHTML=page.classList.contains('fullscreen')?'<i class="fa-solid fa-compress"></i>':'<i class="fa-solid fa-expand"></i>';if(map)google.maps.event.trigger(map,'resize')};loadMap();
  })();
  </script>
</body></html>
