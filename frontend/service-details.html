<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="services">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Service Details - Farm Assist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .sd-hero {
      background: linear-gradient(135deg, #0F2E1E 0%, #1B5E3F 70%, #2D8659 100%);
      border-radius: var(--radius-xl); padding: 24px; color: #fff; margin-bottom: 16px;
      position: relative; overflow: hidden; box-shadow: 0 8px 32px rgba(27,67,50,0.25);
    }
    .sd-hero::after {
      content: ''; position: absolute; top: -70px; right: -50px; width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 60%);
    }
    .sd-hero .sd-icon {
      width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 14px;
    }
    .sd-hero h1 { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .sd-hero .sd-sub { color: rgba(255,255,255,0.75); font-size: 12px; margin-bottom: 14px; }
    .sd-hero .sd-badges { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
    .sd-badge {
      display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700;
      padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,0.16); color: #fff;
    }
    .sd-section-title {
      font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .sd-section-title i { color: var(--primary-green); }
    .sd-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    @media (max-width: 480px) { .sd-info-grid { grid-template-columns: 1fr; } }
    .sd-info-cell { background: var(--bg-card-soft); border-radius: 12px; padding: 12px 14px; }
    .sd-info-cell .k { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
    .sd-info-cell .v { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .sd-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .sd-actions button {
      flex: 1; min-width: 130px; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.2s;
    }
    .sd-actions .sd-book { background: var(--primary-green); color: #fff; box-shadow: 0 4px 14px rgba(45,106,79,0.3); }
    .sd-actions .sd-book:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .sd-actions .sd-contact { background: var(--bg-card-soft); color: var(--text-secondary); border: 1px solid var(--border-light); }
    .sd-actions .sd-contact:hover { background: var(--soft-green); color: var(--primary-green); }
    .sd-actions .sd-icon-btn { flex: 0 0 48px; min-width: 48px; background: white; border: 1px solid var(--border-light); color: var(--text-secondary); }
    .sd-actions .sd-icon-btn.active, .sd-actions .sd-icon-btn:hover { color: var(--danger); border-color: var(--danger); }
    .sd-rating-bar { display: flex; flex-direction: column; gap: 8px; }
    .sd-rating-row { display: flex; align-items: center; gap: 10px; }
    .sd-rating-row .rk { font-size: 11px; color: var(--text-secondary); width: 22px; flex-shrink: 0; }
    .sd-rating-track { flex: 1; height: 8px; background: var(--bg-card-soft); border-radius: 6px; overflow: hidden; }
    .sd-rating-fill { height: 100%; background: var(--sun-yellow); border-radius: 6px; }
    .sd-rating-row .rc { font-size: 10px; color: var(--text-muted); width: 30px; text-align: right; flex-shrink: 0; }
    .sd-review { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
    .sd-review:last-child { border-bottom: none; }
    .sd-review .rv-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-green); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .sd-review .rv-body { flex: 1; min-width: 0; }
    .sd-review .rv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sd-review .rv-name { font-size: 12px; font-weight: 700; color: var(--text-primary); }
    .sd-review .rv-stars { font-size: 10px; color: var(--sun-yellow); }
    .sd-review .rv-text { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
    .sd-review .rv-date { font-size: 10px; color: var(--text-muted); }
    .sd-skeleton { background: white; border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-light); }
    .sd-sk { border-radius: 8px; background: linear-gradient(90deg, var(--border-light) 25%, var(--bg-card) 50%, var(--border-light) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; margin-bottom: 12px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sd-sk-icon { width: 56px; height: 56px; border-radius: 16px; }
    .sd-sk-line { height: 14px; }
    .sd-sk-line.w-40 { width: 40%; }
    .sd-sk-line.w-70 { width: 70%; }
    .sd-sk-line.w-90 { width: 90%; }
    .sd-sk-btn { height: 44px; border-radius: 12px; }
  </style>
</head>
<body>

  <main class="page-container">


    <!-- Skeleton -->
    <div class="sd-skeleton" id="sd-skeleton">
      <div class="sd-sk sd-sk-icon"></div>
      <div class="sd-sk sd-sk-line w-70"></div>
      <div class="sd-sk sd-sk-line w-40"></div>
      <div class="sd-sk sd-sk-line w-90"></div>
      <div class="sd-sk sd-sk-btn"></div>
    </div>

    <!-- Content -->
    <div id="sd-content" style="display:none;"></div>

  </main>

  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      'use strict';

      var SERVICES = [
        { id: 'svc-1',  name: 'Offline Support',                icon: 'fa-wifi-slash',    color: '#6C63FF', category: 'farm-work',     availability: 'available', respTime: 'Instant',   desc: 'Get help when you\'re offline with cached resources and guides', rating: 4.6, reviews: 214, price: 'Free' },
        { id: 'svc-2',  name: 'Expert Consultation',            icon: 'fa-user-tie',      color: '#1B5E3F', category: 'consultation',  availability: 'available', respTime: '< 30 min', desc: 'Talk to agriculture experts via chat/call', rating: 4.8, reviews: 468, price: '&#8377;199 / session' },
        { id: 'svc-3',  name: 'Farm Visit',                     icon: 'fa-tractor',       color: '#2D8659', category: 'farm-work',     availability: 'busy',     respTime: '24 hrs',   desc: 'Schedule an on-farm visit by experts', rating: 4.7, reviews: 189, price: '&#8377;499 / visit' },
        { id: 'svc-4',  name: 'Soil Testing Assistance',        icon: 'fa-flask',         color: '#8D6E63', category: 'consultation',  availability: 'available', respTime: '< 2 hrs',  desc: 'Get soil tested, understand NPK levels', rating: 4.9, reviews: 352, price: '&#8377;299' },
        { id: 'svc-5',  name: 'Crop Advisory',                  icon: 'fa-seedling',      color: '#4CAF50', category: 'consultation',  availability: 'available', respTime: '< 1 hr',   desc: 'Crop-specific guidance from sowing to harvest', rating: 4.8, reviews: 521, price: '&#8377;249 / query' },
        { id: 'svc-6',  name: 'Government Scheme Assistance',   icon: 'fa-file-contract', color: '#1565C0', category: 'documentation', availability: 'limited',  respTime: '2-3 days', desc: 'Help with applications, documents, tracking', rating: 4.5, reviews: 143, price: '&#8377;149' },
        { id: 'svc-7',  name: 'Insurance Assistance',           icon: 'fa-shield-alt',    color: '#E65100', category: 'financial',     availability: 'available', respTime: '< 4 hrs',  desc: 'Policy selection, claims, renewals', rating: 4.6, reviews: 278, price: 'Free' },
        { id: 'svc-8',  name: 'Loan Assistance',                icon: 'fa-coins',         color: '#F9A825', category: 'financial',     availability: 'available', respTime: '< 24 hrs', desc: 'Find and apply for agri loans', rating: 4.7, reviews: 301, price: 'Free' },
        { id: 'svc-9',  name: 'Documentation Assistance',       icon: 'fa-file-alt',      color: '#5D4037', category: 'documentation', availability: 'available', respTime: '< 2 hrs',  desc: 'Help with land records, certificates', rating: 4.4, reviews: 156, price: '&#8377;199' },
        { id: 'svc-10', name: 'Equipment Assistance',           icon: 'fa-cogs',          color: '#7B1FA2', category: 'farm-work',     availability: 'limited',  respTime: '1-2 days', desc: 'Find and book farm equipment', rating: 4.5, reviews: 197, price: 'Varies' },
        { id: 'svc-11', name: 'Worker Assistance',              icon: 'fa-users',         color: '#0D47A1', category: 'farm-work',     availability: 'available', respTime: '< 1 hr',   desc: 'Find skilled farm workers', rating: 4.3, reviews: 122, price: '&#8377;50 / day' },
        { id: 'svc-12', name: 'Technical Support',              icon: 'fa-headset',       color: '#37474F', category: 'farm-work',     availability: 'available', respTime: '< 30 min', desc: 'App and device support', rating: 4.9, reviews: 87, price: 'Free' }
      ];

      var RATINGS = [
        { star: 5, pct: 78 }, { star: 4, pct: 16 }, { star: 3, pct: 4 }, { star: 2, pct: 1 }, { star: 1, pct: 1 }
      ];

      var REVIEWS = [
        { name: 'Ramesh Patil', initials: 'RP', stars: 5, date: 'Jul 22, 2026', text: 'Very helpful service. The expert understood my problem quickly and gave practical advice that saved my crop.' },
        { name: 'Sunita Devi', initials: 'SD', stars: 5, date: 'Jul 18, 2026', text: 'Quick response and clear guidance. Highly recommended for every farmer.' },
        { name: 'Mohammed Irfan', initials: 'MI', stars: 4, date: 'Jul 12, 2026', text: 'Good experience overall. Response was prompt and the follow-up was thorough.' },
        { name: 'Lakshmi Naidu', initials: 'LN', stars: 5, date: 'Jul 05, 2026', text: 'Affordable and reliable. Helped me with documentation for a government scheme.' }
      ];

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function starsHtml(rating) {
        var html = '';
        var full = Math.floor(rating);
        var half = (rating - full) >= 0.5;
        for (var i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
        if (half) html += '<i class="fas fa-star-half-alt"></i>';
        var rem = full + (half ? 1 : 0);
        for (var j = rem; j < 5; j++) html += '<i class="far fa-star"></i>';
        return html;
      }

      function findService(id) {
        for (var i = 0; i < SERVICES.length; i++) {
          if (SERVICES[i].id === id) return SERVICES[i];
        }
        return SERVICES[1];
      }

      function renderDetail(service) {
        document.getElementById('sd-skeleton').style.display = 'none';
        var content = document.getElementById('sd-content');
        content.style.display = 'block';

        var favKey = 'fa-fav-services';
        var favs = [];
        try { favs = JSON.parse(localStorage.getItem(favKey)) || []; } catch (e) { favs = []; }
        var isFav = favs.indexOf(service.id) !== -1;

        var ratingBars = RATINGS.map(function (r) {
          return '<div class="sd-rating-row">' +
            '<span class="rk">' + r.star + '<i class="fas fa-star" style="font-size:9px;color:var(--sun-yellow);margin-left:2px;"></i></span>' +
            '<div class="sd-rating-track"><div class="sd-rating-fill" style="width:' + r.pct + '%;"></div></div>' +
            '<span class="rc">' + r.pct + '%</span>' +
          '</div>';
        }).join('');

        var reviewsHtml = REVIEWS.map(function (rv) {
          return '<div class="sd-review">' +
            '<div class="rv-avatar">' + rv.initials + '</div>' +
            '<div class="rv-body">' +
              '<div class="rv-top"><span class="rv-name">' + esc(rv.name) + '</span><span class="rv-date">' + esc(rv.date) + '</span></div>' +
              '<div class="rv-stars">' + starsHtml(rv.stars) + '</div>' +
              '<div class="rv-text">' + esc(rv.text) + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        content.innerHTML =
          '<div class="sd-hero">' +
            '<div class="sd-icon"><i class="fas ' + service.icon + '"></i></div>' +
            '<h1>' + esc(service.name) + '</h1>' +
            '<div class="sd-sub">' + esc(service.desc) + '</div>' +
            '<div class="sd-badges">' +
              '<span class="sd-badge"><i class="fas fa-star" style="color:var(--sun-yellow);"></i> ' + service.rating + ' (' + service.reviews + ')</span>' +
              '<span class="sd-badge"><i class="fas fa-bolt"></i> ' + esc(service.respTime) + '</span>' +
              '<span class="sd-badge"><i class="fas fa-tag"></i> ' + service.price + '</span>' +
            '</div>' +
          '</div>' +

          '<div class="sd-actions">' +
            '<button class="sd-book" onclick="bookService(\'' + service.id + '\')"><i class="fas fa-calendar-check"></i> Book Now</button>' +
            '<button class="sd-contact" onclick="contactSupport(\'' + service.id + '\')"><i class="fas fa-headset"></i> Contact Support</button>' +
            '<button class="sd-icon-btn' + (isFav ? ' active' : '') + '" id="fav-btn" onclick="toggleFavorite(\'' + service.id + '\')" aria-label="Add to favorites" title="Add to favorites"><i class="fas fa-heart"></i></button>' +
            '<button class="sd-icon-btn" onclick="shareService()" aria-label="Share service" title="Share"><i class="fas fa-share-alt"></i></button>' +
          '</div>' +

          '<section class="card-premium">' +
            '<div class="sd-section-title"><i class="fas fa-circle-info"></i> About this service</div>' +
            '<div class="sd-info-grid">' +
              '<div class="sd-info-cell"><div class="k">Category</div><div class="v">' + esc(service.category.replace('-', ' ')) + '</div></div>' +
              '<div class="sd-info-cell"><div class="k">Availability</div><div class="v">' + esc(service.availability.charAt(0).toUpperCase() + service.availability.slice(1)) + '</div></div>' +
              '<div class="sd-info-cell"><div class="k">Estimated Response</div><div class="v">' + esc(service.respTime) + '</div></div>' +
              '<div class="sd-info-cell"><div class="k">Pricing</div><div class="v">' + service.price + '</div></div>' +
            '</div>' +
            '<p style="font-size:12px;color:var(--text-secondary);line-height:1.6;">' + esc(service.desc) + '. Our certified experts are available to help you with this service across your farm. Book a slot and we will assign a specialist promptly.</p>' +
          '</section>' +

          '<section class="card-premium">' +
            '<div class="sd-section-title"><i class="fas fa-star" style="color:var(--sun-yellow);"></i> Ratings & Reviews</div>' +
            '<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">' +
              '<div style="text-align:center;">' +
                '<div style="font-size:34px;font-weight:800;color:var(--text-primary);font-family:\'Outfit\',sans-serif;">' + service.rating + '</div>' +
                '<div class="rv-stars" style="font-size:12px;color:var(--sun-yellow);">' + starsHtml(service.rating) + '</div>' +
                '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">' + service.reviews + ' reviews</div>' +
              '</div>' +
              '<div class="sd-rating-bar" style="flex:1;">' + ratingBars + '</div>' +
            '</div>' +
            '<div style="border-top:1px solid var(--border-light);padding-top:12px;">' + reviewsHtml + '</div>' +
          '</section>';

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      window.bookService = function (id) {
        var s = findService(id);
        if (typeof showToast === 'function') {
          showToast('Opening booking for ' + s.name + '...', 'info');
        }
        setTimeout(function () { window.location.href = 'services.html?book=' + encodeURIComponent(id); }, 600);
      };

      window.contactSupport = function (id) {
        var s = findService(id);
        if (typeof showToast === 'function') {
          showToast('Connecting you to ' + s.name + ' support...', 'info');
        }
        setTimeout(function () {
          var key = 'farm-chat-contacts';
          var contacts = [];
          try { contacts = JSON.parse(localStorage.getItem(key)) || []; } catch (e) {}
          if (!Array.isArray(contacts)) contacts = [];
          var contactId = 'svc-support-' + s.id;
          var existing = contacts.filter(function (c) { return c.id === contactId; });
          if (existing.length === 0) {
            contacts.unshift({
              id: contactId,
              name: s.name + ' Support',
              color: s.color || '#2D8659',
              phone: '',
              farmerId: 'SUPPORT',
              location: 'Farm Assist Service Desk',
              bio: 'Chat with the ' + s.name + ' team',
              status: 'online',
              lastSeen: 'online',
              unread: 1
            });
            try { localStorage.setItem(key, JSON.stringify(contacts)); } catch (e) {}
          }
          var msgKey = 'farm-chat-' + contactId;
          var msgs = [];
          try { msgs = JSON.parse(localStorage.getItem(msgKey)) || []; } catch (e) {}
          if (!Array.isArray(msgs) || msgs.length === 0) {
            msgs = [{
              id: 1,
              type: 'incoming',
              text: 'Welcome to ' + s.name + ' support. How can we help you today?',
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              date: 'Today'
            }];
            try { localStorage.setItem(msgKey, JSON.stringify(msgs)); } catch (e) {}
          }
        }, 200);
        setTimeout(function () { window.location.href = 'messages.html?svc=support-' + s.id; }, 800);
      };

      window.toggleFavorite = function (id) {
        var key = 'fa-fav-services';
        var favs = [];
        try { favs = JSON.parse(localStorage.getItem(key)) || []; } catch (e) { favs = []; }
        var idx = favs.indexOf(id);
        var btn = document.getElementById('fav-btn');
        if (idx !== -1) {
          favs.splice(idx, 1);
          if (btn) btn.classList.remove('active');
          if (typeof showToast === 'function') showToast('Removed from favorites', 'info');
        } else {
          favs.push(id);
          if (btn) btn.classList.add('active');
          if (typeof showToast === 'function') showToast('Added to favorites', 'success');
        }
        try { localStorage.setItem(key, JSON.stringify(favs)); } catch (e) {}
      };

      window.shareService = function () {
        var s = findService(currentServiceId);
        var data = { title: s.name + ' - Farm Assist', text: s.desc };
        if (navigator.share) {
          navigator.share(data).catch(function () {});
        } else {
          var url = window.location.href;
          var dummy = document.createElement('textarea');
          dummy.value = s.name + ': ' + s.desc + ' ' + url;
          document.body.appendChild(dummy);
          dummy.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(dummy);
          if (typeof showToast === 'function') showToast('Link copied to clipboard', 'success');
        }
      };

      var currentServiceId = null;

      document.addEventListener('DOMContentLoaded', function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || 'svc-2';
        currentServiceId = id;
        var service = findService(id);
        setTimeout(function () {
          renderDetail(service);
        }, 500);
      });
    })();
  </script>
</body>
</html>
