<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Government Schemes | Farm Assist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/schemes.css">
</head>
<body class="app-page">

  <!-- Sidebar / Navigation injected by navigation.js -->

  <main class="page-content" id="page-content" role="main">
    <div class="schemes-wrap">

      <!-- ============================== PAGE HEADER ============================== -->
      <header class="schemes-header">
        <div class="schemes-header-text">
          <h1 class="schemes-title"><i class="fas fa-landmark" aria-hidden="true"></i> Government Schemes</h1>
          <p class="schemes-subtitle">Discover government schemes, subsidies, financial assistance and agricultural benefits available to you.</p>
        </div>
      </header>

      <!-- ============================== TOOLBAR (Filter + Applied) ============================== -->
      <div class="schemes-toolbar">
        <button type="button" class="schemes-applied-btn schemes-filter-btn" id="filterToggleBtn" aria-expanded="false" aria-controls="filterPanel">
          <i class="fas fa-filter" aria-hidden="true"></i>
          <span>Filters</span>
          <span class="schemes-filters-badge" id="filterActiveBadge" hidden><i class="fas fa-circle"></i></span>
        </button>
        <span class="schemes-toolbar-right">
          <span class="schemes-lastupd" id="syncStatusWrap" hidden>
            <i class="fa-solid fa-circle-check schemes-lastupd-icon" id="syncStatusIcon" aria-hidden="true"></i>
            <span id="syncStatusText">Checking official sources...</span>
          </span>
          <button type="button" class="schemes-icon-btn" id="schemesRefreshBtn" aria-label="Refresh schemes from official sources" title="Refresh from official sources">
            <i class="fas fa-rotate-right" aria-hidden="true"></i>
          </button>
          <button type="button" class="schemes-applied-btn" id="appliedBtn" aria-label="My Applications">
            <i class="fas fa-clipboard-check" aria-hidden="true"></i>
            <span>Applied</span>
            <span class="schemes-applied-count" id="appliedCount" hidden>0</span>
          </button>
        </span>
      </div>

      <!-- ============================== FILTER PANEL (Search + State) ============================== -->
      <div class="schemes-filter-panel" id="filterPanel" hidden>
        <div class="schemes-search">
          <i class="fas fa-search schemes-search-icon" aria-hidden="true"></i>
          <label class="sr-only" for="schemeSearchInput">Search government schemes</label>
          <input type="text" id="schemeSearchInput" class="schemes-search-input" placeholder="Search schemes, subsidies, crop support..." autocomplete="off" aria-label="Search government schemes">
          <button type="button" class="schemes-search-clear" id="schemeSearchClear" aria-label="Clear search" hidden><i class="fas fa-times-circle"></i></button>
        </div>
        <div class="schemes-filter-row">
          <label class="schemes-filter-label" for="filterState">State</label>
          <select id="filterState" class="schemes-filter-select" aria-label="Filter by state">
            <option value="">All States</option>
          </select>
        </div>
        <div class="schemes-filter-actions">
          <button type="button" class="schemes-filter-apply" id="filterApply"><i class="fas fa-check"></i> Apply Filters</button>
          <button type="button" class="schemes-filter-reset" id="filterReset"><i class="fas fa-undo"></i> Reset</button>
        </div>
      </div>

      <!-- ============================== CATEGORY QUICK FILTERS ============================== -->
      <nav class="schemes-cats" id="schemesCats" aria-label="Scheme categories">
        <button type="button" class="schemes-cat-chip is-active" data-cat="" aria-pressed="true">All</button>
      </nav>

      <!-- ============================== RECOMMENDED FOR YOU ============================== -->
      <section class="schemes-section" id="recommendedSection" hidden aria-labelledby="recommendedTitle">
        <h2 class="schemes-section-title" id="recommendedTitle"><i class="fas fa-star" aria-hidden="true"></i> Recommended for You</h2>
        <div class="schemes-grid" id="recommendedGrid"></div>
      </section>

      <!-- ============================== ALL SCHEMES ============================== -->
      <section class="schemes-section" aria-labelledby="allSchemesTitle">
        <div class="schemes-section-head">
          <h2 class="schemes-section-title" id="allSchemesTitle"><i class="fas fa-layer-group" aria-hidden="true"></i> All Schemes <span class="schemes-total" id="schemesTotal"></span></h2>
          <div class="schemes-sort">
            <label class="sr-only" for="schemeSort">Sort schemes</label>
            <select id="schemeSort" class="schemes-sort-select" aria-label="Sort schemes">
              <option value="recent">Most Recent</option>
              <option value="alpha">Alphabetical</option>
              <option value="deadline">Deadline</option>
            </select>
          </div>
        </div>
        <div class="schemes-grid" id="schemesGrid" aria-live="polite"></div>
        <div class="schemes-loadmore-wrap" id="loadMoreWrap" hidden>
          <button type="button" class="schemes-loadmore" id="loadMoreBtn">Load More Schemes</button>
        </div>
      </section>
    </div>

    <!-- ============================== SAVED SCHEMES SECTION ============================== -->
    <section class="schemes-wrap" id="savedSection" hidden aria-labelledby="savedTitle">
      <h2 class="schemes-section-title" id="savedTitle"><i class="fas fa-bookmark" aria-hidden="true"></i> Saved Schemes</h2>
      <p class="schemes-section-note">Your bookmarked schemes are saved so you can find them later.</p>
      <div class="schemes-grid" id="savedGrid"></div>
    </section>

    <!-- ============================== DETAILS DIALOG ============================== -->
    <div class="scheme-modal" id="schemeModal" role="dialog" aria-modal="true" aria-labelledby="schemeModalTitle" hidden>
      <div class="scheme-modal-backdrop" data-close-modal></div>
      <div class="scheme-modal-panel" role="document">
        <button type="button" class="scheme-modal-close" data-close-modal aria-label="Close details"><i class="fas fa-times"></i></button>
        <div id="schemeModalBody"></div>
      </div>
    </div>

    <!-- ============================== APPLIED DRAWER ============================== -->
    <div class="scheme-modal" id="appliedModal" role="dialog" aria-modal="true" aria-labelledby="appliedModalTitle" hidden>
      <div class="scheme-modal-backdrop" data-close-applied></div>
      <div class="scheme-modal-panel scheme-applied-panel" role="document">
        <button type="button" class="scheme-modal-close" data-close-applied aria-label="Close applications"><i class="fas fa-times"></i></button>
        <div id="appliedModalBody"></div>
      </div>
    </div>

    <!-- ============================== CONFIRM APPLY MODAL ============================== -->
    <div class="scheme-modal" id="applyModal" role="dialog" aria-modal="true" aria-labelledby="applyModalTitle" hidden>
      <div class="scheme-modal-backdrop" data-close-apply></div>
      <div class="scheme-modal-panel scheme-apply-confirm" role="document">
        <div id="applyModalBody"></div>
      </div>
    </div>

  </main>

  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    (function () {
      'use strict';

      function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function txt(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[<>]/g, '');
      }

      function fmtDate(v) {
        if (!v) return null;
        var d;
        var s = String(v).replace(' ', 'T');
        if (s.indexOf('T') >= 0 || /^\d{4}-\d{2}-\d{2}/.test(s)) {
          d = new Date(s);
        } else {
          d = new Date(v);
        }
        if (isNaN(d.getTime())) return null;
        return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      function showToast(msg, type) {
        if (window.showToast) window.showToast(msg, type || 'success');
      }

      function money(v) {
        if (v === null || v === undefined || v === '' || v === 0) return null;
        var n = Number(v);
        if (isNaN(n)) return String(v);
        if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
        if (n >= 100000) return '₹' + (n / 100000).toFixed(2).replace(/\.?0+$/, '') + ' Lakh';
        if (n >= 1000) return '₹' + n.toLocaleString('en-IN');
        return '₹' + n;
      }

      function benefitText(s) {
        if (s && s.benefits) {
          if (Array.isArray(s.benefits) && s.benefits.length) return txt(s.benefits[0]);
          if (typeof s.benefits === 'string' && s.benefits.trim()) return txt(s.benefits);
        }
        if (s && s.benefit) return String(s.benefit);
        if (s && s.benefit_type) return prettyBenefit(s.benefit_type) || txt(s.benefit_type);
        return null;
      }

      function prettyEligType(v) {
        var s = String(v || '').toLowerCase();
        if (s.indexOf('small') >= 0) return 'Small Farmers';
        if (s.indexOf('marginal') >= 0) return 'Marginal Farmers';
        if (s.indexOf('tenant') >= 0) return 'Tenant Farmers';
        if (s.indexOf('women') >= 0) return 'Women Farmers';
        if (s.indexOf('landless') >= 0) return 'Landless Farmers';
        if (s.indexOf('landhold') >= 0) return 'Landholding Farmers';
        if (s.indexOf('farmer') >= 0) return 'All Farmers';
        if (s.trim()) return txt(String(v));
        return null;
      }

      function prettyBenefit(v) {
        var s = String(v || '').toLowerCase();
        if (s.indexOf('income') >= 0) return 'Direct Income Support';
        if (s.indexOf('pension') >= 0) return 'Monthly Pension';
        if (s.indexOf('insurance') >= 0) return 'Insurance Cover';
        if (s.indexOf('loan') >= 0 || s.indexOf('credit') >= 0) return 'Subsidised Credit';
        if (s.indexOf('subsid') >= 0) return 'Subsidy Support';
        if (s.indexOf('grant') >= 0) return 'Grant Support';
        if (s.indexOf('market') >= 0) return 'Market Access Support';
        if (s.indexOf('equip') >= 0 || s.indexOf('mechani') >= 0) return 'Equipment Subsidy';
        if (s.trim()) return txt(String(v));
        return null;
      }

      function deadlineInfo(s) {
        if (!s || !s.application_deadline) return { label: 'Ongoing', cls: 'ongoing' };
        var d = new Date(s.application_deadline);
        if (isNaN(d.getTime())) return { label: 'Ongoing', cls: 'ongoing' };
        var today = new Date(); today.setHours(0, 0, 0, 0);
        d.setHours(0, 0, 0, 0);
        var days = Math.round((d - today) / 86400000);
        if (days < 0) return { label: 'Closed ' + fmtDate(s.application_deadline), cls: 'closed' };
        if (days === 0) return { label: 'Closes today', cls: 'soon' };
        if (days <= 14) return { label: 'Closes in ' + days + ' day' + (days > 1 ? 's' : ''), cls: 'soon' };
        return { label: 'Closes ' + fmtDate(s.application_deadline), cls: 'open' };
      }

      function categoryLabel(s) {
        if (!s) return 'Scheme';
        return txt(s.category || s.benefit_type || s.level || 'Scheme').toUpperCase();
      }

      function statusBadge(s, appliedIds) {
        if (appliedIds && appliedIds[s.id]) {
          return '<span class="schemes-badge applied"><i class="fas fa-check-circle"></i> Applied</span>';
        }
        return '<span class="schemes-badge"><i class="fas fa-tag"></i> ' + categoryLabel(s) + '</span>';
      }

      function card(s, appliedIds) {
        var dl = deadlineInfo(s);
        var bf = benefitText(s);
        var isApplied = !!(appliedIds && appliedIds[s.id]);
        var secondary = isApplied
          ? '<button type="button" class="scheme-card-btn ghost" data-appstatus="' + esc(s.id) + '"><i class="fas fa-clipboard-check"></i> Status</button>'
          : '<button type="button" class="scheme-card-btn ghost" data-apply-card="' + esc(s.id) + '"><i class="fas fa-paper-plane"></i> Apply</button>';
        return '<article class="scheme-card" data-id="' + esc(s.id) + '">' +
          '<div class="scheme-card-top">' +
            statusBadge(s, appliedIds) +
            (s.is_saved ? '<span class="schemes-card-bookmarked" title="Saved"><i class="fas fa-bookmark"></i></span>' : '') +
          '</div>' +
          '<h3 class="scheme-card-title">' + esc(s.name) + '</h3>' +
          '<p class="scheme-card-desc">' + (s.description ? esc(s.description) : esc(s.overview || '')) + '</p>' +
          '<div class="scheme-card-meta">' +
            (bf !== null ? '<div class="scheme-card-meta-item"><i class="fas fa-wallet"></i><span><small>Benefit</small><strong>' + esc(bf) + '</strong></span></div>' : '') +
            '<div class="scheme-card-meta-item"><i class="fas fa-user-check"></i><span><small>Eligibility</small><strong>' + esc(eligShort(s)) + '</strong></span></div>' +
            '<div class="scheme-card-meta-item"><i class="fas fa-building"></i><span><small>Department</small><strong>' + esc(deptShort(s)) + '</strong></span></div>' +
            '<div class="scheme-card-meta-item"><i class="fas fa-calendar-alt"></i><span><small>Deadline</small><strong class="dl-' + dl.cls + '">' + esc(dl.label) + '</strong></span></div>' +
          '</div>' +
          '<div class="scheme-card-actions">' +
            '<button type="button" class="scheme-card-btn primary" data-view="' + esc(s.id) + '"><i class="fas fa-arrow-right"></i> View Details</button>' +
            secondary +
            '<button type="button" class="scheme-card-btn subtle-ghost" data-toggle-save="' + esc(s.id) + '" aria-label="' + (s.is_saved ? 'Unsave scheme' : 'Save scheme') + '" title="' + (s.is_saved ? 'Unsave scheme' : 'Save scheme') + '">' +
              '<i class="fas ' + (s.is_saved ? 'fa-bookmark' : 'fa-bookmark-o') + '"></i></button>' +
          '</div>' +
        '</article>';
      }

      function eligShort(s) {
        if (s && s.eligible_farmer_types && s.eligible_farmer_types.length) {
          var p = prettyEligType(s.eligible_farmer_types[0]);
          if (p) return p;
        }
        var e = txt(s.eligibility || '');
        if (e) return e.length > 34 ? e.slice(0, 34) + '…' : e;
        return 'Varies by scheme';
      }

      function deptShort(s) {
        var d = txt(s.department || s.authority || '');
        if (!d) {
          return s.level ? s.level.charAt(0).toUpperCase() + s.level.slice(1) : 'Government';
        }
        return d.length > 26 ? d.slice(0, 26) + '…' : d;
      }

      function grid(el, items, appliedIds) {
        if (!items || !items.length) return '';
        var html = '';
        for (var i = 0; i < items.length; i++) html += card(items[i], appliedIds);
        el.innerHTML = html;
        return html;
      }

      function renderSkeletons(el, n) {
        var h = '';
        for (var i = 0; i < (n || 4); i++) {
          h += '<div class="scheme-card scheme-card-skel">' +
            '<div class="skeleton-loader" style="height:14px;width:70px;border-radius:6px;"></div>' +
            '<div class="skeleton-loader" style="height:18px;width:85%;margin:14px 0 8px;border-radius:6px;"></div>' +
            '<div class="skeleton-loader" style="height:12px;width:100%;margin:4px 0;border-radius:6px;"></div>' +
            '<div class="skeleton-loader" style="height:12px;width:90%;margin:4px 0;border-radius:6px;"></div>' +
            '<div class="skeleton-loader" style="height:12px;width:95%;margin:4px 0;border-radius:6px;"></div>' +
            '<div class="skeleton-loader" style="height:40px;width:100%;margin:16px 0 0;border-radius:10px;"></div>' +
          '</div>';
        }
        el.innerHTML = h;
        if (window.initSkeletonLoaders) window.initSkeletonLoaders();
      }

      function state(container, icon, title, sub, retryFn) {
        var el = typeof container === 'string' ? document.getElementById(container) : container;
        var html = '<div class="schemes-state">' +
          '<div class="schemes-state-icon"><i class="fas ' + icon + '"></i></div>' +
          '<h4>' + title + '</h4>' +
          (sub ? '<p>' + sub + '</p>' : '') +
          (retryFn ? '<button type="button" class="schemes-state-btn">Retry</button>' : '') +
        '</div>';
        el.innerHTML = html;
        if (retryFn) {
          var btn = el.querySelector('.schemes-state-btn');
          if (btn) btn.addEventListener('click', retryFn);
        }
      }

      // =====================================================================
      // STATE
      // =====================================================================
      var State = {
        all: [],
        search: '',
        category: '',
        state: '',
        sort: 'recent',
        page: 1,
        limit: 12,
        recommended: [],
        savedIds: {},
        appliedIds: {},
        loadFn: null,
        failCount: 0,
        loadRequest: 0
      };

      // =====================================================================
      // DATA LOADING
      // =====================================================================
      function loadTokenStores() {
        var saved = null, applied = null;
        if (API && API.GovernmentService && API.GovernmentService.savedSchemes) {
          saved = API.GovernmentService.savedSchemes();
        }
        if (API && API.GovernmentService && API.GovernmentService.listApplications) {
          applied = API.GovernmentService.listApplications();
        }
        resetTokenStores(saved, applied);
      }

      function resetTokenStores(saved, applied) {
        State.savedIds = {};
        State.appliedIds = {};
        Promise.resolve(saved || Promise.resolve({ items: [] })).then(function (r) {
          var items = (r && (r.items || r)) || [];
          if (Array.isArray(items)) {
            State.savedAll = items;
            for (var i = 0; i < items.length; i++) {
              var s = items[i];
              if (s && s.id) State.savedIds[s.id] = true;
            }
          }
          refreshAllGrids();
        }).catch(function () {});

        Promise.resolve(applied || Promise.resolve({ items: [] })).then(function (r) {
          var items = (r && (r.items || r)) || [];
          if (Array.isArray(items)) {
            for (var j = 0; j < items.length; j++) {
              var a = items[j];
              if (a && (a.scheme_id || a.schemeId)) State.appliedIds[a.scheme_id || a.schemeId] = true;
            }
          }
          updateAppliedCount();
          refreshAllGrids();
        }).catch(function () {});
      }

      function updateAppliedCount() {
        var count = Object.keys(State.appliedIds).length;
        var el = document.getElementById('appliedCount');
        if (el) {
          el.textContent = count;
          el.hidden = count === 0;
        }
      }

      function refreshAllGrids() {
        grid(document.getElementById('schemesGrid'), State.all, State.appliedIds);
        bindCardEvents(document.getElementById('schemesGrid'));
        grid(document.getElementById('recommendedGrid'), State.recommended, State.appliedIds);
        bindCardEvents(document.getElementById('recommendedGrid'));
        var savedData = State.savedAll;
        if (savedData) {
          grid(document.getElementById('savedGrid'), savedData, State.appliedIds);
          bindCardEvents(document.getElementById('savedGrid'));
        }
      }

      function loadSchemes(reset) {
        if (reset) { State.page = 1; State.failCount = 0; }
        var gridEl = document.getElementById('schemesGrid');
        var requestId = ++State.loadRequest;
        // Skip skeletons when we already rendered a fast client-side preview
        // (active search with cards on screen) to avoid flashing over results.
        if (State.page === 1 && !((State.search || State.state) && gridEl.querySelector('.scheme-card'))) renderSkeletons(gridEl, 4);

        var params = { limit: State.limit, page: State.page };
        if (State.search) params.search = State.search;
        if (State.category) params.category = State.category;
        if (State.state) params.state = State.state;
        if (State.sort) params.sort = State.sort;

        API.GovernmentService.listSchemes(params).then(function (data) {
          if (requestId !== State.loadRequest) return;
          var items = (data && data.items) || [];
          if (State.page === 1) State.all = items;
          else State.all = State.all.concat(items);
          var total = (data && data.total) || State.all.length;
          document.getElementById('schemesTotal').textContent = '(' + total + ')';

          var html = '';
          for (var i = 0; i < State.all.length; i++) html += card(State.all[i], State.appliedIds);
          gridEl.innerHTML = html || '';
          bindCardEvents(gridEl);

          var hasMore = State.all.length < total;
          if (hasMore) {
            var lm = document.getElementById('loadMoreWrap');
            lm.hidden = false;
          } else {
            document.getElementById('loadMoreWrap').hidden = true;
          }

          if (!State.all.length) {
            if (State.search || State.category || State.state) {
              state(gridEl, 'fa-search-minus', 'No schemes found', 'Try another scheme name, crop, category, state or keyword.');
            } else {
              state(gridEl, 'fa-inbox', 'No schemes available', 'Government schemes will appear here when available.');
            }
          }
          bindDelegatedEvents();
          maybeLoadRecommended();
        }).catch(function (err) {
          if (requestId !== State.loadRequest) return;
          State.failCount++;
          if (err && (err.isAuthError || err.status === 401 || err.status === 403)) {
            state(gridEl, 'fa-lock', 'Sign in required',
              'You need to sign in to view government schemes and track your applications.',
              function () { window.location.href = 'login.html'; });
            return;
          }
          if (State.failCount > 1) {
            state(gridEl, 'fa-exclamation-triangle', 'Unable to load schemes', 'Something went wrong while loading government schemes.', function () { loadSchemes(true); });
          } else {
            loadSchemes(false);
          }
        });
      }

      function maybeLoadRecommended() {
        var sec = document.getElementById('recommendedSection');
        if (!sec.hidden || !API.GovernmentService.recommended) return;
        API.GovernmentService.recommended({ limit: 3 }).then(function (data) {
          var items = (data && data.items) || [];
          if (!items.length) return;
          State.recommended = items;
          sec.hidden = false;
          grid(document.getElementById('recommendedGrid'), items, State.appliedIds);
          bindCardEvents(document.getElementById('recommendedGrid'));
        }).catch(function () {});
      }

      function loadCategories() {
        var catsEl = document.getElementById('schemesCats');
        if (!API.GovernmentService.categories) return;
        API.GovernmentService.categories().then(function (data) {
          var cats = (data && data.categories) || [];
          var html = '<button type="button" class="schemes-cat-chip is-active" data-cat="" aria-pressed="true">All</button>';
          var shown = 0;
          for (var i = 0; i < cats.length; i++) {
            if (shown >= 14 || !cats[i].has_schemes) continue;
            html += '<button type="button" class="schemes-cat-chip" data-cat="' + esc(cats[i].name) + '" aria-pressed="false">' + esc(cats[i].name) + '</button>';
            shown++;
          }
          catsEl.innerHTML = html;
        }).catch(function () {});
      }

      function loadStateFilter() {
        var stateSelect = document.getElementById('filterState');
        if (!stateSelect || !API.GovernmentService.states) return;
        API.GovernmentService.states().then(function (data) {
          var states = (data && data.states) || [];
          var html = '<option value="">All States</option>';
          for (var i = 0; i < states.length; i++) {
            var label = states[i].name + (states[i].count ? ' (' + states[i].count + ')' : '');
            html += '<option value="' + esc(states[i].name) + '">' + esc(label) + '</option>';
          }
          stateSelect.innerHTML = html;
          if (State.state) stateSelect.value = State.state;
        }).catch(function () {
          // Leave the default "All States" option when the states lookup fails.
        });
      }

      function loadSaved() {
        var sec = document.getElementById('savedSection');
        var gridEl = document.getElementById('savedGrid');
        if (!API.GovernmentService.savedSchemes) return;
        API.GovernmentService.savedSchemes({ limit: 100 }).then(function (data) {
          var items = (data && data.items) || [];
          State.savedAll = items;
          if (!items.length) {
            sec.hidden = true;
            return;
          }
          sec.hidden = false;
          grid(gridEl, items, State.appliedIds);
          bindCardEvents(gridEl);
        }).catch(function () {
          sec.hidden = true;
        });
      }

      // =====================================================================
      // CARD EVENT BINDING
      // =====================================================================
      function bindCardEvents(scope) {
        if (!scope) return;
        var views = scope.querySelectorAll('.scheme-card-btn.primary[data-view]');
        for (var i = 0; i < views.length; i++) views[i].addEventListener('click', onViewDetail);
        var saves = scope.querySelectorAll('.scheme-card-btn[data-toggle-save]');
        for (var j = 0; j < saves.length; j++) saves[j].addEventListener('click', onToggleSave);
        var applies = scope.querySelectorAll('.scheme-card-btn[data-apply-card]');
        for (var k = 0; k < applies.length; k++) applies[k].addEventListener('click', onCardApply);
        var statuses = scope.querySelectorAll('.scheme-card-btn[data-appstatus]');
        for (var m = 0; m < statuses.length; m++) statuses[m].addEventListener('click', onAppStatus);
      }

      function bindDelegatedEvents() {
        // rerun for dynamically rendered grids (grid() uses innerHTML)
        bindCardEvents(document.getElementById('recommendedGrid'));
        bindCardEvents(document.getElementById('savedGrid'));
      }

      function onViewDetail(e) {
        e.preventDefault();
        e.stopPropagation();
        openDetails(e.currentTarget.getAttribute('data-view'));
      }

      function onToggleSave(e) {
        e.preventDefault();
        e.stopPropagation();
        var id = e.currentTarget.getAttribute('data-toggle-save');
        var saved = State.savedIds[id];
        toggleSave(id, !saved);
      }

      function onCardApply(e) {
        e.preventDefault();
        e.stopPropagation();
        var id = e.currentTarget.getAttribute('data-apply-card');
        var s = findScheme(id);
        if (s) openApply(s);
      }

      function onAppStatus(e) {
        e.preventDefault();
        e.stopPropagation();
        openApplied();
      }

      function findScheme(id) {
        var lists = [State.all, State.recommended, State.savedAll];
        for (var i = 0; i < lists.length; i++) {
          var arr = lists[i];
          if (!arr) continue;
          for (var j = 0; j < arr.length; j++) {
            if (arr[j] && (arr[j].id === id || arr[j].scheme_id === id)) return arr[j];
          }
        }
        return null;
      }

      // =====================================================================
      // SAVE / UNSAVE
      // =====================================================================
      function toggleSave(id, saving) {
        if (!API.GovernmentService) return;
        var p = saving ? API.GovernmentService.saveScheme(id) : API.GovernmentService.unsaveScheme(id);
        p.then(function () {
          if (saving) State.savedIds[id] = true;
          else delete State.savedIds[id];
          markSavings(State.all);
          markSavings(State.recommended);
          refreshAllGrids();
          showToast(saving ? 'Scheme saved' : 'Scheme removed from saved', saving ? 'success' : 'info');
          if (!saving) loadSaved();
        }).catch(function (err) {
          var msg = (err && err.message) || 'Could not update saved schemes';
          showToast(msg, 'error');
        });
      }

      function markSavings(list) {
        if (!list) return;
        for (var i = 0; i < list.length; i++) {
          if (list[i]) list[i].is_saved = !!State.savedIds[list[i].id];
        }
      }

      // =====================================================================
      // DETAILS MODAL
      // =====================================================================
      function openDetails(id) {
        var modal = document.getElementById('schemeModal');
        var body = document.getElementById('schemeModalBody');
        modal.hidden = false;
        lockScroll();
        body.innerHTML =
          '<div class="scheme-detail-loading"><div class="skeleton-loader" style="height:20px;width:60%;border-radius:6px;"></div>' +
          '<div class="skeleton-loader" style="height:14px;width:80%;margin-top:12px;border-radius:6px;"></div>' +
          '<div class="skeleton-loader" style="height:90px;width:100%;margin-top:18px;border-radius:10px;"></div></div>';
        if (window.initSkeletonLoaders) window.initSkeletonLoaders();
        focusTrap(modal);

        API.GovernmentService.getScheme(id).then(function (s) {
          body.innerHTML = detailHTML(s);
          bindDetailActions(s);
        }).catch(function (err) {
          body.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-exclamation-triangle"></i></div>' +
            '<h4>Unable to load scheme</h4><p>' + esc((err && err.message) || 'Something went wrong.') + '</p></div>';
        });
      }

      function detailHTML(s) {
        var dl = deadlineInfo(s);
        var bf = benefitText(s);
        return '<div class="scheme-detail">' +
          '<div class="scheme-detail-head">' +
            '<div class="scheme-detail-icon"><i class="fas ' + detailIcon(s) + '"></i></div>' +
            '<div class="scheme-detail-headtext">' +
              '<span class="schemes-badge">' + categoryLabel(s) + '</span>' +
              '<h2 id="schemeModalTitle">' + esc(s.name) + '</h2>' +
              '<p class="scheme-detail-dept"><i class="fas fa-building"></i> ' + esc(s.department || s.authority || 'Government of India') + '</p>' +
            '</div>' +
          '</div>' +

          '<div class="scheme-detail-stats">' +
            (bf !== null ? '<div class="scheme-detail-stat"><small>Benefit</small><strong>' + esc(bf) + '</strong></div>' : '') +
            '<div class="scheme-detail-stat"><small>Deadline</small><strong class="dl-' + dl.cls + '">' + esc(dl.label) + '</strong></div>' +
            '<div class="scheme-detail-stat"><small>Level</small><strong>' + esc((s.level || 'central').replace(/^\w/, function (c) { return c.toUpperCase(); })) + '</strong></div>' +
          '</div>' +

          (s.overview ? '<section class="scheme-detail-sec"><h3><i class="fas fa-info-circle"></i> Overview</h3><p>' + esc(s.overview) + '</p></section>' : '') +
          (s.description ? '<section class="scheme-detail-sec"><h3><i class="fas fa-align-left"></i> Description</h3><p>' + esc(s.description) + '</p></section>' : '') +
          (s.objectives ? '<section class="scheme-detail-sec"><h3><i class="fas fa-bullseye"></i> Objectives</h3><p>' + esc(s.objectives) + '</p></section>' : '') +

          (benefitList(s).length ? '<section class="scheme-detail-sec"><h3><i class="fas fa-wallet"></i> Benefits</h3><ul class="scheme-detail-list">' + benefitList(s).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul></section>' : '') +

          (eligibilityList(s).length ? '<section class="scheme-detail-sec"><h3><i class="fas fa-user-check"></i> Eligibility</h3><ul class="scheme-detail-list">' + eligibilityList(s).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>' : '') +

          (docList(s).length ? '<section class="scheme-detail-sec"><h3><i class="fas fa-file-alt"></i> Required Documents</h3><ul class="scheme-detail-list">' + docList(s).map(function (d) { return '<li><i class="fas fa-check-circle doc-ok"></i> ' + esc(d) + '</li>'; }).join('') + '</ul></section>' : '') +

          (processList(s).length ? '<section class="scheme-detail-sec"><h3><i class="fas fa-clipboard-list"></i> Application Process</h3><ol class="scheme-detail-steps">' + processList(s).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol></section>' : '') +

          (faqArr(s).length ? '<section class="scheme-detail-sec"><h3><i class="fas fa-question-circle"></i> FAQs</h3><div class="scheme-faq">' + faqArr(s).map(function (f, i) {
            return '<div class="scheme-faq-item"><button type="button" class="scheme-faq-q" data-faq="' + i + '" aria-expanded="false"><span>' + esc(f.q) + '</span><i class="fas fa-chevron-down"></i></button>' +
                   '<div class="scheme-faq-a"><p>' + esc(f.a) + '</p></div></div>';
          }).join('') + '</div></section>' : '') +

          '<section class="scheme-detail-important">' +
            '<h3><i class="fas fa-exclamation-circle"></i> Important Information</h3>' +
            '<div class="scheme-imp-grid">' +
              '<div class="scheme-imp-item"><small>Application Deadline</small><strong>' + esc(dl.label) + '</strong></div>' +
              '<div class="scheme-imp-item"><small>Authority</small><strong>' + esc(s.department || s.authority || 'Government of India') + '</strong></div>' +
              (s.contact_information ? '<div class="scheme-imp-item"><small>Contact</small><strong>' + esc(s.contact_information) + '</strong></div>' : '') +
              (s.source_url ? '<div class="scheme-imp-item"><small>Official Website</small><strong><a href="' + esc(s.source_url) + '" target="_blank" rel="noopener noreferrer">' + esc(prettyUrl(s.source_url)) + ' <i class="fas fa-external-link-alt"></i></a></strong></div>' : '') +
            '</div>' +
            (s.source ? '<p class="scheme-source-note"><i class="fas fa-shield-alt"></i> Information verified from ' + esc(s.source) + (s.last_verified_at ? ' · last verified ' + esc(fmtDate(s.last_verified_at)) : '') + '.</p>' : '') +
          '</section>' +

          '<div class="scheme-detail-actions">' +
            '<button type="button" class="scheme-card-btn primary" data-apply="' + esc(s.id) + '"><i class="fas fa-paper-plane"></i> Apply Now</button>' +
            '<button type="button" class="scheme-card-btn ghost wide" data-share="' + esc(s.id) + '"><i class="fas fa-share-alt"></i> Share</button>' +

      function prettyUrl(u) {
        try {
          var p = new URL(u);
          return p.hostname.replace(/^www\./, '');
        } catch (e) { return u; }
      }

      function detailIcon(s) {
        var c = String((s && s.category) || '').toLowerCase();
        if (c.indexOf('insurance') >= 0) return 'fa-umbrella';
        if (c.indexOf('loan') >= 0 || c.indexOf('credit') >= 0) return 'fa-hand-holding-usd';
        if (c.indexOf('irrigation') >= 0) return 'fa-tint';
        if (c.indexOf('equipment') >= 0 || c.indexOf('drone') >= 0 || c.indexOf('mechani') >= 0) return 'fa-tractor';
        if (c.indexOf('organic') >= 0 || c.indexOf('seed') >= 0) return 'fa-seedling';
        if (c.indexOf('income') >= 0 || c.indexOf('support') >= 0) return 'fa-rupee-sign';
        if (c.indexOf('subsid') >= 0) return 'fa-percentage';
        return 'fa-landmark';
      }

      function benefitList(s) {
        var out = [];
        if (s && s.benefits) {
          if (Array.isArray(s.benefits)) out = out.concat(s.benefits.map(String));
          else if (typeof s.benefits === 'string') out.push(String(s.benefits));
        }
        if (s && s.benefit) out.push(String(s.benefit));
        if (s && s.benefit_amount) out.push('Financial benefit: ' + money(s.benefit_amount));
        if (s && s.benefit_type && String(s.benefit_type) !== String(s.benefits)) {
          out.push(prettyBenefit(s.benefit_type) || String(s.benefit_type));
        }
        return out.filter(function (x, i) { return x && out.indexOf(x) === i; }).slice(0, 8);
      }

      function eligibilityList(s) {
        var out = [];
        if (s && s.eligible_farmer_types && Array.isArray(s.eligible_farmer_types)) {
          out = out.concat(s.eligible_farmer_types.map(prettyEligType).filter(Boolean));
        }
        var e = txt(s.eligibility || '');
        if (e) out.push(e);
        if (s && s.land_category) out.push('Land: ' + txt(s.land_category));
        if (s && s.income_category) out.push('Income: ' + txt(s.income_category));
        if (s && s.age_limit) out.push('Age: ' + txt(s.age_limit));
        return out.filter(function (x, i) { return x && out.indexOf(x) === i; }).slice(0, 10);
      }

      function docList(s) {
        var d = s.documents_required || s.documents || s.required_documents;
        if (Array.isArray(d)) return d.map(String).filter(function (x) { return x && x.trim(); });
        if (typeof d === 'string') return d.split(/\n|,|;/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
        return [];
      }

      function processList(s) {
        if (Array.isArray(s && s.application_process)) return s.application_process.map(String);
        if (typeof (s && s.application_process) === 'string' && s.application_process.trim()) {
          return s.application_process.split(/\n+/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
        }
        if (s && s.how_to_apply) return String(s.how_to_apply).split(/\n+/).filter(function (x) { return x.trim(); });
        return [];
      }

      function faqArr(s) {
        if (s && s.faqs && Array.isArray(s.faqs)) return s.faqs.filter(function (f) { return f && f.q && f.a; });
        return [];
      }

      function bindDetailActions(s) {
        var applyBtn = document.querySelector('.scheme-detail-actions [data-apply]');
        if (applyBtn) applyBtn.addEventListener('click', function () { openApply(s); });
        var shareBtn = document.querySelector('.scheme-detail-actions [data-share]');
        if (shareBtn) shareBtn.addEventListener('click', function () { shareScheme(s); });

        var faqs = document.querySelectorAll('.scheme-faq-q');
        for (var i = 0; i < faqs.length; i++) {
          faqs[i].addEventListener('click', function () {
            var expanded = this.getAttribute('aria-expanded') === 'true';
            this.setAttribute('aria-expanded', String(!expanded));
            this.classList.toggle('open', !expanded);
            var ans = this.nextElementSibling;
            if (ans) ans.classList.toggle('open', !expanded);
          });
        }
      }

      function shareScheme(s) {
        var data = {
          title: s.name + ' — Government Scheme',
          text: s.name + ': ' + (s.overview || s.description || 'Government scheme available on Farm Assist.'),
          url: window.location.origin + window.location.pathname.replace('schemes.html', 'scheme_detail.html') + '?id=' + encodeURIComponent(s.id || s.scheme_id)
        };
        if (navigator.share) {
          navigator.share(data).catch(function () {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data.url).then(function () {
            showToast('Link copied to clipboard', 'success');
          }).catch(function () { fallbackCopy(data.url); });
        } else {
          fallbackCopy(data.url);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Link copied to clipboard', 'success'); }
        catch (e) { showToast('Copy not supported', 'error'); }
        document.body.removeChild(ta);
      }

      // =====================================================================
      // APPLY FLOW
      // =====================================================================
      function openApply(s) {
        if (State.appliedIds[s.id]) {
          showToast('You have already applied to this scheme', 'info');
          openApplied();
          return;
        }
        var modal = document.getElementById('applyModal');
        var body = document.getElementById('applyModalBody');
        modal.hidden = false;
        lockScroll();
        body.innerHTML =
          '<div class="scheme-apply">' +
            '<h3 id="applyModalTitle"><i class="fas fa-paper-plane"></i> Apply for Scheme</h3>' +
            '<p class="scheme-apply-scheme"><strong>' + esc(s.name) + '</strong></p>' +
            '<p class="scheme-apply-note">Your application will be submitted to the official scheme authority. A real application reference ID will be generated on confirmation.</p>' +
            '<button type="button" class="scheme-card-btn primary wide" id="applyConfirm"><i class="fas fa-check"></i> Confirm Application</button>' +
            '<button type="button" class="scheme-card-btn ghost wide" data-close-apply>Cancel</button>' +
          '</div>';

        document.getElementById('applyConfirm').addEventListener('click', function () {
          var btn = this;
          btn.disabled = true;
          btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
          API.GovernmentService.applyScheme(s.id).then(function (data) {
            State.appliedIds[s.id] = true;
            updateAppliedCount();
            closeAllModals();
            refreshAllGrids();
            showToast((data && data.message) || 'Application submitted successfully', 'success');
            openApplied();
          }).catch(function (err) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Confirm Application';
            var msg = (err && err.message) || 'Could not submit application';
            if (msg.toLowerCase().indexOf('already') >= 0) {
              State.appliedIds[s.id] = true;
              updateAppliedCount();
              closeAllModals();
              refreshAllGrids();
              showToast('You have already applied to this scheme', 'info');
              openApplied();

              showToast(msg, 'error');
            }

      // =====================================================================
      // APPLIED DRAWER
      // =====================================================================
      function openApplied() {
        var modal = document.getElementById('appliedModal');
        var body = document.getElementById('appliedModalBody');
        modal.hidden = false;
        lockScroll();
        body.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-spinner fa-spin"></i></div><h4>Loading applications...</h4></div>';
        focusTrap(modal);

        API.GovernmentService.listApplications().then(function (data) {
          var items = (data && data.items) || [];
          var html = '<div class="scheme-applied">' +
            '<h3 id="appliedModalTitle"><i class="fas fa-clipboard-check"></i> My Applications</h3>';
          if (!items.length) {
            html +=
              '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-file-invoice"></i></div>' +
              '<h4>No applications yet</h4><p>Your applied government schemes will appear here.</p>' +
              '<button type="button" class="schemes-state-btn" data-close-applied>Explore Schemes</button></div>';
          } else {
            for (var i = 0; i < items.length; i++) {
              var a = items[i];
              html += applicationRow(a);

          }
          html += '</div>';
          body.innerHTML = html;
          var closeBtns = body.querySelectorAll('[data-close-applied]');
          for (var j = 0; j < closeBtns.length; j++) {
            closeBtns[j].addEventListener('click', function () {
              modal.hidden = true;
              unlockScroll();
              var sec = document.getElementById('recommendedSection');
              if (sec && sec.hidden === false) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
              else document.getElementById('page-content') && document.getElementById('page-content').scrollIntoView({ behavior: 'smooth' });
            });
          }
          var viewRows = body.querySelectorAll('[data-app-view]');
          for (var r = 0; r < viewRows.length; r++) {
            applyAppViewBinding(viewRows[r], modal);

        }).catch(function (err) {
          body.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-exclamation-triangle"></i></div>' +
            '<h4>Unable to load applications</h4><p>' + esc((err && err.message) || 'Something went wrong.') + '</p>' +
            '<button type="button" class="schemes-state-btn" data-close-applied>Close</button></div>';
          var cb = body.querySelector('[data-close-applied]');
          if (cb) cb.addEventListener('click', function () { modal.hidden = true; unlockScroll(); });
        });
      }

      function applyAppViewBinding(row, modal) {
        var open = function () {
          var sid = row.getAttribute('data-app-view');
          if (!sid) return;
          modal.hidden = true;
          unlockScroll();
          openDetails(sid);
        };
        row.addEventListener('click', function (e) {
          if (e.target.closest('[data-app-view-btn]')) return;
          open();
        });
        row.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
        var btn = row.querySelector('[data-app-view-btn]');
        if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); open(); });
      }

      function applicationRow(a) {
        var status = txt(a.status || 'Applied');
        var statusIcon = 'fa-file-invoice';
        var statusCls = 'applied';
        var lower = status.toLowerCase();
        if (lower.indexOf('approv') >= 0) { statusIcon = 'fa-check-circle'; statusCls = 'approved'; }
        else if (lower.indexOf('reject') >= 0) { statusIcon = 'fa-times-circle'; statusCls = 'rejected'; }
        else if (lower.indexOf('review') >= 0) { statusIcon = 'fa-search'; statusCls = 'review'; }
        else if (lower.indexOf('information') >= 0) { statusIcon = 'fa-info-circle'; statusCls = 'review'; }
        else if (lower.indexOf('complete') >= 0) { statusIcon = 'fa-check-double'; statusCls = 'approved'; }

        var ref = txt(a.application_id || a.reference_id || a.id || '');
        var name = txt(a.scheme_name || a.scheme || 'Scheme');
        var sid = a.scheme_id || a.schemeId || '';
        return '<div class="scheme-app-row" data-app-view="' + esc(sid) + '" role="button" tabindex="0" aria-label="View details for ' + esc(name) + '" title="View scheme details">' +
          '<div class="scheme-app-statusicon ' + statusCls + '"><i class="fas ' + statusIcon + '"></i></div>' +
          '<div class="scheme-app-main">' +
            '<strong class="scheme-app-name">' + name + '</strong>' +
            '<span class="scheme-app-ref">Ref: ' + ref + '</span>' +
            (a.applied_date || a.application_date ? '<span class="scheme-app-date"><i class="fas fa-calendar-alt"></i> Applied ' + esc(fmtDate(a.applied_date || a.application_date)) + '</span>' : '') +
          '</div>' +
          '<div class="scheme-app-side">' +
            '<span class="scheme-app-status ' + statusCls + '"><i class="fas ' + statusIcon + '"></i> ' + status + '</span>' +
            '<span class="scheme-app-updated">' + (a.updated_at ? 'Updated ' + esc(fmtDate(a.updated_at)) : '') + '</span>' +
            '<button type="button" class="scheme-app-view" data-app-view-btn="' + esc(sid) + '" aria-label="View details for ' + esc(name) + '"><i class="fas fa-arrow-right"></i> View Details</button>' +
          '</div>' +
        '</div>';
      }

      // =====================================================================
      // MODAL HELPERS
      // =====================================================================
      function focusTrap(modal) {
        var focusables = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusables.length) focusables[0].focus();
      }

      function lockScroll() {
        document.body.classList.add('modal-open');
        document.documentElement.classList.add('modal-open');
        var pc = document.getElementById('page-content');
        if (pc) pc.style.overflow = 'hidden';
        // Cancel any in-flight smooth-scroll animation (e.g. from an element
        // scrollIntoView or our own scrollTo) so the page cannot continue
        // drifting after the dialog opens.
        var prev = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = 'auto';
        window.scrollTo(0, window.scrollY);
        document.documentElement.style.scrollBehavior = prev;
      }

      function unlockScroll() {
        document.body.classList.remove('modal-open');
        document.documentElement.classList.remove('modal-open');
        var pc = document.getElementById('page-content');
        if (pc) pc.style.overflow = '';
      }

      // Belt-and-suspenders guard: while any dialog is open, wheel deltas are
      // clamped to the visible panel and never chain to the page scroller
      // behind the modal (CSS overscroll-behavior is not reliable for large
      // deltas in Chromium).
      document.addEventListener('wheel', function (e) {
        var modals = document.querySelectorAll('.scheme-modal');
        for (var i = 0; i < modals.length; i++) {
          if (modals[i].hidden) continue;
          var panel = e.target && e.target.closest ? e.target.closest('.scheme-modal-panel') : null;
          if (panel) {
            var max = panel.scrollHeight - panel.clientHeight;
            if (max > 0) {
              var next = panel.scrollTop + e.deltaY;
              next = Math.max(0, Math.min(max, next));
              panel.scrollTop = next;
            }
          }
          e.preventDefault();
          return;
        }
      }, { passive: false });

      function closeAllModals() {
        var modals = document.querySelectorAll('.scheme-modal');
        for (var i = 0; i < modals.length; i++) {
          modals[i].hidden = true;
        }
        unlockScroll();
      }

      // =====================================================================
      // WIREUP
      // =====================================================================
      function wireEvents() {
        // Search
        var searchInput = document.getElementById('schemeSearchInput');
        var clearBtn = document.getElementById('schemeSearchClear');
        var filterBtn = document.getElementById('filterToggleBtn');
        var filterPanel = document.getElementById('filterPanel');
        var stateSelect = document.getElementById('filterState');
        var debounceTimer = null;

        function updateActiveFilters() {
          var active = Boolean(State.search || State.state || State.category);
          var badge = document.getElementById('filterActiveBadge');
          if (badge) badge.hidden = !active;
          if (filterBtn) {
            filterBtn.classList.toggle('is-active', active);
            filterBtn.setAttribute('aria-expanded', filterPanel ? String(!filterPanel.hidden) : 'false');
          }
        }

        function doSearch() {
          clearTimeout(debounceTimer);
          debounceTimer = null;
          State.search = searchInput.value.trim();
          clearBtn.hidden = searchInput.value.length === 0;
          loadSchemes(true);
          updateActiveFilters();
        }

        searchInput.addEventListener('input', function () {
          clearBtn.hidden = this.value.length === 0;
          clearTimeout(debounceTimer);
          // Preview results instantly from already-loaded data, then let the
          // server response replace them with authoritative matches.
          State.search = this.value.trim();
          var isPreview = Boolean(State.search || State.state || State.category);
          if (isPreview) {
            var local = [];
            for (var i = 0; i < State.all.length; i++) {
              var s = State.all[i];
              var catMatch = true;
              if (State.category) {
                var catL = String(State.category).toLowerCase();
                if (catL === 'central' || catL === 'central schemes') catMatch = (s.level || '').toLowerCase() === 'central';
                else if (catL === 'state' || catL === 'state schemes') catMatch = (s.level || '').toLowerCase() === 'state';
                else catMatch = (s.category || '').toLowerCase().indexOf(catL) !== -1;
              }
              if (!catMatch) continue;
              if (State.state && (s.state || '').toLowerCase().indexOf(State.state.toLowerCase()) === -1) continue;
              if (!State.search) { local.push(s); continue; }
              var hay = ((s.name || '') + ' ' + (s.description || '') + ' ' + (s.department || '') + ' ' +
                (s.category || '') + ' ' + (s.state || '') + ' ' + (s.crop || '') + ' ' +
                (s.benefit_type || '') + ' ' + (s.benefits || '') + ' ' + (s.eligibility || '')).toLowerCase();
              if (hay.indexOf(State.search.toLowerCase()) !== -1) local.push(s);
            }
            var gridEl = document.getElementById('schemesGrid');
            if (gridEl) {
              if (local.length) {
                grid(gridEl, local, State.appliedIds);
                bindCardEvents(gridEl);
                document.getElementById('schemesTotal').textContent = '(' + local.length + ')';
              } else {
                state(gridEl, 'fa-search-minus', 'No schemes found', 'Try another scheme name, crop, category or keyword.');
              }
            }
          }
          debounceTimer = setTimeout(doSearch, 250);
        });
        searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            doSearch();
          }
          if (e.key === 'Escape' && this.value) {
            this.value = '';
            clearBtn.hidden = true;
            State.search = '';
            loadSchemes(true);
            updateActiveFilters();
          }
        });
        clearBtn.addEventListener('click', function () {
          clearTimeout(debounceTimer);
          debounceTimer = null;
          searchInput.value = '';
          clearBtn.hidden = true;
          State.search = '';
          loadSchemes(true);
          updateActiveFilters();
          searchInput.focus();
        });

        // Filter toggle
        filterBtn.addEventListener('click', function () {
          var willOpen = filterPanel.hidden;
          filterPanel.hidden = !willOpen;
          updateActiveFilters();
          if (willOpen) {
            setTimeout(function () { searchInput.focus(); }, 60);
          }
        });

        // State filter
        stateSelect.addEventListener('change', function () {
          State.state = this.value;
          updateActiveFilters();
        });

        // Apply Filters button
        document.getElementById('filterApply').addEventListener('click', function () {
          State.search = searchInput.value.trim();
          clearBtn.hidden = searchInput.value.length === 0;
          State.state = stateSelect.value;
          updateActiveFilters();
          loadSchemes(true);
          filterPanel.hidden = true;
          filterBtn.setAttribute('aria-expanded', 'false');
        });

        // Reset filters
        document.getElementById('filterReset').addEventListener('click', function () {
          searchInput.value = '';
          clearBtn.hidden = true;
          stateSelect.value = '';
          State.search = '';
          State.state = '';
          State.category = '';
          var all = document.querySelectorAll('.schemes-cat-chip');
          for (var i = 0; i < all.length; i++) {
            all[i].classList.remove('is-active');
            all[i].setAttribute('aria-pressed', 'false');
            if (all[i].getAttribute('data-cat') === '') all[i].classList.add('is-active');
          }
          filterPanel.hidden = true;
          updateActiveFilters();
          loadSchemes(true);
        });

        // Sort
        document.getElementById('schemeSort').addEventListener('change', function () {
          State.sort = this.value;
          loadSchemes(true);
        });

        // Load more
        document.getElementById('loadMoreBtn').addEventListener('click', function () {
          State.page += 1;
          loadSchemes(false);
        });

        // Category chips
        document.getElementById('schemesCats').addEventListener('click', function (e) {
          var chip = e.target.closest('.schemes-cat-chip');
          if (!chip) return;
          var all = this.querySelectorAll('.schemes-cat-chip');
          for (var i = 0; i < all.length; i++) {
            all[i].classList.remove('is-active');
            all[i].setAttribute('aria-pressed', 'false');
          }
          chip.classList.add('is-active');
          chip.setAttribute('aria-pressed', 'true');
          State.category = chip.getAttribute('data-cat') || '';
          updateActiveFilters();
          loadSchemes(true);
        });

        // Applied button
        document.getElementById('appliedBtn').addEventListener('click', openApplied);

        // Refresh from official sources
        document.getElementById('schemesRefreshBtn').addEventListener('click', triggerSync);

        // Modal close buttons (backdrops + closes)
        var closeSelectors = ['[data-close-modal]', '[data-close-applied]', '[data-close-apply]'];
        closeSelectors.forEach(function (sel) {
          var els = document.querySelectorAll(sel);
          for (var j = 0; j < els.length; j++) els[j].addEventListener('click', closeAllModals);
        });

        // Escape key: close dialogs first, then the filter panel, then blur.
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            var modals = document.querySelectorAll('.scheme-modal');
            var anyOpen = false;
            for (var mi = 0; mi < modals.length; mi++) { if (!modals[mi].hidden) { anyOpen = true; break; } }
            if (anyOpen) {
              closeAllModals();
            } else if (!filterPanel.hidden) {
              filterPanel.hidden = true;
              filterBtn.setAttribute('aria-expanded', 'false');
              updateActiveFilters();
            }
            if (document.activeElement && document.activeElement.id === 'schemeSearchInput') {
              document.activeElement.blur();
            }
          }
        });
      }

      // =====================================================================
      // OFFICIAL SOURCE STATUS + REFRESH
      // =====================================================================
      function syncLabel(info) {
        var label = (info && info.label) || 'unavailable';
        var text = '';
        var cls = '';
        var icon = 'fa-circle-check';
        var lastAt = info && info.last_sync && info.last_sync.synced_at;
        var when = lastAt ? fmtDateTime(lastAt) : 'never';
        switch (label) {
          case 'live':
            text = 'Live · verified ' + when;
            cls = '';
            icon = 'fa-circle-check';
            break;
          case 'latest':
            text = 'Verified ' + when;
            cls = 'is-muted';
            icon = 'fa-circle-check';
            break;
          case 'stale':
            text = 'Updated ' + when + ' · refresh available';
            cls = 'is-warn';
            icon = 'fa-circle-exclamation';
            break;
          case 'not_configured':
            text = 'Official sync not configured on server';
            cls = 'is-muted';
            icon = 'fa-circle-info';
            break;
          default:
            text = 'Official sources unavailable · showing stored catalog';
            cls = 'is-warn';
            icon = 'fa-triangle-exclamation';
        }
        return { text: text, cls: cls, icon: icon };
      }

      function fmtDateTime(iso) {
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return iso;
          var day = String(d.getDate()).padStart(2, '0');
          var mon = String(d.getMonth() + 1).padStart(2, '0');
          var hr = String(d.getHours()).padStart(2, '0');
          var min = String(d.getMinutes()).padStart(2, '0');
          return day + '/' + mon + '/' + d.getFullYear() + ' ' + hr + ':' + min;
        } catch (e) { return iso; }
      }

      function loadSyncStatus(autoRefresh) {
        if (!window.API || !API.GovernmentService || !API.GovernmentService.syncStatus) return;
        API.GovernmentService.syncStatus().then(function (info) {
          var wrap = document.getElementById('syncStatusWrap');
          if (wrap) {
            wrap.hidden = false;
            var lbl = syncLabel(info);
            wrap.className = 'schemes-lastupd' + (lbl.cls ? ' ' + lbl.cls : '');
            document.getElementById('syncStatusIcon').className = 'fa-solid ' + lbl.icon + ' schemes-lastupd-icon';
            document.getElementById('syncStatusText').textContent = lbl.text;
          }
          if (autoRefresh && info && info.label === 'stale' && API.GovernmentService.syncNow) {
            triggerSync(true);
          }
        }).catch(function () {
          var wrap = document.getElementById('syncStatusWrap');
          if (wrap) {
            wrap.hidden = false;
            wrap.className = 'schemes-lastupd is-error';
            document.getElementById('syncStatusIcon').className = 'fa-solid fa-triangle-exclamation schemes-lastupd-icon';
            document.getElementById('syncStatusText').textContent = 'Could not check official sources';
          }
        });
      }

      function triggerSync(silent) {
        var btn = document.getElementById('schemesRefreshBtn');
        var icon = btn ? btn.querySelector('i') : null;
        var original = icon ? icon.className : '';
        if (btn) {
          btn.disabled = true;
          if (icon) icon.className = 'fas fa-spinner fa-spin';
        }
        API.GovernmentService.syncNow().then(function (report) {
          if (btn) {
            btn.disabled = false;
            if (icon) icon.className = original;
          }
          if (report && report.ok === false) {
            if (!silent) showToast(report.message || 'Could not refresh schemes', report.reason === 'not_configured' ? 'info' : 'error');
          } else if (!silent && report && report.message) {
            showToast(report.message, 'success');
          }
          loadSyncStatus(false);
          refreshAllGrids();
        }).catch(function (err) {
          if (btn) {
            btn.disabled = false;
            if (icon) icon.className = original;
          }
          if (!silent) showToast((err && err.message) || 'Could not refresh schemes', 'error');
        });
      }

      function init() {
        try {
          console.log('Government Schemes: Initializing...');
          if (!window.API) {
            console.error('Government Schemes: API not available');
            var gridEl = document.getElementById('schemesGrid');
            if (gridEl) {
              gridEl.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-exclamation-triangle"></i></div><h4>Service unavailable</h4><p>The application services failed to load. Please refresh the page.</p></div>';
            }
            return;
          }
          if (!API.GovernmentService) {
            console.error('Government Schemes: GovernmentService not available');
            var gridEl = document.getElementById('schemesGrid');
            if (gridEl) {
              gridEl.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-exclamation-triangle"></i></div><h4>Service unavailable</h4><p>The government schemes service failed to load. Please refresh the page.</p></div>';
            }
            return;
          }
          if (!UserStore) {
            console.error('Government Schemes: UserStore not available');
          }
          wireEvents();
          loadCategories();
          loadSchemes(true);
          loadSyncStatus(true);
          loadStateFilter();
          loadTokenStores();
          loadSaved();
        } catch (e) {
          console.error('Government Schemes: Init error', e);
          var gridEl = document.getElementById('schemesGrid');
          if (gridEl) {
            gridEl.innerHTML = '<div class="schemes-state"><div class="schemes-state-icon"><i class="fas fa-exclamation-triangle"></i></div><h4>Initialization error</h4><p>An error occurred while loading the page. Please refresh.</p></div>';
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
