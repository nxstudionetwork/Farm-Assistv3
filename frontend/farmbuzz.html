<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="farmbuzz" data-hide-nav="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - FarmBuzz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ====================================================================
       FARM BUZZ v2 - Home | Shorts | Trends | Post | Self
       ==================================================================== */

    .fb-wrap { padding: 0 0 10px; }

    /* ---- Top Nav ------------------------------------------------------ */
    .fb-topnav {
      display: flex; align-items: center; gap: 4px;
      background: linear-gradient(135deg, #0F2E1E 0%, #1B5E3F 60%, #2D8659 100%);
      border-radius: var(--radius-lg); padding: 7px;
      position: sticky; top: 0; z-index: 40; margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .fb-topnav button {
      flex: 1; border: none; background: transparent; color: rgba(255,255,255,0.78);
      font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
      padding: 9px 4px; border-radius: var(--radius-md); transition: all .22s;
      display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
    }
    .fb-topnav button i { font-size: 13px; }
    .fb-topnav button.active {
      background: rgba(255,255,255,0.16); color: #fff;
      box-shadow: inset 0 -2px 0 var(--light-green,#52B788);
    }
    .fb-topnav button:hover { color: #fff; }

    /* ---- FarmBuzz Home (dashboard) button ---- */
    button.fb-home-btn {
      flex: 0 0 auto; width: 44px; height: 40px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.16); color: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
      transition: transform .18s ease, background .2s ease, box-shadow .2s ease;
      position: relative; margin-left: 2px;
    }
    button.fb-home-btn:hover {
      background: rgba(255,255,255,0.3); transform: scale(1.08);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.14);
    }
    button.fb-home-btn:active { transform: scale(0.92); }
    button.fb-home-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    button.fb-home-btn .fb-home-tip {
      position: absolute; top: calc(100% + 9px); right: 0; z-index: 60;
      background: #0F2E1E; color: #fff; font-size: 11px; font-weight: 600;
      padding: 6px 10px; border-radius: 8px; white-space: nowrap; letter-spacing: .2px;
      opacity: 0; transform: translateY(-4px); pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,.25); font-family: inherit;
    }
    button.fb-home-btn:hover .fb-home-tip,
    button.fb-home-btn:focus-visible .fb-home-tip { opacity: 1; transform: translateY(0); }
    @media (max-width: 520px) {
      button.fb-home-btn { width: 40px; height: 38px; font-size: 14px; }
    }

    @media (max-width: 400px) {
      .fb-topnav { gap: 2px; padding: 6px 5px; }
      .fb-topnav button { font-size: 10.5px; padding: 8px 2px; gap: 4px; }
      .fb-topnav button i { font-size: 11px; }
      button.fb-home-btn { width: 36px; height: 36px; margin-left: 1px; }
      button.fb-home-btn .fb-home-tip { display: none; }
    }

    @media (max-width: 520px) {
      .fb-topnav button { font-size: 11.5px; }
      .fb-topnav button i { font-size: 12px; }
    }

    /* ---- Tools row ---------------------------------------------------- */
    .fb-tools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .fb-searchbar {
      flex: 1; position: relative; display: flex; align-items: center;
      background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-md);
      padding: 0 12px; transition: all .2s;
    }
    .fb-searchbar:focus-within { border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(45,106,79,.08); }
    .fb-searchbar i { color: var(--text-muted); font-size: 13px; }
    .fb-searchbar input {
      flex: 1; border: none; outline: none; padding: 11px 10px; font-size: 13px;
      background: transparent; font-family: inherit; min-width: 0;
    }
    .fb-search-clear { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; display: none; }
    .fb-bell-btn {
      position: relative; width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--border-light); background: #fff; color: var(--primary-green);
      font-size: 15px; cursor: pointer; transition: all .2s; flex: 0 0 auto;
    }
    .fb-bell-btn:hover { border-color: var(--medium-green); }
    .fb-bell-dot {
      position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%;
      background: #e74c3c; border: 2px solid #fff;
    }

    /* ---- Views -------------------------------------------------------- */
    .fb-view { display: none; animation: fadeUp .35s ease both; }
    .fb-view.active { display: block; }

    .fb-section-head {
      display: flex; align-items: center; justify-content: space-between; margin: 6px 0 12px;
    }
    .fb-section-head h3 { font-size: 17px; font-weight: 700; color: var(--text-dark,#173423); }
    .fb-section-head h3 i { color: var(--primary-green); margin-right: 7px; }
    .fb-section-head a, .fb-section-head button.fb-link {
      background: none; border: none; color: var(--primary-green); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    }

    /* ---- Home: story/farmer strip ------------------------------------- */
    .fb-farmers-row { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
    .fb-farmers-row::-webkit-scrollbar { display: none; }
    .fb-farmer-pill {
      flex: 0 0 68px; text-align: center; cursor: pointer;
    }
    .fb-farmer-pill .fb-fp-avatar {
      width: 62px; height: 62px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--primary-green); padding: 2px; background: #fff; box-shadow: var(--shadow-sm);
    }
    .fb-farmer-pill .fb-fp-add {
      width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#1B5E3F,#52B788); color: #fff; font-size: 20px; border: 3px solid #fff;
      box-shadow: var(--shadow-sm);
    }
    .fb-farmer-pill span { display: block; font-size: 11px; color: var(--text-muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---- Home: feed cards --------------------------------------------- */
    .fb-post-card {
      background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg);
      overflow: hidden; margin-bottom: 16px; animation: fadeUp .4s ease both;
    }
    .fb-post-head {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px;
    }
    .fb-avatar {
      width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
      border: 2px solid var(--border-light); cursor: pointer;
    }
    .fb-post-head-info { flex: 1; min-width: 0; cursor: pointer; }
    .fb-post-head-info b { font-size: 13.5px; color: var(--text-dark,#173423); display: flex; align-items: center; gap: 5px; }
    .fb-post-head-info b .fa-circle-check { color: #2D8659; font-size: 12px; }
    .fb-post-head-info small { color: var(--text-muted); font-size: 11.5px; display: block; }
    .fb-follow-btn {
      border: 1px solid var(--primary-green); color: var(--primary-green); background: #fff;
      font-size: 11.5px; font-weight: 700; padding: 6px 13px; border-radius: 20px; cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .fb-follow-btn.following { background: var(--primary-green); color: #fff; }
    .fb-follow-btn:hover { background: var(--primary-green); color: #fff; }
    .fb-follow-btn.following:hover { background: #fff; color: var(--primary-green); }
    .fb-more-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; font-size: 15px; }

    .fb-post-media { position: relative; width: 100%; background: #0F2E1E; overflow: hidden; }
    .fb-post-media img { width: 100%; display: block; object-fit: cover; max-height: 480px; }
    .fb-post-media.fb-tall img { max-height: 560px; }
    .fb-media-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0); transition: all .2s;
    }
    .fb-post-media:hover .fb-media-overlay { background: rgba(0,0,0,0.08); }
    .fb-cat-chip {
      position: absolute; top: 10px; left: 10px; background: rgba(15,46,30,.85); color: #fff;
      font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: .4px; z-index: 2;
    }
    .fb-short-badge {
      position: absolute; top: 10px; right: 10px; background: #E9B640; color: #1B2E21;
      font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 20px; z-index: 2;
    }

    .fb-post-actions {
      display: flex; align-items: center; gap: 4px; padding: 8px 10px 2px;
    }
    .fb-act {
      background: none; border: none; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 6px; color: #44524a; font-size: 13px; font-weight: 600;
      padding: 8px 10px; border-radius: 20px; transition: all .18s;
    }
    .fb-act i { font-size: 16px; }
    .fb-act:hover { background: rgba(45,106,79,.08); color: var(--primary-green); }
    .fb-act.liked { color: #e74c3c; }
    .fb-act.saved { color: #1565C0; }
    .fb-act .fa-heart.liked { animation: fbPop .35s ease; }

    .fb-post-body { padding: 2px 14px 14px; }
    .fb-post-likes { font-size: 13px; font-weight: 700; color: var(--text-dark,#173423); margin-bottom: 5px; }
    .fb-post-caption { font-size: 13.5px; color: #2c3a32; line-height: 1.55; margin-bottom: 7px; }
    .fb-post-caption b { font-weight: 700; color: var(--text-dark,#173423); }
    .fb-hashtag { color: var(--primary-green); font-weight: 600; cursor: pointer; }
    .fb-hashtag:hover { text-decoration: underline; }
    .fb-post-loc { font-size: 12px; color: var(--text-muted); }
    .fb-post-loc i { margin-right: 4px; }
    .fb-post-comments {
      font-size: 12.5px; color: var(--text-muted); cursor: pointer; margin-top: 6px;
    }
    .fb-post-comments:hover { color: var(--primary-green); }

    /* ---- Trending strips ---------------------------------------------- */
    .fb-shorts-strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .fb-shorts-strip::-webkit-scrollbar { display: none; }
    .fb-strip-card {
      flex: 0 0 118px; position: relative; border-radius: var(--radius-md); overflow: hidden;
      height: 200px; cursor: pointer; background: #0F2E1E;
    }
    .fb-strip-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .fb-strip-card:hover img { transform: scale(1.06); }
    .fb-strip-card .fb-strip-views {
      position: absolute; bottom: 6px; left: 8px; color: #fff; font-size: 11px; font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,.7); display: flex; align-items: center; gap: 4px;
    }
    .fb-strip-card .fb-strip-play {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--primary-green);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .fb-strip-card .fb-strip-cat {
      position: absolute; top: 7px; left: 7px; background: rgba(15,46,30,.8); color: #fff;
      font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 12px;
    }

    /* ---- Tip cards ---------------------------------------------------- */
    .fb-tip-card {
      display: flex; gap: 12px; background: #fff; border: 1px solid var(--border-light);
      border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all .2s;
    }
    .fb-tip-card:hover { border-color: var(--medium-green); box-shadow: var(--shadow-sm); }
    .fb-tip-icon {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px; display: flex;
      align-items: center; justify-content: center; font-size: 18px; color: #fff;
    }
    .fb-tip-body { flex: 1; min-width: 0; }
    .fb-tip-body h5 { font-size: 13.5px; color: var(--text-dark,#173423); margin-bottom: 3px; }
    .fb-tip-body p { font-size: 12px; color: var(--text-muted); line-height: 1.45; }

    /* ---- Shorts grid -------------------------------------------------- */
    .fb-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .fb-chips::-webkit-scrollbar { display: none; }
    .fb-chip {
      flex: 0 0 auto; border: 1px solid var(--border-light); background: #fff; color: #44524a;
      font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px; cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .fb-chip.active { background: var(--primary-green); border-color: var(--primary-green); color: #fff; }
    .fb-chip:hover:not(.active) { border-color: var(--medium-green); color: var(--primary-green); }

    .fb-shorts-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    @media (min-width: 700px) { .fb-shorts-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1000px) { .fb-shorts-grid { grid-template-columns: repeat(4, 1fr); } }

    .fb-short-card {
      position: relative; border-radius: var(--radius-md); overflow: hidden; cursor: pointer;
      background: #0F2E1E; aspect-ratio: 9 / 15.5; display: block;
    }
    .fb-short-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
    .fb-short-card:hover img { transform: scale(1.05); }
    .fb-short-card .fb-short-cat {
      position: absolute; top: 8px; left: 8px; background: rgba(15,46,30,.82); color: #fff;
      font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 12px;
    }
    .fb-short-card .fb-short-info {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 9px 9px;
      background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff;
    }
    .fb-short-card .fb-short-info b { display: block; font-size: 11.5px; line-height: 1.35; margin-bottom: 4px; }
    .fb-short-card .fb-short-info small { font-size: 10px; opacity: .85; display: flex; align-items: center; gap: 5px; }
    .fb-short-card .fb-short-likes {
      position: absolute; top: 8px; right: 8px; color: #fff; font-size: 10.5px; font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,.7); display: flex; align-items: center; gap: 4px;
    }

    /* ---- Trends ------------------------------------------------------- */
    .fb-trend-row {
      background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-md);
      padding: 13px 14px; margin-bottom: 10px; cursor: pointer; transition: all .2s; display: flex; gap: 12px; align-items: flex-start;
    }
    .fb-trend-row:hover { border-color: var(--medium-green); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .fb-trend-rank {
      width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .fb-trend-body { flex: 1; min-width: 0; }
    .fb-trend-body .fb-trend-topic { font-size: 14px; font-weight: 700; color: var(--text-dark,#173423); margin-bottom: 2px; }
    .fb-trend-body .fb-trend-desc { font-size: 12px; color: var(--text-muted); line-height: 1.45; margin-bottom: 6px; }
    .fb-trend-meta { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--text-muted); }
    .fb-trend-meta .fb-trend-score { color: var(--premium-green,#1B5E3F); font-weight: 700; }

    .fb-trend-banner {
      background: linear-gradient(135deg,#0F2E1E,#2D8659); border-radius: var(--radius-lg);
      color: #fff; padding: 16px 16px; margin-bottom: 14px; position: relative; overflow: hidden;
    }
    .fb-trend-banner h3 { color: #fff; font-size: 18px; margin-bottom: 3px; }
    .fb-trend-banner p { font-size: 12.5px; opacity: .85; }
    .fb-trend-banner .fa-fire {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 46px; opacity: .16;
    }

    /* ---- Post composer ------------------------------------------------- */
    .fb-composer { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; }
    .fb-comp-top {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
    }
    .fb-comp-top .fb-user-mini { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; }
    .fb-comp-top .fb-user-mini img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .fb-comp-top .fb-user-mini b { font-size: 13px; color: var(--text-dark,#173423); }
    .fb-vis-select {
      border: 1px solid var(--border-light); border-radius: 20px; font-size: 12px; padding: 5px 10px;
      color: #44524a; background: #f7f9f8; font-family: inherit; cursor: pointer; outline: none;
    }
    .fb-comp-media {
      padding: 14px; border-bottom: 1px solid var(--border-light);
    }
    .fb-media-picker { display: flex; gap: 8px; }
    .fb-media-picker button {
      flex: 1; border: 1.5px dashed var(--border-light); background: #fafcfb; color: #44524a;
      border-radius: var(--radius-md); padding: 22px 6px; cursor: pointer; transition: all .2s;
      font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
    }
    .fb-media-picker button i { font-size: 22px; color: var(--primary-green); }
    .fb-media-picker button.active { border-color: var(--primary-green); color: var(--primary-green); background: rgba(45,106,79,.06); }
    .fb-media-picker button:hover { border-color: var(--medium-green); }
    .fb-media-preview { position: relative; margin-top: 12px; display: none; border-radius: var(--radius-md); overflow: hidden; }
    .fb-media-preview img, .fb-media-preview video { width: 100%; max-height: 320px; object-fit: cover; display: block; }
    .fb-media-remove {
      position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,.65); color: #fff; border: none; cursor: pointer; font-size: 13px;
    }
    .fb-comp-fields { padding: 14px; display: grid; gap: 10px; }
    .fb-field { display: grid; gap: 4px; }
    .fb-field label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; }
    .fb-field input, .fb-field select, .fb-field textarea {
      width: 100%; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
      padding: 10px 12px; font-size: 13px; font-family: inherit; outline: none; background: #fff; transition: all .2s;
    }
    .fb-field textarea { resize: vertical; min-height: 78px; line-height: 1.5; }
    .fb-field input:focus, .fb-field select:focus, .fb-field textarea:focus {
      border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(45,106,79,.08);
    }
    .fb-field .fb-hint { font-size: 11px; color: var(--text-muted); }
    .fb-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .fb-field-row { grid-template-columns: 1fr; } }

    .fb-tag-people { display: flex; flex-wrap: wrap; gap: 6px; }
    .fb-tag-chip {
      border: 1px solid var(--border-light); background: #fafcfb; color: #44524a; border-radius: 20px;
      font-size: 11.5px; padding: 5px 11px; cursor: pointer; font-family: inherit; transition: all .2s;
      display: flex; align-items: center; gap: 5px;
    }
    .fb-tag-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
    .fb-tag-chip.on { background: var(--primary-green); border-color: var(--primary-green); color: #fff; }

    .fb-comp-footer { padding: 12px 14px 14px; border-top: 1px solid var(--border-light); }
    .fb-char-count { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 5px; }
    .fb-post-btn {
      width: 100%; border: none; border-radius: var(--radius-md); padding: 13px;
      background: linear-gradient(135deg,#1B5E3F,#2D8659); color: #fff; font-size: 14.5px; font-weight: 700;
      cursor: pointer; transition: all .2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .fb-post-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .fb-post-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .fb-post-btn .fa-circle-notch { animation: spin 1s linear infinite; }
    .fb-upload-progress { display: none; margin-top: 10px; }
    .fb-upload-progress .fb-up-bar { height: 7px; background: #e8efe9; border-radius: 10px; overflow: hidden; }
    .fb-upload-progress .fb-up-fill { height: 100%; width: 0; background: linear-gradient(90deg,#1B5E3F,#52B788); transition: width .3s; }
    .fb-upload-progress span { font-size: 11.5px; color: var(--text-muted); display: block; margin-top: 5px; text-align: center; }

    /* ---- Self profile --------------------------------------------------- */
    .fb-profile-card { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; }
    .fb-profile-cover {
      height: 110px; background: linear-gradient(135deg,#0F2E1E 0%, #1B5E3F 55%, #52B788 100%);
      position: relative;
    }
    .fb-profile-cover .fa-seedling { position: absolute; right: 18px; bottom: 8px; font-size: 44px; opacity: .18; color: #fff; }
    .fb-profile-main { padding: 0 18px 16px; position: relative; }
    .fb-profile-avatar-wrap { position: absolute; top: -46px; left: 18px; }
    .fb-profile-avatar-wrap img {

      '<div class="fb-skeleton fb-skel-card"></div><div class="fb-skeleton fb-skel-card"></div>';
    renderForYou();
    renderFarmersRow();
    renderShortsStrip();
    renderTips();

    var items = POSTS.concat(myPosts.map(function (p) {
      p._mine = true; return p;
    }));
    items.sort(function (a, b) {
      return (personalScore(b) - personalScore(a)) ||
        (likedLvl(b) - likedLvl(a)) || (a.time.length - b.time.length);
    });

    setTimeout(function () {
      document.getElementById('fbHomePosts').innerHTML =
        items.map(function (p) { return postCardHtml(p); }).join('');
      bindPostCardEvents(document.getElementById('fbHomePosts'));
    }, 250);
  }

  function likedLvl(item) {

  }

  function postCardHtml(p) {
    var f = farmer(p.author);
    var likeCount = p.likes + (isLiked(p.id) ? 1 : 0);
    var html =
      '<article class="fb-post-card" data-id="' + p.id + '">' +

          '<small>' + esc(f.location) + ' \u00b7 ' + esc(p.time) + '</small>' +
        '</div>' +
        (f.expert ? '<span class="fb-follow-btn" style="background:var(--premium-green,#1B5E3F);color:#fff;border-color:var(--premium-green);">Expert</span>' : followBtn(f.id)) +

  function catLabel(c) {
    var map = {
      crop_farming:'CROP', horticulture:'HORTICULTURE', organic_farming:'ORGANIC',
      irrigation:'IRRIGATION', pest_control:'PEST CONTROL', soil_health:'SOIL HEALTH',
      livestock:'LIVESTOCK', machinery:'MACHINERY', market:'MARKET', success_story:'SUCCESS',
      farming:'FARMING', crop:'CROP', machinery:'MACHINERY', market:'MARKET',
      'success story':'SUCCESS', question:'QUESTION', tip:'TIP', community:'COMMUNITY', other:'OTHER'
    };
    return map[String(c).toLowerCase()] || 'FARMING';
  }

  function followBtn(fid) {
    if (isFollowed(fid)) return '<button class="fb-follow-btn following" data-follow="' + fid + '">Following</button>';
    return '<button class="fb-follow-btn" data-follow="' + fid + '">Follow</button>';
  }

  function actBtn(kind, id, count) {
    var cls = '';
    var icon = 'fa-regular';
    var label = '';
    if (kind === 'heart') { icon = isLiked(id) ? 'fa-solid fa-heart liked' : 'fa-regular fa-heart'; cls = isLiked(id) ? 'liked' : ''; }
    if (kind === 'comment') { icon = 'fa-regular fa-comment'; }
    if (kind === 'share') { icon = 'fa-solid fa-paper-plane'; }
    if (kind === 'bookmark') { icon = isSaved(id) ? 'fa-solid fa-bookmark saved' : 'fa-regular fa-bookmark'; cls = isSaved(id) ? 'saved' : ''; }
    var c = count == null ? '' : '<span>' + fmtNum(count) + '</span>';
    return '<button class="fb-act ' + cls + '" data-act="' + kind + '" data-id="' + id + '" aria-label="' + kind + '"><i class="' + icon + '"></i>' + c + '</button>';
  }

  function bindPostCardEvents(container) {
    container.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        handleAction(btn.getAttribute('data-act'), btn.getAttribute('data-id'), btn);
      });
    });
    container.querySelectorAll('[data-comments]').forEach(function (el) {
      el.addEventListener('click', function () { openDetail(el.getAttribute('data-comments')); });
    });
    container.querySelectorAll('[data-farmer]').forEach(function (el) {
      el.addEventListener('click', function () { openFarmer(el.getAttribute('data-farmer')); });
    });
    container.querySelectorAll('[data-share]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); openShareById(el.getAttribute('data-share')); });
    });
    container.querySelectorAll('[data-follow]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleFollow(btn.getAttribute('data-follow'), btn);
      });
    });
    container.querySelectorAll('.fb-post-media').forEach(function (media) {
      media.addEventListener('click', function () {
        openDetail(media.closest('.fb-post-card').getAttribute('data-id'));
      });
    });
    bindHashTags(container);
  }

  function handleAction(kind, id, btn) {
    if (kind === 'heart') {
      var nowLiked = toggleIn(liked, id);
      writeJSON(LS_LIKES, liked);
      if (btn) {
        btn.classList.toggle('liked', nowLiked);
        var i = btn.querySelector('i');
        i.className = nowLiked ? 'fa-solid fa-heart liked' : 'fa-regular fa-heart';
        if (nowLiked) { i.classList.add('liked'); btn.classList.add('liked'); }
        updateLikeCounts(id);
      }
      toast(nowLiked ? 'Liked this post' : 'Like removed', nowLiked ? 'success' : 'info');
      if (hasApi()) window.API.FarmBuzz.like(id).catch(function () {});
      return;
    }
    if (kind === 'bookmark') {
      var nowSaved = toggleIn(saved, id);
      writeJSON(LS_SAVED, saved);
      if (btn) {
        btn.classList.toggle('saved', nowSaved);
        btn.querySelector('i').className = nowSaved ? 'fa-solid fa-bookmark saved' : 'fa-regular fa-bookmark';
      }
      toast(nowSaved ? 'Saved to your collection' : 'Removed from saved', nowSaved ? 'success' : 'info');
      if (hasApi()) window.API.FarmBuzz.save(id).catch(function () {});
      return;
    }
    if (kind === 'comment') { openDetail(id); return; }
    if (kind === 'share') { openShareById(id); return; }
  }

  function updateLikeCounts(id) {
    var item = anyItemById(id);
    if (!item) return;
    var n = item.likes + (isLiked(id) ? 1 : 0);
    document.querySelectorAll('.fb-post-likes').forEach(function (el) {
      var card = el.closest('[data-id="' + id + '"]');
      if (card) el.textContent = fmtNum(n) + ' likes';
    });
  }

  function toggleFollow(fid, btn) {
    var f = farmer(fid);
    var now = toggleIn(followed, fid);
    writeJSON(LS_FOLLOW, followed);
    if (btn) {
      btn.classList.toggle('following', now);
      btn.textContent = now ? 'Following' : 'Follow';
    }
    toast(now ? 'Following ' + f.name : 'Unfollowed ' + f.name, now ? 'success' : 'info');
    if (hasApi()) window.API.FarmBuzz.follow(fid).catch(function () {});
  }

        '<div class="fb-short-info"><b>' + esc(s.title) + '</b>' +
          '<small><i class="fas fa-eye"></i> ' + s.views + ' \u00b7 ' + esc(farmer(s.author).name) + '</small></div>' +
        '</div>';
    }).join('');
    grid.querySelectorAll('.fb-short-card').forEach(function (card) {
      card.addEventListener('click', function () { openShortsPlayer(card.getAttribute('data-id')); });

      });

  /* ---- Fullscreen player ---- */
  function openShortsPlayer(id) {
    var list = SHORTS.filter(function (s) {
      return shortsFilter === 'all' || s.cat === shortsFilter;
    });
    if (!list.length) list = SHORTS;
    shortsList = list;
    spIndex = 0;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { spIndex = i; break; }
    document.body.style.overflow = 'hidden';
    var player = document.getElementById('fbShortsPlayer');
    player.classList.add('open');
    buildSpSlides();
    document.getElementById('fbSpStage').scrollTop = 0;
    showSpSlide(spIndex);
    startSpProgress();
  }

  function shortDesc(s) {
    var map = {
      'Farmer Techniques': 'A practical technique, step by step, for your own farm.',
      'Farmer Tricks': 'A quick, tested trick you can use on your farm today.',
      'Farming Scenes': 'Real moments from Indian farmlands.',
      'Farmer Life': 'Days in the life of farmers across India.',
      'Farming Comedy': 'Because farming life needs a laugh too.',
      'Quick Knowledge': 'One idea, taught in under 60 seconds.',
      'Educational': 'Learn something useful about farming in 30 seconds.',
      'Expert Shorts': 'Verified expert guidance. Watch, learn, apply.'

  function showSpSlide(i) {
    var stage = document.getElementById('fbSpStage');
    var slides = stage.querySelectorAll('.fb-sp-slide');
    if (!slides.length) return;
    spIndex = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach(function (sl, idx) { sl.classList.toggle('active', idx === spIndex); });
    stage.scrollTo({ top: spIndex * stage.clientHeight, behavior: 'smooth' });
    updateSpCounter();
    bindSpSlideEvents(slides[spIndex]);
    showSpLoading(slides[spIndex]);
  }

  function updateSpCounter() {
    var el = document.getElementById('fbSpCounter');
    if (el) el.textContent = (spIndex + 1) + '/' + shortsList.length;
  }

  function showSpLoading(slide) {
    var img = slide.querySelector('img');
    if (!img) return;
    if (img.complete && img.naturalWidth > 0) return;
    slide.classList.add('loading');
    img.addEventListener('load', function onLoad() {
      slide.classList.remove('loading');
      img.removeEventListener('load', onLoad);
    });
    img.addEventListener('error', function onErr() {
      slide.classList.remove('loading');
      img.removeEventListener('error', onErr);
    });
  }

  function spScrollHandler() {
    var stage = document.getElementById('fbSpStage');
    var slides = stage.querySelectorAll('.fb-sp-slide');
    if (!slides.length || stage.clientHeight === 0) return;
    var idx = Math.round(stage.scrollTop / stage.clientHeight);
    idx = Math.max(0, Math.min(idx, slides.length - 1));
    if (idx !== spIndex) {
      spIndex = idx;
      slides.forEach(function (sl, i) { sl.classList.toggle('active', i === spIndex); });
      updateSpCounter();
      bindSpSlideEvents(slides[spIndex]);
      showSpLoading(slides[spIndex]);
      startSpProgress();
    }
  }

  function bindSpSlideEvents(slide) {
    slide.querySelectorAll('[data-farmer]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        openFarmer(el.getAttribute('data-farmer'));
      });
    });
    slide.querySelectorAll('[data-follow]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleFollow(btn.getAttribute('data-follow'), btn);
      });
    });
    slide.querySelectorAll('.fb-hashtag').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); openSearch(el.getAttribute('data-tag')); });
    });
    slide.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        spRailAction(btn.getAttribute('data-act'), slide.getAttribute('data-id'), btn);
      });
    });
    slide.querySelectorAll('.fb-sp-info, .fb-sp-vignette, .fb-sp-grad-top').forEach(function (el) {
      el.addEventListener('click', toggleSpPause);
    });
  }

  function spRailAction(kind, id, btn) {
    var item = shortById(id);
    if (kind === 'heart') {
      var now = toggleIn(liked, id);
      writeJSON(LS_LIKES, liked);
      btn.classList.toggle('liked', now);
      var rail = btn.closest('.fb-sp-rail');
      var b = rail.querySelector('b');
      if (b) b.textContent = fmtNum(item.likes + (now ? 1 : 0));
      toast(now ? 'Liked this short' : 'Like removed', now ? 'success' : 'info');
      if (hasApi()) window.API.FarmBuzz.like(id).catch(function () {});
      return;
    }
    if (kind === 'bookmark') {
      var savedNow = toggleIn(saved, id);
      writeJSON(LS_SAVED, saved);
      btn.classList.toggle('saved', savedNow);
      toast(savedNow ? 'Saved to your collection' : 'Removed from saved', savedNow ? 'success' : 'info');
      if (hasApi()) window.API.FarmBuzz.save(id).catch(function () {});
      return;
    }
    if (kind === 'comment') { openSpComments(id); return; }
    if (kind === 'share') { openShareById(id); return; }
  }

  function startSpProgress() {
    if (spTimer) clearInterval(spTimer);
    spProgress = 0;
    spPaused = false;
    document.getElementById('fbSpPaused').classList.remove('show');
    spTimer = setInterval(function () {
      if (spPaused) return;
      spProgress += 0.75;
      var fill = document.getElementById('fbSpProgressFill');
      fill.style.width = Math.min(100, spProgress) + '%';
      if (spProgress >= 100) {
        spProgress = 0;
        nextSp();
      }
    }, 100);
  }

  function toggleSpPause() {
    spPaused = !spPaused;
    var icon = document.getElementById('fbSpPaused');
    icon.classList.toggle('show', spPaused);
    if (spPaused) { icon.className = 'fas fa-play fb-sp-paused show'; }
    else { icon.className = 'fas fa-play fb-sp-paused'; setTimeout(function () { icon.classList.remove('show'); }, 400); }
  }

  function nextSp() {
    if (spIndex >= shortsList.length - 1) { stopSp(); return; }
    showSpSlide(spIndex + 1);
    startSpProgress();
  }
  function prevSp() {
    if (spIndex <= 0) return;
    showSpSlide(spIndex - 1);
    startSpProgress();
  }
  function stopSp() {
    if (spTimer) clearInterval(spTimer);
    spTimer = null;
    document.getElementById('fbSpProgressFill').style.width = '0%';
    var stage = document.getElementById('fbSpStage');
    if (stage) stage.scrollTop = 0;

  /* ==================== TRENDS ==================== */
  var trendFilter = 'all';

  function renderTrends(filter) {
    if (filter) trendFilter = filter;
    var chips = ['all', 'posts', 'shorts', 'techniques', 'discussion', 'farmers'];
    var labels = { all:'All', posts:'Posts', shorts:'Shorts', techniques:'Techniques', discussion:'Discussions', farmers:'Farmers' };
    var catSets = { all:['posts','shorts','discussion','agriculture','horticulture','livestock','market','tips','creators'], posts:['posts'], shorts:['shorts'], techniques:['agriculture','horticulture','livestock','market'], discussion:['discussion'], farmers:['creators'] };
    var chipHtml = '';
    chips.forEach(function (c) {
      chipHtml += '<button class="fb-chip' + (c === trendFilter ? ' active' : '') + '" data-tf="' + c + '">' + labels[c] + '</button>';
    });
    var chipEl = document.getElementById('fbTrendChips');
    chipEl.innerHTML = chipHtml;
    chipEl.querySelectorAll('.fb-chip').forEach(function (chip) {
      chip.addEventListener('click', function () { renderTrends(chip.getAttribute('data-tf')); });
    });

    var activeCats = catSets[trendFilter] || catSets.all;
    var list = TRENDS.filter(function (t) {
      return activeCats.indexOf(t.cat) !== -1;
    });
    var el = document.getElementById('fbTrendList');
    if (!list.length) {
      el.innerHTML = '<div class="fb-empty"><i class="fas fa-fire-flame-curved"></i><p>No trends in this category yet.</p></div>';
      return;
    }
    el.innerHTML = list.map(function (t, i) {
      return '<div class="fb-trend-row" data-ref="' + t.ref + '" data-topic="' + esc(t.topic) + '" role="button" tabindex="0">' +
        '<div class="fb-trend-rank" style="background:' + t.color + ';"><i class="fas ' + t.icon + '"></i></div>' +
        '<div class="fb-trend-body">' +
          '<div class="fb-trend-topic">' + esc(t.topic) + '</div>' +
          '<div class="fb-trend-desc">' + esc(t.desc) + '</div>' +
          '<div class="fb-trend-meta">' +
            '<span class="fb-trend-score"><i class="fas fa-fire"></i> ' + fmtNum(t.score) + ' discussions</span>' +
            '<span><i class="fas fa-tag"></i> ' + esc(t.cat) + '</span>' +
          '</div>' +
        '</div></div>';
    }).join('');
    el.querySelectorAll('.fb-trend-row').forEach(function (row) {
      row.addEventListener('click', function () {
        openTrend(row.getAttribute('data-ref'), row.getAttribute('data-topic'));
      });
      row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTrend(row.getAttribute('data-ref'), row.getAttribute('data-topic')); }
      });
    });
  }

  function openTrend(ref, topic) {
    if (ref === 'shorts') { switchView('shorts'); return; }
    if (ref === 'creators') {
      var f = FARMERS[(TRENDS.length + topic.length) % FARMERS.length];
      openFarmer(f.id);
      return;
    }
    if (ref === 'tips') { switchView('home'); return; }
    openSearch(topic);
  }

  function initComposer() {

  function setMediaPicker(kind) {
    compKind = kind;
    document.querySelectorAll('#fbMediaPicker button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-kind') === kind);
    });

  function onFileChosen(file) {
    if (!file) return;
    selectedFile = file;
    selectedFileData = null;
    var isVideo = file.type.indexOf('video') === 0;
    var preview = document.getElementById('fbMediaPreview');
    var pimg = document.getElementById('fbPreviewImg');
    var pvid = document.getElementById('fbPreviewVideo');
    pimg.style.display = 'none';
    pvid.style.display = 'none';
    preview.style.display = 'block';
    var url = URL.createObjectURL(file);
    if (isVideo) {
      pvid.src = url; pvid.style.display = 'block';
      compKind = 'video';
      document.querySelectorAll('#fbMediaPicker button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-kind') === 'video');
      });
    } else {
      pimg.src = url; pimg.style.display = 'block';
      compKind = 'photo';
      document.querySelectorAll('#fbMediaPicker button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-kind') === 'photo');
      });
      var reader = new FileReader();
      reader.onload = function () { selectedFileData = reader.result; };
      reader.readAsDataURL(file);
    }
  }

  function submitPost() {
    var caption = document.getElementById('fbCaption').value.trim();
    var location = document.getElementById('fbLocation').value.trim();
    var crop = document.getElementById('fbCrop').value.trim();
    var cat = document.getElementById('fbCategory').value;
    var tagsInput = document.getElementById('fbTags').value.trim();
    var visibility = document.getElementById('fbVisibility').value;

    if (compKind !== 'text' && !selectedFile && !caption) {
      toast('Add a photo/video or write a caption first', 'error');
      return;
    }
    if (caption.length > 2000) {
      toast('Caption is too long (max 2000 characters)', 'error');
      return;
    }
    if (compKind !== 'text' && !selectedFile) {
      toast('Please choose a photo or video', 'error');
      return;
    }

    var tags = [];
    tagsInput.split(/[, ]+/).forEach(function (t) {
      t = t.trim().replace(/^#/, '');
      if (t && tags.indexOf(t) === -1) tags.push(t);
    });
    caption.split(/[\s]+/).forEach(function (w) {
      if (/^#\w+/.test(w)) {
        var t = w.slice(1);
        if (tags.indexOf(t) === -1) tags.push(t);
      }
    });
    if (tags.length > 12) tags.length = 12;

    var btn = document.getElementById('fbPostBtn');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Posting...';
    btn.querySelector('i').className = 'fas fa-circle-notch';
    document.getElementById('fbUploadProgress').style.display = 'block';

    var progress = 0;
    var timer = setInterval(function () {
      progress += Math.random() * 22 + 8;
      if (progress >= 100) progress = 100;
      document.getElementById('fbUpFill').style.width = progress + '%';
      document.getElementById('fbUpLabel').textContent = 'Uploading... ' + Math.round(progress) + '%';
      if (progress >= 100) {
        clearInterval(timer);
        finishPost(caption, location, crop, cat, tags, visibility);
      }
    }, 160);
  }

  function finishPost(caption, location, crop, cat, tags, visibility) {
    var u = currentUser() || {};
    var id = 'm' + Date.now();
    var newPost = {
      id: id,
      author: 'me',
      img: 'p' + (1 + (myPosts.length % 27)),
      caption: caption,
      location: location,
      crop: crop || 'General',
      cat: cat || 'Farming',
      time: 'now',
      likes: 0,
      comments: 0,
      shares: 0,
      views: '0',
      tall: false,
      mine: true,
      tags: tags,
      visibility: visibility
    };
    if (selectedFile) {
      if (selectedFile.type.indexOf('video') === 0) {
        try { newPost.videoUrl = URL.createObjectURL(selectedFile); newPost.mediaUrl = newPost.videoUrl; } catch (e) {}
      } else if (selectedFileData) {
        newPost.mediaUrl = selectedFileData;
        newPost.img = null;
      }
    }
    myPosts.unshift(newPost);
    writeJSON(LS_POSTS, myPosts);
    resetComposer();
    toast('Posted to FarmBuzz!', 'success');
    if (hasApi()) {
      var payload = {
        caption: caption,
        content_type: compKind === 'text' ? 'post' : 'post',
        location: location || null,
        crop: crop || null,
        category: cat || 'Farming',
        visibility: visibility,
        hashtags: tags
      };
      window.API.FarmBuzz.createPost(payload).catch(function () {});
    }
    switchView('home');
    setTimeout(function () {
      var el = document.querySelector('[data-id="' + id + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);
  }

      var text = c.indexOf(':') !== -1 ? c.slice(c.indexOf(':') + 1) : c;
      var f = FARMERS[i % FARMERS.length];
      return '<div class="fb-comment-item"><img src="' + avatarSrc(f, 90) + '" alt=""><div class="fb-c-body">' +
        '<b>' + esc(author) + '</b><span>' + esc(text) + '</span><small>Just now</small></div></div>';
    }).join('');
  }

  function addCommentTo(id, text) {
    var key = id;
    var list = comments[key] || [];
    var name = 'You';
    list.push(name + ': ' + text);
    comments[key] = list;
    writeJSON(LS_COMMENTS, comments);
    var item = anyItemById(id);
    if (item) { item.comments = list.length; }
  }

  function addDetailComment() {
    var id = activeDetailId;
    if (!id) return;
    var input = document.getElementById('fbDetailCommentInput');
    var text = input.value.trim();
    if (!text) return;
    addCommentTo(id, text);
    input.value = '';
    renderDetailComments(id);
    toast('Comment posted!', 'success');
    if (hasApi()) window.API.FarmBuzz.comment(id, { content: text }).catch(function () {});
  }

  /* ==================== SHARE ==================== */
  function openShareById(id) {
    activeShareId = id;
    openShare(shareText(id));
  }

  function shareText(id) {
    var item = anyItemById(id);
    if (!item) return 'Check out this post on FarmBuzz!';
    return item.caption || item.title || 'Check out this post on FarmBuzz!';
  }

  function openShare(text) {
    var grid = document.getElementById('fbShareGrid');
    grid.innerHTML = '';
    SHARE_OPTS.forEach(function (opt) {
      grid.innerHTML += '<button class="fb-share-opt" data-sopt="' + opt.id + '"><div class="fb-share-icon" style="background:' + opt.color + ';">' +
        '<i class="' + opt.icon + '"></i></div><span>' + opt.label + '</span></button>';
    });
    grid.querySelectorAll('.fb-share-opt').forEach(function (btn) {
      btn.addEventListener('click', function () { doShare(btn.getAttribute('data-sopt'), text); });
    });
    document.getElementById('fbShareModal').classList.add('open');
  }

  function doShare(opt, text) {
    closeModal('fbShareModal');
    if (opt === 'wa') { window.open('https://wa.me/?text=' + encodeURIComponent(text + ' - via Farm Assist'), '_blank'); toast('Opening WhatsApp', 'info'); return; }
    if (opt === 'fb') { window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href) + '&quote=' + encodeURIComponent(text), '_blank'); return; }
    if (opt === 'x') { window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank'); return; }
    if (opt === 'email') { window.location.href = 'mailto:?subject=FarmBuzz&body=' + encodeURIComponent(text); return; }
    if (navigator.share) {
      navigator.share({ title: 'FarmBuzz', text: text }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
      toast('Copied to clipboard!', 'info');
    } else {
      toast('Copy failed. Please copy manually.', 'error');
    }
    if (activeShareId && hasApi()) window.API.FarmBuzz.share(activeShareId).catch(function () {});
  }

  /* ==================== NOTIFICATIONS ==================== */
  function notifUnread() {
    var count = NOTIFS.filter(function (n, i) {
      return (i + 1) * 3600 > (Date.now() - notifReadAt) / 1000;
    }).length;
    return Math.min(count, 9);
  }

  function renderNotifs() {
    var el = document.getElementById('fbNotifList');
    el.innerHTML = NOTIFS.map(function (n) {
      return '<div class="fb-notif-item"><div class="fb-notif-icon" style="background:' + n.color + ';"><i class="fas ' + n.icon + '"></i></div>' +
        '<div class="fb-notif-body"><p>' + n.text + '</p><small>' + esc(n.time) + '</small></div></div>';
    }).join('');
    notifReadAt = Date.now();
    writeJSON(LS_NOTIF_READ, notifReadAt);
    document.getElementById('fbBellDot').style.display = 'none';
    document.getElementById('fbNotifModal').classList.add('open');
  }

  /* ==================== SEARCH ==================== */
  function openSearch(q) {
    document.getElementById('fbSearchInput').value = q || '';
    document.getElementById('fbSearchClear').style.display = q ? 'inline-block' : 'none';
    searchActive = !!q;
    document.body.classList.toggle('fb-searching', searchActive);
    if (currentView !== 'home') {
      switchView('home');
      return;
    }
    performSearch(q || '');
  }

  function performSearch(q) {
    if (!q) {
      document.getElementById('fbHomePosts').innerHTML =
        '<div class="fb-search-panel">' +
          '<div class="fb-search-type-head"><i class="fas fa-clock"></i> Recent searches</div>' +
          (recentSearches.length ? recentSearches.map(function (r) {
            return '<span class="fb-recent-tag" data-rs="' + esc(r) + '"><i class="fas fa-clock"></i> ' + esc(r) + '</span>';
          }).join('') : '<p style="font-size:12.5px;color:var(--text-muted);">Search posts, farmers, topics and trends.</p>') +
        '</div>';
      document.querySelectorAll('[data-rs]').forEach(function (tag) {
        tag.addEventListener('click', function () { openSearch(tag.getAttribute('data-rs')); });
      });
      return;
    }
    if (recentSearches.indexOf(q) === -1) {
      recentSearches.unshift(q);
      if (recentSearches.length > 5) recentSearches.length = 5;
      writeJSON(LS_RECENT, recentSearches);
    }

    var ql = q.toLowerCase().replace(/^#/, '');
    var pMatches = POSTS.filter(function (p) {
      return p.caption.toLowerCase().indexOf(ql) !== -1 ||
        (p.tags && p.tags.join(' ').toLowerCase().indexOf(ql) !== -1) ||
        farmer(p.author).name.toLowerCase().indexOf(ql) !== -1 ||
        (p.crop || '').toLowerCase().indexOf(ql) !== -1;
    });
    var sMatches = SHORTS.filter(function (s) {
      return s.title.toLowerCase().indexOf(ql) !== -1 || s.cat.toLowerCase().indexOf(ql) !== -1;
    });
    var fMatches = FARMERS.filter(function (f) {
      return f.name.toLowerCase().indexOf(ql) !== -1 || f.location.toLowerCase().indexOf(ql) !== -1 ||
        f.crops.join(' ').toLowerCase().indexOf(ql) !== -1;
    });
    var tMatches = TRENDS.filter(function (t) { return t.topic.toLowerCase().indexOf(ql) !== -1; });

    var html = '<div class="fb-search-panel">';
    if (fMatches.length) {
      html += '<div class="fb-search-type-head"><i class="fas fa-users"></i> Farmers</div>';
      fMatches.forEach(function (f) {
        html += '<div class="fb-search-row" data-farmer="' + f.id + '"><img src="' + avatarSrc(f, 120) + '" alt="">' +
          '<div class="fb-sr-body"><b>' + esc(f.name) + '</b><small>' + esc(f.location) + '</small></div></div>';
      });
    }
    if (pMatches.length) {
      html += '<div class="fb-search-type-head"><i class="fas fa-file-lines"></i> Posts</div>';
      pMatches.slice(0, 4).forEach(function (p) {
        html += '<div class="fb-search-row" data-post="' + p.id + '"><div class="fb-search-thumb" style="background:#1B5E3F;"><i class="fas fa-file-lines"></i></div>' +
          '<div class="fb-sr-body"><b>' + esc(p.caption.slice(0, 55)) + '...</b><small>' + esc(farmer(p.author).name) + '</small></div></div>';
      });
    }
    if (sMatches.length) {
      html += '<div class="fb-search-type-head"><i class="fas fa-clapperboard"></i> Shorts</div>';
      sMatches.slice(0, 4).forEach(function (s) {
        html += '<div class="fb-search-row" data-short="' + s.id + '"><img src="' + shortImg(s, 120) + '" alt="">' +
          '<div class="fb-sr-body"><b>' + esc(s.title) + '</b><small>' + esc(s.cat) + '</small></div></div>';
      });
    }
    if (tMatches.length) {
      html += '<div class="fb-search-type-head"><i class="fas fa-fire"></i> Trends</div>';
      tMatches.forEach(function (t) {
        html += '<div class="fb-search-row" data-trendref="' + t.ref + '" data-trendtopic="' + esc(t.topic) + '"><div class="fb-search-thumb" style="background:#d97706;"><i class="fas fa-fire"></i></div>' +
          '<div class="fb-sr-body"><b>' + esc(t.topic) + '</b><small>Trending \u00b7 ' + fmtNum(t.score) + '</small></div></div>';
      });
    }
    if (!fMatches.length && !pMatches.length && !sMatches.length && !tMatches.length) {
      html += '<div class="fb-empty"><i class="fas fa-search"></i><p>No results for "' + esc(q) + '". Try a crop name like paddy or tomato.</p></div>';
    }
    html += '</div>';
    document.getElementById('fbHomePosts').innerHTML = html;

    document.querySelectorAll('.fb-search-panel [data-farmer]').forEach(function (row) {
      row.addEventListener('click', function () { openFarmer(row.getAttribute('data-farmer')); });
    });
    document.querySelectorAll('.fb-search-panel [data-post]').forEach(function (row) {
      row.addEventListener('click', function () { openDetail(row.getAttribute('data-post')); });
    });
    document.querySelectorAll('.fb-search-panel [data-short]').forEach(function (row) {
      row.addEventListener('click', function () { openShortsPlayer(row.getAttribute('data-short')); });
    });
    document.querySelectorAll('.fb-search-panel [data-trendref]').forEach(function (row) {
      row.addEventListener('click', function () { openTrend(row.getAttribute('data-trendref'), row.getAttribute('data-trendtopic')); });
    });

    if (hasApi()) {
      window.API.FarmBuzz.search({ q: ql }).catch(function () {});
    }
  }

  /* ==================== FARMER SHEET ==================== */
  function openFarmer(fid) {
    if (fid === 'me') { switchView('self'); return; }
    activeFarmerId = fid;
    var f = farmer(fid);
    var posts = POSTS.filter(function (p) { return p.author === fid; });
    var shorts = SHORTS.filter(function (s) { return s.author === fid; });
    document.getElementById('fbFarmerBody').innerHTML =
      '<div class="fb-fp-cover"></div>' +
      '<div class="fb-fp-main">' +
        '<img class="fb-fp-avatar" src="' + avatarSrc(f, 200) + '" alt="' + esc(f.name) + '">' +
        '<div class="fb-fp-head">' +
          '<h3>' + esc(f.name) + (f.verified ? ' <i class="fas fa-circle-check"></i>' : '') + (f.expert ? ' <span class="fb-chip" style="cursor:default;padding:2px 10px;">Expert</span>' : '') + '</h3>' +
          '<div class="fb-fp-meta">' + esc(f.farmerId) + ' \u00b7 ' + esc(f.location) + '</div>' +
          '<div class="fb-fp-bio">' + esc(f.bio) + '</div>' +
        '</div>' +
        '<div class="fb-profile-tags">' +
          f.crops.map(function (c) { return '<span><i class="fas fa-seedling"></i> ' + esc(c) + '</span>'; }).join('') +
          '<span><i class="fas fa-tractor"></i> ' + esc(f.type) + '</span>' +
        '</div>' +
        '<div class="fb-fp-stats">' +
          '<div class="fb-fp-stat"><b>' + fmtNum(f.followers) + '</b><span>Followers</span></div>' +
          '<div class="fb-fp-stat"><b>' + posts.length + '</b><span>Posts</span></div>' +
          '<div class="fb-fp-stat"><b>' + shorts.length + '</b><span>Shorts</span></div>' +
          '<div class="fb-fp-stat"><b>' + fmtNum(f.following) + '</b><span>Following</span></div>' +
        '</div>' +
        '<div class="fb-fp-actions">' +
          '<button class="btn btn-primary" id="fbFpFollow">' + (isFollowed(fid) ? 'Following' : 'Follow') + '</button>' +
          '<button class="btn btn-secondary" id="fbFpMsg"><i class="fas fa-comment-dots"></i> Message</button>' +
        '</div>' +
        '<div class="fb-fp-posts">' +
          (posts.concat(shorts).slice(0, 9).map(function (it) {
            return '<div class="fb-fp-post" data-pid="' + it.id + '"><img src="' + (it.type === 'short' || shortById(it.id) ? shortImg(it, 300) : postImg(it, 300)) + '" alt="" loading="lazy"></div>';
          }).join('')) +
        '</div>' +
      '</div>';
    var followBtnEl = document.getElementById('fbFpFollow');
    followBtnEl.addEventListener('click', function () { toggleFollow(fid, followBtnEl); });
    document.getElementById('fbFpMsg').addEventListener('click', function () {
      toast('Opening chat with ' + f.name + '...', 'info');
      setTimeout(function () { window.location.href = 'messages.html'; }, 500);
    });
    document.querySelectorAll('.fb-fp-post').forEach(function (el) {
      el.addEventListener('click', function () {
        var pid = el.getAttribute('data-pid');
        closeModal('fbFarmerModal');
        if (shortById(pid)) openShortsPlayer(pid); else openDetail(pid);
      });
    });
    document.getElementById('fbFarmerModal').classList.add('open');
  }

  /* ==================== MODALS ==================== */
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }
  function openModal(id) { document.getElementById(id).classList.add('open'); }

  function toast(msg, type) {
    if (window.showToast) { window.showToast(msg, type); return; }
    if (window.Navigation && Navigation.showToast) Navigation.showToast(msg, type);
  }

  /* ==================== BACKEND SYNC (best effort) ==================== */
  function tryBackendProfile() {
    if (!hasApi()) return;
    window.API.FarmBuzz.profile().then(function (data) {
      if (data) {
        var d = data.user || data.profile || data;
        var prof = {};
        if (d.full_name) prof.name = d.full_name;
        if (d.bio) prof.bio = d.bio;
        if (d.farm_location || d.location) prof.location = d.farm_location || d.location;
        if (d.farming_type || d.farmingType) prof.farmingType = d.farming_type || d.farmingType;
        if (Object.keys(prof).length) {
          myProfile = Object.assign({}, myProfile, prof);
          writeJSON(LS_MYPROFILE, myProfile);
          if (currentView === 'self') renderSelf('posts');
        }
      }
    }).catch(function () {});
  }

  /* ==================== EVENTS ==================== */
  function bindEvents() {
    document.querySelectorAll('.fb-topnav button[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { switchView(b.getAttribute('data-view')); });
    });
    var fbHomeBtn = document.getElementById('fbHomeBtn');
    if (fbHomeBtn) {
      fbHomeBtn.addEventListener('click', function () {
        window.location.href = 'index.html';
      });
      fbHomeBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = 'index.html'; }
      });
    }
    document.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () { switchView(b.getAttribute('data-goto')); });
    });
    document.querySelectorAll('[data-hashtag]').forEach(function (b) {
      b.addEventListener('click', function () { openSearch(b.getAttribute('data-hashtag')); });
    });
    document.querySelectorAll('[data-sugtag]').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = document.getElementById('fbTags');
        var val = input.value.trim();
        var t = b.getAttribute('data-sugtag');
        input.value = val ? val + ', ' + t.replace('#', '') : t.replace('#', '');
        input.focus();
      });
    });

    /* search */
    var searchInput = document.getElementById('fbSearchInput');
    searchInput.addEventListener('input', function () {
      var q = this.value.trim();
      document.getElementById('fbSearchClear').style.display = q ? 'inline-block' : 'none';
      clearTimeout(searchInput._t);
      searchInput._t = setTimeout(function () {
        searchActive = !!q;
        document.body.classList.toggle('fb-searching', searchActive);
        if (searchActive) {
          if (currentView !== 'home') switchView('home');
          performSearch(q);
        } else if (currentView === 'home') {
          renderHome();
        }
      }, 200);
    });
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = this.value.trim();
        searchActive = !!q;
        document.body.classList.toggle('fb-searching', searchActive);
        performSearch(q);
      }
    });
    document.getElementById('fbSearchClear').addEventListener('click', function () {
      document.getElementById('fbSearchInput').value = '';
      this.style.display = 'none';
      searchActive = false;
      document.body.classList.remove('fb-searching');
      performSearch('');
      renderHome();
    });

    /* notifications */
    document.getElementById('fbBellBtn').addEventListener('click', renderNotifs);

    /* composer */
    document.querySelectorAll('#fbMediaPicker button').forEach(function (b) {
      b.addEventListener('click', function () { setMediaPicker(b.getAttribute('data-kind')); });
    });
    document.getElementById('fbFileInput').addEventListener('change', function () {
      if (this.files && this.files[0]) onFileChosen(this.files[0]);
    });
    document.getElementById('fbMediaRemove').addEventListener('click', function () {
      selectedFile = null;
      document.getElementById('fbMediaPreview').style.display = 'none';
      document.getElementById('fbPreviewImg').style.display = 'none';
      document.getElementById('fbPreviewVideo').style.display = 'none';
      document.getElementById('fbFileInput').value = '';
      document.querySelectorAll('#fbMediaPicker button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-kind') === 'text' ? false : b.getAttribute('data-kind') === 'photo');
      });
    });
    document.getElementById('fbCaption').addEventListener('input', function () {
      document.getElementById('fbCharCount').textContent = this.value.length + ' / 2000';
    });
    document.getElementById('fbPostBtn').addEventListener('click', submitPost);

    /* self tabs */
    document.getElementById('fbSelfTabs').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      renderSelf(btn.getAttribute('data-tab'));
    });
    document.getElementById('fbEditSave').addEventListener('click', saveProfile);

    /* detail modal */
    document.getElementById('fbDetailCommentBtn').addEventListener('click', addDetailComment);
    document.getElementById('fbDetailCommentInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addDetailComment();
    });

    /* shorts player */
    document.getElementById('fbSpClose').addEventListener('click', stopSp);
    document.getElementById('fbSpNext').addEventListener('click', nextSp);
    document.getElementById('fbSpPrev').addEventListener('click', prevSp);
    document.getElementById('fbSpMute').addEventListener('click', function () {
      spMuted = !spMuted;
      var btn = document.getElementById('fbSpMute');
      btn.setAttribute('aria-pressed', String(spMuted));
      btn.querySelector('i').className = spMuted ? 'fas fa-volume-xmark' : 'fas fa-volume-up';
      toast(spMuted ? 'Sound muted' : 'Sound on', 'info');
    });
    var spStageEl = document.getElementById('fbSpStage');
    if (spStageEl) {
      spStageEl.addEventListener('scroll', function () {
        if (spScrollDebounce) clearTimeout(spScrollDebounce);
        spScrollDebounce = setTimeout(spScrollHandler, 90);
      }, { passive: true });
    }
    document.getElementById('fbSpCommentBtn').addEventListener('click', addSpComment);
    document.getElementById('fbSpCommentInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addSpComment();
    });
    document.getElementById('fbSpCloseComments').addEventListener('click', function () {
      document.getElementById('fbSpCommentsPanel').style.display = 'none';
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        var player = document.getElementById('fbShortsPlayer');
        if (player.classList.contains('open')) { stopSp(); return; }
        ['fbDetailModal', 'fbShareModal', 'fbNotifModal', 'fbFarmerModal', 'fbEditModal'].forEach(function (id) {
          document.getElementById(id).classList.remove('open');
        });
      }
      if (e.key === 'ArrowDown' && document.getElementById('fbShortsPlayer').classList.contains('open')) { e.preventDefault(); nextSp(); }
      if (e.key === 'ArrowUp' && document.getElementById('fbShortsPlayer').classList.contains('open')) { e.preventDefault(); prevSp(); }
      if ((e.key === ' ' || e.key === 'Spacebar') && document.getElementById('fbShortsPlayer').classList.contains('open')) { e.preventDefault(); toggleSpPause(); }
    });

    /* modal close buttons */
    document.querySelectorAll('.fb-sheet-close[data-close]').forEach(function (btn) {
      btn.addEventListener('click', function () { closeModal(btn.getAttribute('data-close')); });
    });
    document.querySelectorAll('.fb-modal-backdrop').forEach(function (bd) {
      bd.addEventListener('click', function (e) {
        if (e.target === bd) bd.classList.remove('open');
      });
    });

    /* copy link */
    document.getElementById('fbCopyLink').addEventListener('click', function () {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          toast('Link copied to clipboard!', 'success');
        }, function () { toast('Could not copy link', 'error'); });
      } else {
        toast('Could not copy link', 'error');
      }
    });

    window.addEventListener('hashchange', initViewFromHash);
  }

  /* ==================== INIT ==================== */
  function init() {
    document.getElementById('fbBellDot').style.display = notifUnread() ? 'block' : 'none';
    tryBackendProfile();
    bindEvents();
    var v = readHash();
    if (v) switchView(v); else switchView('home');
  }

  init();
})();
</script>

</body>
</html>
