<!doctype html><html lang="en" data-page="marketplace"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Assist — Marketplace</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><style>
:root{--m:#1e6a43;--d:#15452d;--p:#eef7ef;--l:#d9e7dc}.market{max-width:1440px;margin:auto;padding:24px}.hero{background:linear-gradient(120deg,var(--d),var(--m));padding:28px;border-radius:20px;color:#fff}.top,.bar,.head,.cartline{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0;color:#dcefe1}.icon{position:relative;width:42px;height:42px;border-radius:12px;background:#ffffff1c;border:1px solid #ffffff50;color:#fff;cursor:pointer}.count{position:absolute;right:-5px;top:-5px;background:#f3bc45;color:#183925;border-radius:20px;padding:2px 6px;font-size:11px}.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;margin-top:22px;padding:0 14px;color:#577061}.search input{height:50px;width:100%;border:0;outline:0;font-size:15px}.cats{display:flex;gap:9px;overflow:auto;padding:20px 0 6px}.cat,.secondary,.more{white-space:nowrap;border:1px solid var(--l);border-radius:999px;padding:9px 15px;background:#fff;color:#365745;font-weight:700;cursor:pointer}.cat.active,.cat:hover,.primary{background:var(--m);border-color:var(--m);color:#fff}.layout{display:grid;grid-template-columns:245px 1fr;gap:24px;margin-top:18px}.filter,.card{background:#fff;border:1px solid var(--l);border-radius:15px}.filter{padding:17px;height:max-content}.filter label{font-size:12px;font-weight:700;color:#506657;display:block;margin:16px 0 6px}.filter input,.filter select,.checkout input,.checkout textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbdaca;border-radius:8px}.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clear{border:0;background:transparent;color:var(--m);font-weight:700;cursor:pointer}.mobile-filter{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px;margin-top:15px}.card{overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px #163d2318}.pic{height:170px;background:var(--p);position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--m)}.wish{position:absolute;top:9px;right:9px;border:0;width:34px;height:34px;border-radius:50%;background:#fffc;cursor:pointer}.wish.saved{color:#b82f42}.info{padding:12px}.brand,.meta{font-size:11px;color:#687e6d}.name{font-weight:800;font-size:14px;min-height:39px;margin:4px 0;cursor:pointer}.rating{font-size:12px;color:#66796d;min-height:18px}.rating i{color:#c68815}.price{font-size:17px;font-weight:850;color:var(--d);margin-top:8px}.mrp{text-decoration:line-through;color:#77857b;font-size:11px;margin-left:5px}.stock{font-size:11px;color:#21713e;margin:7px 0}.stock.out{color:#ba3440}.primary{width:100%;border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.primary:disabled{background:#9aa9a0}.state{grid-column:1/-1;text-align:center;padding:56px 15px;border:1px dashed var(--l);border-radius:14px;color:#688070}.state i{font-size:34px;color:var(--m);display:block;margin-bottom:11px}.more{display:block;margin:20px auto}.modal{position:fixed;inset:0;background:#102e1e88;z-index:20;padding:16px;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{position:relative;width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:22px}.close{position:absolute;right:13px;top:10px;font-size:25px;border:0;background:transparent;cursor:pointer}.detail{display:grid;grid-template-columns:1fr 1fr;gap:26px}.detailpic{height:330px;background:var(--p);border-radius:12px;overflow:hidden}.detailpic img{height:100%;width:100%;object-fit:cover}.detail p{line-height:1.55;color:#536858}.cartline{padding:12px 0;border-bottom:1px solid var(--l)}.cartline img{width:62px;height:58px;border-radius:8px;object-fit:cover}.qty{border:1px solid var(--l);border-radius:7px}.qty button{border:0;background:#fff;padding:7px 9px;cursor:pointer}.qty span{padding:0 7px;font-weight:700}.remove{border:0;background:transparent;color:#ad303c;cursor:pointer}.total{font-size:17px;font-weight:850;padding:16px 0}.checkout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checkout .wide{grid-column:1/-1}.checkout textarea{min-height:90px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;background:#173f2b;color:#fff;padding:12px 15px;border-radius:9px;display:none}.toast.show{display:block}.skeleton{height:310px;border-radius:15px;background:linear-gradient(90deg,#edf3ed,#fafcfa,#edf3ed);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}@media(max-width:760px){.market{padding:14px}.hero{padding:20px 16px}.layout{grid-template-columns:1fr}.filter{display:none}.filter.show{display:block}.mobile-filter{display:inline-block}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:135px}.info{padding:10px}.detail,.checkout{grid-template-columns:1fr}.checkout .wide{grid-column:auto}.detailpic{height:245px}.cartline{display:grid;grid-template-columns:55px 1fr auto;gap:10px}.cartline img{width:55px;height:52px}.cartline .qty{grid-column:2}.cartline .remove{grid-column:3;grid-row:2}.dialog{padding:17px}}
</style></head><body><main class="market"><section class="hero"><div class="top"><div><h1>Marketplace</h1><p>Everything farmers need, in one place.</p></div><div><button class="icon" id="saved" aria-label="Saved products"><i class="fa-regular fa-heart"></i></button><button class="icon" id="cart" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i><b id="cart-count" class="count" hidden>0</b></button><button class="icon" id="orders" aria-label="My orders"><i class="fa-solid fa-box"></i></button></div></div><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search seeds, fertilizers, tools, equipment…" aria-label="Search products"></div></section><nav id="cats" class="cats"><button class="cat active" data-cat="">All</button></nav><div class="layout"><aside id="filters" class="filter"><div class="head"><b>Filters</b><button class="clear" id="clear">Clear all</button></div><label>Price range</label><div class="range"><input id="min" type="number" min="0" placeholder="Min"><input id="max" type="number" min="0" placeholder="Max"></div><label><input id="available" type="checkbox"> In stock only</label></aside><section><div class="head"><div><h2 id="heading">Farm products</h2><small id="summary">Loading products…</small></div><div><button id="showfilter" class="secondary mobile-filter"><i class="fa-solid fa-sliders"></i> Filter</button><select id="sort"><option value="created_at:desc">Newest</option><option value="price:asc">Price: Low to High</option><option value="price:desc">Price: High to Low</option><option value="rating:desc">Rating</option><option value="name:asc">Name</option></select></div></div><div class="grid" id="products"></div><button class="more" id="more" hidden>Load more</button></section></div></main>
<div class="modal" id="detailmodal"><div class="dialog"><button class="close" data-close="detailmodal">×</button><div id="detailcontent"></div></div></div><div class="modal" id="cartmodal"><div class="dialog"><button class="close" data-close="cartmodal">×</button><h2>Cart</h2><div id="cartcontent"></div></div></div><div class="modal" id="savedmodal"><div class="dialog"><button class="close" data-close="savedmodal">×</button><h2>Saved products</h2><div class="grid" id="savedcontent"></div></div></div><div class="modal" id="ordersmodal"><div class="dialog"><button class="close" data-close="ordersmodal">×</button><h2>My orders</h2><div id="orderscontent"></div></div></div><div class="modal" id="checkoutmodal"><div class="dialog"><button class="close" data-close="checkoutmodal">×</button><h2>Checkout</h2><p class="meta">Stock and total are verified by Farm Assist before the order is created. Wallet payment stays pending until its secure confirmation flow is complete.</p><form id="checkoutform" class="checkout"><label>Name<input id="deliveryname" required></label><label>Phone<input id="deliveryphone" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit phone"></label><label class="wide">Delivery address<textarea id="deliveryaddress" required placeholder="House/plot, village/town, district, state, pincode"></textarea></label><label>Payment method<select id="payment"><option value="wallet">Farm Assist Wallet</option></select></label><div style="align-self:end"><button class="primary" type="submit">Place order</button></div></form></div></div><div id="toast" class="toast"></div>
<script src="js/services.js"></script><script src="js/userStore.js"></script><script src="assets/js/navigation.js"></script><script src="assets/js/app.js"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x),S={p:1,n:1,cat:'',q:'',items:[],cart:{items:[]},wish:[]},esc=x=>String(x||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),rupees=x=>'₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2});function say(x){$('toast').textContent=x;$('toast').classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>$('toast').classList.remove('show'),3000)}function modal(x,on=true){$(x).classList.toggle('open',on)}function img(p){return p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.alt_text||p.name)}" onerror="this.outerHTML='<div class=\\'fallback\\'><i class=\\'fa-solid fa-seedling\\'></i></div>'">`:`<div class="fallback"><i class="fa-solid fa-seedling"></i></div>`}function card(p){let inWish=S.wish.some(x=>x.product&&x.product.id===p.id),stock=Number(p.stock_quantity||0),rating=Number(p.rating||0);return `<article class="card"><div class="pic">${img(p)}<button class="wish ${inWish?'saved':''}" data-wish="${p.id}" aria-label="Save product"><i class="${inWish?'fa-solid':'fa-regular'} fa-heart"></i></button></div><div class="info"><div class="brand">${esc(p.brand)}</div><div class="name" data-detail="${p.id}" tabindex="0">${esc(p.name)}</div><div class="rating">${rating?`<i class="fa-solid fa-star"></i> ${rating.toFixed(1)}${p.total_reviews?` (${p.total_reviews})`:''}`:'No ratings yet'}</div><div class="price">${rupees(p.price)}${p.original_price>p.price?` <span class="mrp">${rupees(p.original_price)}</span>`:''}</div><div class="stock ${stock?'':'out'}">${stock?`In stock · ${esc(p.unit||'unit')}`:'Out of stock'}</div><button class="primary" data-add="${p.id}" ${stock?'':'disabled'}>Add to cart</button></div></article>`}function state(title,text,button=''){return `<div class="state"><i class="fa-solid fa-seedling"></i><h3>${title}</h3><p>${text}</p>${button?`<button class="secondary">${button}</button>`:''}</div>`}async function products(reset=true){if(reset){S.p=1;$('products').innerHTML='<div class="skeleton"></div>'.repeat(8)}let [sort_by,sort_order]=$('sort').value.split(':');try{let r=await API.Marketplace.listProducts({page:S.p,limit:20,search:S.q,category_id:S.cat,min_price:$('min').value,max_price:$('max').value,sort_by,sort_order}),a=r.items||[];if($('available').checked)a=a.filter(x=>Number(x.stock_quantity)>0);S.items=reset?a:S.items.concat(a);S.n=r.total_pages||1;$('products').innerHTML=S.items.length?S.items.map(card).join(''):state(S.q?'No products match your search.':'No products available right now.',S.q?'Try another search or clear filters.':'Check back soon or explore categories.','Explore categories');$('summary').textContent=r.total?`${r.total} product${r.total===1?'':'s'} found`:'';$('more').hidden=S.p>=S.n||!S.items.length}catch(e){$('products').innerHTML=state('Unable to load marketplace.','Please check your connection and try again.','Retry')}}async function refreshCart(){try{S.cart=await API.Marketplace.getCart();$('cart-count').hidden=!S.cart.count;$('cart-count').textContent=S.cart.count||0}catch(e){S.cart={items:[],count:0,total:0}}}async function refreshWish(){try{S.wish=(await API.Marketplace.getWishlist()).items||[]}catch(e){S.wish=[]}}async function add(id){try{await API.Marketplace.addToCart({product_id:id,quantity:1});await refreshCart();say('Added to your cart.')}catch(e){say(e.message||'Unable to add to cart.')}}async function wish(id){try{let found=S.wish.find(x=>x.product&&x.product.id===id);found?await API.Marketplace.removeWishlist(id):await API.Marketplace.saveWishlist(id);await refreshWish();$('products').innerHTML=S.items.map(card).join('');say(found?'Removed from saved products.':'Saved for later.')}catch(e){say(e.message||'Unable to update saved products.')}}async function detail(id){try{let p=await API.Marketplace.getProduct(id);$('detailcontent').innerHTML=`<div class="detail"><div class="detailpic">${img(p)}</div><div><div class="brand">${esc(p.brand)}</div><h2>${esc(p.name)}</h2><div class="rating">${p.rating?`<i class="fa-solid fa-star"></i> ${Number(p.rating).toFixed(1)}`:'No ratings yet'}</div><div class="price">${rupees(p.price)}</div><div class="stock ${p.stock_quantity?'':'out'}">${p.stock_quantity?'In stock':'Out of stock'}</div><p>${esc(p.description||'No product description has been provided.')}</p><p class="meta">Unit: ${esc(p.unit||'Not specified')}${p.category?` · Category: ${esc(p.category.name)}`:''}</p><button class="primary" data-add="${p.id}" ${p.stock_quantity?'':'disabled'}>Add to cart</button></div></div>`;modal('detailmodal')}catch(e){say('Product details are unavailable.')}}function renderCart(){let c=S.cart;if(!c.items.length){$('cartcontent').innerHTML=state('Your cart is empty.','Add farm products to continue shopping.','Continue shopping');return}$('cartcontent').innerHTML=c.items.map(i=>`<div class="cartline"><div class="pic">${img(i.product)}</div><div><b>${esc(i.product.name)}</b><div class="meta">${rupees(i.product.price)} / ${esc(i.product.unit)}</div></div><div class="qty"><button data-qty="${i.id}" data-d="-1">−</button><span>${i.quantity}</span><button data-qty="${i.id}" data-d="1">+</button></div><button class="remove" data-remove="${i.id}">Remove</button></div>`).join('')+`<div class="total top"><span>Total</span><span>${rupees(c.total)}</span></div><button id="checkout" class="primary">Proceed to checkout</button>`}async function qty(id,d){let x=S.cart.items.find(i=>i.id===id),q=Number(x.quantity)+d;if(q<1)return remove(id);try{await API.Marketplace.updateCartItem(id,{product_id:x.product.id,quantity:q});await refreshCart();renderCart()}catch(e){say(e.message||'Quantity cannot be updated.')}}async function remove(id){try{await API.Marketplace.removeCartItem(id);await refreshCart();renderCart()}catch(e){say('Unable to remove cart item.')}}function renderWish(){$('savedcontent').innerHTML=S.wish.length?S.wish.map(x=>card(x.product)).join(''):state('No saved products yet.','Save products to find them quickly later.','Continue shopping')}async function orders(){modal('ordersmodal');$('orderscontent').innerHTML=state('Loading orders…','');try{let a=(await API.Marketplace.listOrders()).items||[];$('orderscontent').innerHTML=a.length?a.map(o=>`<article class="card" style="padding:16px;margin-top:12px"><div class="top"><b>${esc(o.order_id)}</b><span class="stock">${esc(o.status||'pending')}</span></div><div class="meta">${o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):''} · Payment: ${esc(o.payment_status||'pending')}</div><div class="total top"><span>Total</span><span>${rupees(o.total_amount)}</span></div>${!['delivered','cancelled'].includes(o.status)?`<button class="secondary" data-cancel="${esc(o.order_id)}">Cancel order</button>`:''}</article>`).join(''):state("You haven't placed any orders yet.",'Completed purchases will appear here.','Continue shopping')}catch(e){$('orderscontent').innerHTML=state('Unable to load orders.','Please try again.')}}async function checkout(e){e.preventDefault();let phone=$('deliveryphone').value.trim(),c=S.cart;if(!/^\d{10}$/.test(phone))return say('Enter a valid 10-digit phone number.');try{let r=await API.Marketplace.createOrder({items:c.items.map(i=>({product_id:i.product.product_id,quantity:i.quantity})),delivery_name:$('deliveryname').value.trim(),delivery_phone:phone,delivery_address:$('deliveryaddress').value.trim(),payment_method:$('payment').value});await Promise.all(c.items.map(i=>API.Marketplace.removeCartItem(i.id)));await refreshCart();modal('checkoutmodal',false);modal('cartmodal',false);say(`Order ${r.order_id||''} placed. Payment is pending.`)}catch(e){say(e.message||'Order could not be created.')}}document.addEventListener('click',e=>{let b=e.target.closest('button,[data-detail]');if(!b)return;if(b.dataset.close)return modal(b.dataset.close,false);if(b.dataset.cat!==undefined){S.cat=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));products();return}if(b.dataset.add)return add(b.dataset.add);if(b.dataset.wish)return wish(b.dataset.wish);if(b.dataset.detail)return detail(b.dataset.detail);if(b.dataset.qty)return qty(b.dataset.qty,+b.dataset.d);if(b.dataset.remove)return remove(b.dataset.remove);if(b.id==='checkout'){modal('cartmodal',false);modal('checkoutmodal');return}if(b.dataset.cancel)return API.Marketplace.updateOrder(b.dataset.cancel,{status:'cancelled'}).then(orders).catch(()=>say('This order cannot be cancelled.'))});$('cart').onclick=async()=>{await refreshCart();renderCart();modal('cartmodal')};$('saved').onclick=async()=>{await refreshWish();renderWish();modal('savedmodal')};$('orders').onclick=orders;$('showfilter').onclick=()=>$('filters').classList.toggle('show');$('clear').onclick=()=>{$('min').value='';$('max').value='';$('available').checked=false;products()};['min','max','available','sort'].forEach(x=>$(x).onchange=()=>products());$('more').onclick=()=>{S.p++;products(false)};$('checkoutform').onsubmit=checkout;let t;$('search').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S.q=e.target.value.trim();products()},300)};document.querySelectorAll('.modal').forEach(x=>x.onclick=e=>{if(e.target===x)modal(x.id,false)});(async()=>{await Promise.all([refreshCart(),refreshWish(),API.Marketplace.listCategories().then(r=>(r.items||[]).forEach(c=>{$('cats').insertAdjacentHTML('beforeend',`<button class="cat" data-cat="${esc(c.id)}">${esc(c.name)}</button>`)})).catch(()=>{})]);products()})()})();
</script></body></html>
