<body>

<main class="page-container" style="padding-top:var(--topbar-height);padding-bottom:calc(var(--bottomnav-height)+24px);">


  <div class="page-header">
    <h1><i class="fas fa-hard-hat" style="color:var(--primary-green);"></i> Workers You Can Hire</h1>
    <p>Find and hire skilled workers for harvesting, planting, irrigation, spraying, and other farm activities.</p>
  </div>

  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Search workers by name or skill..." oninput="applyFilters()">
  </div>

  <div class="toolbar-row">
    <select class="form-select" id="workTypeFilter" onchange="applyFilters()">
      <option value="all">All Work Types</option>
      <option value="Harvesting">Harvesting</option>
      <option value="Planting">Planting</option>
      <option value="Seeding">Seeding</option>
      <option value="Weeding">Weeding</option>
      <option value="Irrigation">Irrigation</option>
      <option value="Spraying">Spraying</option>
      <option value="General Farm Work">General Farm Work</option>
    </select>
    <button class="icon-btn" id="starredFilterBtn" onclick="toggleStarredFilter()" title="Starred Workers">
      <i class="fas fa-star"></i>
    </button>
    <button class="icon-btn" id="bookedFilterBtn" onclick="toggleBookedFilter()" title="Booked Workers">
      <i class="fas fa-calendar-check"></i>
    </button>
  </div>

  <div class="sort-row">
    <span id="resultCount" style="font-size:13px;font-weight:600;color:var(--text-secondary);">12 workers found</span>
    <select id="sortSelect" onchange="applyFilters()">
      <option value="nearest">Nearest</option>
      <option value="price-low">Lowest Price</option>
      <option value="highest-rated">Highest Rated</option>
      <option value="available-now">Available Now</option>
    </select>
  </div>

  <div class="grid-2" id="workerGrid"></div>

</main>

<div class="modal-backdrop" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="modal-backdrop" id="bookingModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeBookingModal()"><i class="fas fa-times"></i></button>
    <div id="bookingContent"></div>
  </div>
</div>

<div class="modal-backdrop" id="messageModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeMessageModal()"><i class="fas fa-times"></i></button>
    <h3 style="font-size:17px;font-weight:800;margin-bottom:4px;"><i class="fas fa-comment"></i> Send Message</h3>
    <p id="messageWorkerName" style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;"></p>
    <div class="form-group" style="margin-bottom:14px;">
      <label class="form-label">Subject</label>
      <input type="text" class="form-input" id="messageSubject" placeholder="e.g. Availability for next week...">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label class="form-label">Your Message</label>
      <textarea class="form-textarea" id="messageBody" rows="4" placeholder="Write your message here..."></textarea>
    </div>
    <button class="btn-primary u-full" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Send Message</button>
  </div>
</div>

var currentWorker = null;
var currentDetailWorker = null;

var bookedWorkers = [];

function loadStarred() {
  try {
    starredWorkers = JSON.parse(localStorage.getItem("fa-starred-workers") || "[]");
  } catch (e) {
    starredWorkers = [];
  }
}

function loadBookedWorkers() {
  try {
    var bookings = JSON.parse(localStorage.getItem("fa-worker-bookings") || "[]");
    bookedWorkers = bookings.map(function(b) { return b.workerId; });
  } catch (e) {
    bookedWorkers = [];
  }
}

function saveStarred() {
  localStorage.setItem("fa-starred-workers", JSON.stringify(starredWorkers));
}

function getInitials(name) {
  var parts = (name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
  return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}

function getStarsHTML(rating) {
  var html = "";
  var full = Math.floor(rating);
  var half = rating - full >= 0.5 ? 1 : 0;
  var empty = 5 - full - half;
  for (var i = 0; i < full; i++) {
    html += '<i class="fas fa-star"></i>';
  }
  if (half) {
    html += '<i class="fas fa-star-half-alt"></i>';
  }
  for (var i = 0; i < empty; i++) {
    html += '<i class="far fa-star" style="color:#ddd;"></i>';
  }
  return html;
}

function getAvailClass(avail) {
  var map = { "Available": "avail-available", "Today": "avail-today", "Tomorrow": "avail-tomorrow", "This Week": "avail-week" };
  return map[avail] || "avail-available";
}

function getWorkType(skills) {
  var s = skills.join(" ").toLowerCase();
  if (s.indexOf("harvest") !== -1 || s.indexOf("thresh") !== -1) return "Harvesting";
  if (s.indexOf("tractor") !== -1 || s.indexOf("plough") !== -1 || s.indexOf("tillage") !== -1) return "Planting";
  if (s.indexOf("seed") !== -1 || s.indexOf("sow") !== -1) return "Seeding";
  if (s.indexOf("weed") !== -1 || s.indexOf("hoe") !== -1 || s.indexOf("mulch") !== -1) return "Weeding";
  if (s.indexOf("irrigat") !== -1 || s.indexOf("drip") !== -1 || s.indexOf("sprinkler") !== -1 || s.indexOf("canal") !== -1 || s.indexOf("water") !== -1) return "Irrigation";
  if (s.indexOf("spray") !== -1 || s.indexOf("pesticide") !== -1 || s.indexOf("fertiliz") !== -1 || s.indexOf("drone") !== -1) return "Spraying";
  if (s.indexOf("cattle") !== -1 || s.indexOf("milk") !== -1 || s.indexOf("livestock") !== -1 || s.indexOf("animal") !== -1 || s.indexOf("fodder") !== -1) return "General Farm Work";
  if (s.indexOf("fenc") !== -1 || s.indexOf("clear") !== -1 || s.indexOf("load") !== -1 || s.indexOf("general") !== -1 || s.indexOf("labor") !== -1) return "General Farm Work";
  if (s.indexOf("plant") !== -1 || s.indexOf("nursery") !== -1 || s.indexOf("transplant") !== -1 || s.indexOf("bed") !== -1) return "Planting";
  if (s.indexOf("harvester") !== -1 || s.indexOf("baler") !== -1 || s.indexOf("maintenance") !== -1 || s.indexOf("rotavator") !== -1) return "Harvesting";
  if (s.indexOf("team") !== -1 || s.indexOf("quality") !== -1 || s.indexOf("coordination") !== -1) return "Harvesting";
  if (s.indexOf("gps") !== -1) return "Planting";
  return "General Farm Work";
}

    html += '</div>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  }

function applyFilters() {
  var search = document.getElementById("searchInput").value.toLowerCase().trim();
  var sort = document.getElementById("sortSelect").value;
  var workType = document.getElementById("workTypeFilter").value;
  var filtered = [];
  for (var i = 0; i < workers.length; i++) {
    var w = workers[i];
    if (starredFilterActive) {
      if (starredWorkers.indexOf(w.id) === -1) continue;
    }
    if (bookedFilterActive) {
      if (bookedWorkers.indexOf(w.id) === -1) continue;
    }
    if (workType !== "all") {
      var wt = getWorkType(w.skills);
      if (wt !== workType) continue;
    }
    if (search) {
      var haystack = (w.name + " " + w.skills.join(" ") + " " + w.location).toLowerCase();
      if (haystack.indexOf(search) === -1) continue;
    }
    filtered.push(w);
  }
  if (sort === "price-low") {
    filtered.sort(function(a, b) { return a.hourly - b.hourly; });
  } else if (sort === "highest-rated") {
    filtered.sort(function(a, b) { return b.rating - a.rating; });
  } else if (sort === "nearest") {
    filtered.sort(function(a, b) { return a.distance - b.distance; });
  } else if (sort === "available-now") {
    var order = { "Available": 0, "Today": 1, "Tomorrow": 2, "This Week": 3 };
    filtered.sort(function(a, b) { return (order[a.availability] || 99) - (order[b.availability] || 99); });
  }
  renderWorkers(filtered);
}

function toggleStar(id) {
  var idx = starredWorkers.indexOf(id);
  if (idx === -1) {
    starredWorkers.push(id);
  } else {
    starredWorkers.splice(idx, 1);
  }
  saveStarred();
  applyFilters();
}

function toggleStarredFilter() {
  starredFilterActive = !starredFilterActive;
  document.getElementById("starredFilterBtn").classList.toggle("active", starredFilterActive);
  applyFilters();
}

function toggleBookedFilter() {
  bookedFilterActive = !bookedFilterActive;
  document.getElementById("bookedFilterBtn").classList.toggle("active", bookedFilterActive);
  if (bookedFilterActive) {
    loadBookedWorkers();
  }
  applyFilters();
}

function timeToHours(t) {
  if (!t) return 0;
  var parts = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!parts) return 0;
  var h = parseInt(parts[1], 10);
  var m = parseInt(parts[2], 10);
  var ampm = parts[3].toUpperCase();
  if (ampm === "PM" && h !== 12) h += 12;
  if (ampm === "AM" && h === 12) h = 0;
  return h + m / 60;
}

function calcBookingCost() {
  var startStr = document.getElementById("bookingStartTime").value;
  var endStr = document.getElementById("bookingEndTime").value;
  if (!startStr || !endStr || !currentWorker) return;
  var startH = timeToHours(startStr);
  var endH = timeToHours(endStr);
  var hours = endH - startH;
  if (hours <= 0) {
    document.getElementById("calcHours").textContent = "0";
    document.getElementById("calcSubtotal").textContent = "\u20B90";
    document.getElementById("calcGST").textContent = "\u20B90";
    document.getElementById("calcTotal").textContent = "\u20B90";
    return;
  }
  var subtotal = hours * currentWorker.hourly;
  var gst = subtotal * 0.18;
  var total = subtotal + gst;
  document.getElementById("calcHours").textContent = hours.toFixed(1);
  document.getElementById("calcSubtotal").textContent = "\u20B9" + Math.round(subtotal).toLocaleString();
  document.getElementById("calcGST").textContent = "\u20B9" + Math.round(gst).toLocaleString();
  document.getElementById("calcTotal").textContent = "\u20B9" + Math.round(total).toLocaleString();
}

function confirmBooking() {
  if (!currentWorker) return;
  var date = document.getElementById("bookingDate").value;
  var startTime = document.getElementById("bookingStartTime").value;
  var endTime = document.getElementById("bookingEndTime").value;
  var startH = timeToHours(startTime);
  var endH = timeToHours(endTime);
  var hours = endH - startH;
  if (!date || !startTime || !endTime || hours <= 0) {
    alert("Please select a date, start time, and end time.");
    return;
  }
  var subtotal = hours * currentWorker.hourly;
  var gst = subtotal * 0.18;
  var total = subtotal + gst;
  var bookingId = "WB-" + Date.now().toString(36).toUpperCase();
  var booking = {
    id: bookingId,
    workerId: currentWorker.id,
    workerName: currentWorker.name,
    date: date,
    startTime: startTime,
    endTime: endTime,
    hours: hours,
    hourlyRate: currentWorker.hourly,
    subtotal: Math.round(subtotal),
    gst: Math.round(gst),
    total: Math.round(total),
    createdAt: new Date().toISOString()
  };
  var localBookings = JSON.parse(localStorage.getItem("fa-worker-bookings") || "[]");
  localBookings.push(booking);
  localStorage.setItem("fa-worker-bookings", JSON.stringify(localBookings));
  closeBookingModal();
  showToastMsg("Worker Booked Successfully!");
  loadBookedWorkers();
  if (bookedFilterActive) applyFilters();
}

function showToastMsg(msg, type) {
  type = type || "success";
  var container = document.getElementById("toast-container");
  if (!container) {
    container = document.createElement("div");
    container.id = "toast-container";
    container.className = "toast-container";
    document.body.appendChild(container);
  }
  var toast = document.createElement("div");
  toast.className = "toast-msg " + type;
  var icons = { success: "fa-check-circle", danger: "fa-exclamation-circle", warning: "fa-exclamation-triangle", info: "fa-info-circle" };
  var icon = icons[type] || icons.success;
  toast.innerHTML = '<i class="fas ' + icon + '"></i><span>' + msg + '</span>';
  container.appendChild(toast);
  requestAnimationFrame(function() { toast.classList.add("show"); });
  setTimeout(function() {
    toast.classList.remove("show");
    toast.classList.add("hide");
    setTimeout(function() { toast.remove(); }, 300);
  }, 3000);
}

function sendMessage() {

  var subject = document.getElementById("messageSubject").value.trim();

  if (!subject || !body) {
    alert("Please enter both a subject and message.");
    return;
  }
  var msg = {
    id: "MSG-" + Date.now().toString(36).toUpperCase(),
    workerId: currentWorker.id,
    workerName: currentWorker.name,
    subject: subject,
    body: body,
    sentAt: new Date().toISOString()
  };
  var inbox = JSON.parse(localStorage.getItem("fa-worker-messages") || "[]");
  inbox.push(msg);
  localStorage.setItem("fa-worker-messages", JSON.stringify(inbox));
  closeMessageModal();
  showToastMsg("Message sent to " + currentWorker.name + " successfully!");
}

      if (e.target === m) m.classList.remove("active");
    });
  });
  loadStarred();
  loadBookedWorkers();
  if (window.API && window.API.Worker && window.API.Worker.list) {
    API.Worker.list().then(function(res) {
      var items = [];
      if (res && Array.isArray(res.items)) {
        items = res.items;
      } else if (res && Array.isArray(res)) {
        items = res;
      }
      if (items.length > 0) {
        workers = items.map(mapApiWorker);
      }
      applyFilters();
    }).catch(function() {
      applyFilters();
    });
  } else {
    applyFilters();
  }
});

function mapApiWorker(api) {
  var skills = api.skills || [];
  if (typeof skills === "string") {
    try { skills = JSON.parse(skills); } catch (e) { skills = skills.split(",").map(function(s) { return s.trim(); }); }
  }
  var loc = [api.village, api.district, api.state].filter(Boolean).join(", ") || "Unknown";
  var availOptions = ["Available", "Today", "Tomorrow", "This Week"];
  return {
    id: api.id,
    name: api.full_name || "Unknown Worker",
    skills: skills,
    experience: api.experience_years || 0,
    location: loc,
    distance: 0,
    rating: api.rating || 0,
    reviews: api.total_reviews || 0,
    hourly: api.hourly_rate || 0,
    availability: availOptions[Math.floor(Math.random() * availOptions.length)],
    color: ["#1B5E3F","#5D4037","#E65100","#283593","#7B1FA2","#4E342E","#0D47A1","#00897B","#6A1B9A","#AD1457","#2E7D32"][Math.floor(Math.random() * 11)],
    bio: api.bio || "Professional farm worker.",
    history: [],
    reviews: [],
    languages: ["Hindi"],
    _apiId: api.id
  };
}
</script>
