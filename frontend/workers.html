<script src="js/services.js"></script>
<script src="js/userStore.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  'use strict';

  var PAGE_SIZE = 60;
  var searchTimer = null;
  var catalog = { page: 1, totalPages: 1, total: 0, items: [], loading: false };
  var bookings = { page: 1, totalPages: 1, total: 0, items: [], loading: false, filter: 'all' };
  var filtersData = null;
  var activeFilters = {};
  var filterCount = 0;
  var currentWorker = null;   // full worker being detailed/booked
  var currentBookingList = [];// bookings currently rendered
  var editMode = 'explore';
  var reviewCtx = null;       // { workerId, workerName, bookingId }
  var farmNameMap = {};       // farmIdKey -> human farm name (booking step 1)
  var plotNameMap = {};       // plotId -> human plot name (booking step 1)

  var AVAIL_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var WORK_TYPES = ['Harvesting', 'Planting', 'Seeding', 'Weeding', 'Irrigation', 'Spraying', 'General Farm Work'];

  // ---------- Utilities ----------
  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function errMsg(err, fb) {
    if (err && typeof err.detail === 'string' && err.detail) return err.detail;
    if (err && err.data && typeof err.data.detail === 'string' && err.data.detail) return err.data.detail;
    if (err && typeof err.message === 'string' && err.message) return err.message;
    return fb || 'Something went wrong. Please try again.';
  }

  function toast(msg, type) {
    type = type || 'success';
    var wrap = $('wrkToasts');
    if (!wrap) return;
    var el = document.createElement('div');
    el.className = 'wrk-toast ' + type;
    var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
    el.innerHTML = '<i class="fas ' + (icons[type] || icons.success) + '"></i><span></span>';
    el.querySelector('span').textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 300);
    }, 3600);
  }

  function initials(name) {
    var parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0][0].toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  var AVATAR_COLORS = ['#1B5E3F', '#2D6A4F', '#5D4037', '#6A994E', '#0F766E', '#4E342E', '#3E7C59', '#7B4A3A'];
  function avatarColor(id) {
    var h = 0;
    var s = String(id || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function skillStr(skills) {
    if (!skills) return '';
    if (typeof skills === 'string') {
      try { skills = JSON.parse(skills); } catch (e) { return skills; }
    }
    if (!Array.isArray(skills)) return '';
    return skills.join(', ');
  }

  function firstSkill(skills) {
    if (!skills) return '';
    if (typeof skills === 'string') {
      try { skills = JSON.parse(skills); } catch (e) { return skills.split(',')[0] || ''; }
    }
    return Array.isArray(skills) && skills.length ? skills[0] : '';
  }

  function parseRate(worker) {
    var daily = parseFloat(worker.daily_rate);
    var hourly = parseFloat(worker.hourly_rate);
    if (daily > 0) return { type: 'day', value: daily };
    if (hourly > 0) return { type: 'hr', value: hourly };
    return null;
  }

  function moneys(n) {
    if (n == null) return '\u20b90';
    return '\u20b9' + Number(n).toLocaleString('en-IN');
  }

  function starsHTML(rating) {
    var r = Number(rating) || 0;
    if (r <= 0) return '<span style="font-size:10px;color:var(--text-muted);font-weight:600;">New</span>';
    var html = '';
    for (var i = 1; i <= 5; i++) {
      if (r >= i - 0.25) html += '<i class="fas fa-star"></i>';
      else if (r >= i - 0.75) html += '<i class="fas fa-star-half-alt"></i>';
      else html += '<i class="far fa-star" style="opacity:.4;"></i>';
    }
    return html;
  }

  function availabilityLabel(worker) {
    return worker && worker.is_available ? 'Available' : 'Unavailable';
  }

  function timeClamp(h) {
    return Math.round((h || 0) * 4) / 4;
  }

  function costFor(worker, startTime, endTime, days) {
    var r = parseRate(worker);
    if (!r) return 0;
    var daysN = Math.max(1, parseInt(days, 10) || 1);
    if (r.type === 'day') return r.value * daysN;
    var sh = timeClamp(startTime);
    var eh = timeClamp(endTime);
    var hours = Math.max(0, eh - sh);
    return r.value * hours * daysN;
  }

  function loadDistrictsFromFilters() {
    var set = {};
    var d = filtersData;
    if (d && Array.isArray(d.locations)) {
      d.locations.forEach(function (loc) {
        var parts = String(loc).split(',').map(function (p) { return p.trim(); });
        if (parts.length > 1 && parts[1]) set[parts[1]] = true;
      });
    }
    return Object.keys(set).sort();
  }

  // ---------- Auth / API ----------
  function isAuthed() {
    return !!(window.UserStore && UserStore.isLoggedIn());
  }

  function notFound() {
    toast('Please log in to view workers.', 'warning');
    window.location.href = 'index.html';
  }

  // ---------- Catalog loading (server-side search + filters) ----------
  function paramsFromState(page) {
    var p = {
      page: page || catalog.page,
      limit: PAGE_SIZE,
      sort_by: 'rating',
      sort_order: 'desc'
    };
    var sort = ($('wrkSort') || {}).value || 'rating-desc';
    if (sort === 'rating-desc') { p.sort_by = 'rating'; p.sort_order = 'desc'; }
    else if (sort === 'experience-desc') { p.sort_by = 'experience_years'; p.sort_order = 'desc'; }
    else if (sort === 'rate-asc') { p.sort_by = 'daily_rate'; p.sort_order = 'asc'; }
    else if (sort === 'rate-desc') { p.sort_by = 'daily_rate'; p.sort_order = 'desc'; }
    else if (sort === 'available') { p.sort_by = 'is_available'; }

    var q = ($('wrkSearch') || {}).value || '';
    if (q && q.trim()) p.search = q.trim();
    if (activeFilters.work_type) p.work_type = activeFilters.work_type;
    if (activeFilters.skill) p.skill = activeFilters.skill;
    if (activeFilters.location) p.district = activeFilters.location;
    if (activeFilters.exp) p.min_experience = activeFilters.exp;
    if (activeFilters.rating) p.min_rating = activeFilters.rating;
    if (activeFilters.avail) p.is_available = true;
    return p;
  }

  function renderSkeletons() {
    var grid = $('wrkWorkerGrid');
    var html = '';
    for (var i = 0; i < 12; i++) html += '<div class="wrk-skel"></div>';
    grid.innerHTML = html;
    $('wrkResultCount').textContent = 'Finding workers...';
  }

  function renderEmpty(title, sub, ctaText, ctaFn) {
    var grid = $('wrkWorkerGrid');
    grid.innerHTML =
      '<div class="wrk-empty"><i class="fas fa-tractor"></i><h3>' + esc(title) + '</h3><p>' + esc(sub || '') + '</p>' +
      (ctaText ? '<div style="margin-top:14px;"><button class="wrk-btn wrk-btn-primary" style="max-width:220px;margin:0 auto;" onclick="' + ctaFn + '">' + esc(ctaText) + '</button></div>' : '') +
      '</div>';
  }

  function renderError(msg) {
    var grid = $('wrkWorkerGrid');
    grid.innerHTML =
      '<div class="wrk-empty"><i class="fas fa-exclamation-triangle"></i><h3>Something went wrong</h3><p>' + esc(msg) + '</p>' +
      '<div style="margin-top:14px;"><button class="wrk-btn wrk-btn-primary" style="max-width:160px;margin:0 auto;" onclick="WorkersApp.loadWorkers()">Try Again</button></div></div>';
    $('wrkResultCount').textContent = '';
  }

  function renderWorkerCard(w) {
    var r = parseRate(w);
    var rateHtml = r ? '<span class="wrk-rate">' + moneys(r.value) + '<small>/' + (r.type === 'day' ? 'day' : 'hr') + '</small></span>' : '';
    var availCls = w.is_available ? 'on' : 'off';
    var avail = availabilityLabel(w);
    var loc = [w.village, w.district].filter(Boolean).join(', ');
    var exp = (w.experience_years != null && w.experience_years > 0) ? w.experience_years + ' yr' + (w.experience_years > 1 ? 's' : '') : null;
    var showRating = Number(w.rating) > 0;
    var bookDisabled = !w.is_available ? 'disabled' : '';
    var bookTitle = !w.is_available ? 'Worker is currently unavailable' : '';
    return '' +
      '<div class="wrk-card">' +
        '<div class="wrk-card-head">' +
          '<div class="wrk-avatar" style="background:' + avatarColor(w.id) + ';">' + esc(initials(w.full_name)) +
            (w.is_verified ? '<span class="wrk-verified"><i class="fas fa-check"></i></span>' : '') +
          '</div>' +
          '<div style="min-width:0;">' +
            '<div class="wrk-card-name">' + esc(w.full_name) + '</div>' +
            '<div class="wrk-card-skill">' + esc(firstSkill(w.skills)) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wrk-card-meta">' +
          (loc ? '<span><i class="fas fa-map-marker-alt"></i> ' + esc(loc) + '</span>' : '') +
          (exp ? '<span><i class="fas fa-award"></i> ' + esc(exp) + '</span>' : '') +
        '</div>' +
        '<div class="wrk-card-meta">' +
          (showRating ? '<span class="wrk-rating">' + starsHTML(w.rating) + ' ' + w.rating + ' <span style="color:var(--text-muted);font-weight:400;">(' + (w.total_reviews || 0) + ')</span></span>' : '<span class="wrk-rating">No ratings yet</span>') +
        '</div>' +
        (w.bio ? '<div class="wrk-bio">' + esc(w.bio) + '</div>' : '') +
        '<div class="wrk-card-foot">' +
          '<span class="wrk-avail ' + availCls + '"><i class="fas fa-circle" style="font-size:7px;"></i> ' + esc(avail) + '</span>' +
          rateHtml +
        '</div>' +
        '<div class="wrk-card-actions">' +
          '<button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.viewWorker(\'' + esc(w.id) + '\')"><i class="fas fa-eye"></i> View</button>' +
          '<button class="wrk-btn wrk-btn-primary" onclick="WorkersApp.startBooking(\'' + esc(w.id) + '\')" ' + bookDisabled + ' title="' + bookTitle + '"><i class="fas fa-calendar-check"></i> Book</button>' +
        '</div>' +
      '</div>';
  }

  function loadWorkers(page) {
    if (catalog.loading) return;
    catalog.loading = true;
    renderSkeletons();

    var p = paramsFromState(page);
    API.Worker.list(p).then(function (res) {
      catalog.loading = false;
      if (!res || !Array.isArray(res.items)) {
        renderEmpty('No results', 'No workers available for your selected filters.');
        $('wrkPagination').innerHTML = '';
        return;
      }
      catalog.items = res.items;
      catalog.total = res.total || 0;
      catalog.totalPages = res.total_pages || 1;
      catalog.page = p.page || 1;

      if (!catalog.items.length) {
        renderEmpty('No workers available', 'No workers available for your selected filters.', 'Clear Filters', 'WorkersApp.clearFilters()');
        $('wrkResultCount').textContent = '0 workers found';
      } else {
        $('wrkWorkerGrid').innerHTML = catalog.items.map(renderWorkerCard).join('');
        $('wrkResultCount').textContent = catalog.total + ' worker' + (catalog.total === 1 ? '' : 's') + ' found';
      }
      renderPagination();
    }).catch(function (err) {
      catalog.loading = false;
      console.error('workers list error', err);
      if (err && (err.status === 401 || err.status === 403)) { notFound(); return; }
      renderError('Unable to load workers right now.');
    });
  }

  function renderPagination() {
    var el = $('wrkPagination');
    if (catalog.totalPages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<button class="wrk-page-btn" onclick="WorkersApp.goPage(' + (catalog.page - 1) + ')" ' + (catalog.page <= 1 ? 'disabled' : '') + '><i class="fas fa-chevron-left"></i> Prev</button>' +
      '<span class="wrk-page-info">Page ' + catalog.page + ' of ' + catalog.totalPages + '</span>' +
      '<button class="wrk-page-btn" onclick="WorkersApp.goPage(' + (catalog.page + 1) + ')" ' + (catalog.page >= catalog.totalPages ? 'disabled' : '') + '>Next <i class="fas fa-chevron-right"></i></button>';
  }

  // ---------- Filters UI ----------
  function loadFilters() {
    API.Worker.getFilters().then(function (res) {
      filtersData = res;
      var wtSel = $('fltWorkType');
      var skillSel = $('fltSkill');
      var locSel = $('fltLocation');
      if (Array.isArray(res.work_types) && res.work_types.length) {
        res.work_types.concat(WORK_TYPES.filter(function (x) { return res.work_types.indexOf(x) === -1; })).forEach(function (wt) {
          wtSel.insertAdjacentHTML('beforeend', '<option value="' + esc(wt) + '">' + esc(wt) + '</option>');
        });
      } else {
        WORK_TYPES.forEach(function (wt) { wtSel.insertAdjacentHTML('beforeend', '<option value="' + esc(wt) + '">' + esc(wt) + '</option>'); });
      }
      if (Array.isArray(res.skills)) {
        res.skills.forEach(function (s) { skillSel.insertAdjacentHTML('beforeend', '<option value="' + esc(s) + '">' + esc(s) + '</option>'); });
      }
      loadDistrictsFromFilters().forEach(function (d) {
        locSel.insertAdjacentHTML('beforeend', '<option value="' + esc(d) + '">' + esc(d) + '</option>');
      });
    }).catch(function (e) {
      console.error('filters load error', e);
    });
  }

  function gatherActiveFilters() {
    var f = {};
    var wt = $('fltWorkType').value;
    var sk = $('fltSkill').value;
    var lo = $('fltLocation').value;
    var ex = $('fltExp').value;
    var rt = $('fltRating').value;
    var av = $('fltAvail').checked;
    if (wt) f.work_type = wt;
    if (sk) f.skill = sk;
    if (lo) f.location = lo;
    if (ex) f.exp = ex;
    if (rt) f.rating = rt;
    if (av) f.avail = true;
    return f;
  }

  function updateFilterCount() {
    var n = Object.keys(gatherActiveFilters()).length;
    var el = $('wrkFilterCount');
    el.style.display = n ? 'inline-block' : 'none';
    el.textContent = n;
  }

  // ---------- Worker detail ----------
  function viewWorker(id) {
    var modal = $('wrkDetailModal');
    $('wrkDetailContent').innerHTML =
      '<div class="wrk-empty" style="padding:40px 0;"><i class="fas fa-spinner fa-spin" style="color:var(--wrk);"></i><h3>Loading worker profile...</h3></div>';
    modal.classList.add('open');
    API.Worker.get(id).then(function (w) {
      currentWorker = w;
      renderDetail(w);
    }).catch(function (err) {
      console.error('worker detail error', err);
      if (err && (err.status === 401 || err.status === 403)) { modal.classList.remove('open'); notFound(); return; }
      $('wrkDetailContent').innerHTML =
        '<div class="wrk-empty"><i class="fas fa-exclamation-triangle"></i><h3>Unable to load profile</h3><p>Please try again.</p>' +
        '<div style="margin-top:14px;"><button class="wrk-btn wrk-btn-primary" style="max-width:150px;margin:0 auto;" onclick="WorkersApp.viewWorker(\'' + esc(id) + '\')">Try Again</button></div></div>';
    });
  }

  function renderDetail(w) {
    var r = parseRate(w);
    var loc = [w.village, w.district, w.state].filter(Boolean).join(', ');
    var showRating = Number(w.rating) > 0;
    var skills = skillStr(w.skills).split(', ').filter(Boolean);
    var avail = w.availability || [];
    var availRows = '';
    if (avail.length) {
      availRows = '<table class="wrk-avail-table"><tr><th>Day</th><th>Status</th><th>Hours</th></tr>';
      for (var d = 0; d < 7; d++) {
        var row = avail.filter(function (a) { return a.day_of_week === d; })[0];
        var dayName = AVAIL_DAYS[d];
        if (row) {
          var open = row.is_available ? 'Available' : 'Unavailable';
          var hrs = row.is_available ? (row.start_time + ' - ' + row.end_time) : '—';
          availRows += '<tr><td>' + dayName + '</td><td>' + open + '</td><td>' + hrs + '</td></tr>';
        } else {
          availRows += '<tr><td>' + dayName + '</td><td style="color:var(--text-muted);">Not set</td><td>—</td></tr>';
        }
      }
      availRows += '</table>';
    }

    var historyHtml = '';
    if (w.history && w.history.length) {
      w.history.slice(0, 8).forEach(function (h) {
        historyHtml += '<div class="wrk-history-item"><span class="h-w">' + esc(h.work_type || 'Farm work') + '</span><span class="h-m">' + esc(h.farm_name || '') + ' &middot; ' + esc(h.booking_date || '') + '</span></div>';
      });
    } else {
      historyHtml = '<div style="font-size:12px;color:var(--text-muted);">No completed jobs recorded yet.</div>';
    }

    var reviewsHtml = '';
    var wReviews = w.reviews || [];
    if (wReviews.length) {
      wReviews.slice(0, 6).forEach(function (rv) {
        reviewsHtml += '<div class="wrk-review-item"><div class="r-head"><span class="r-name">' + esc(rv.reviewer_name || 'Farmer') + '</span><span class="r-stars">' + starsHTML(rv.rating) + '</span></div><div class="r-text">' + esc(rv.comment || '') + '</div></div>';
      });
    } else {
      reviewsHtml = '<div style="font-size:12px;color:var(--text-muted);">No reviews yet.</div>';
    }

    $('wrkDetailContent').innerHTML =
      '<div class="wrk-detail-top">' +
        '<div class="wrk-avatar-lg" style="background:' + avatarColor(w.id) + ';">' + esc(initials(w.full_name)) +
          (w.is_verified ? '<span class="wrk-verified"><i class="fas fa-check"></i></span>' : '') +
        '</div>' +
        '<div style="flex:1;min-width:200px;">' +
          '<div class="wrk-detail-name">' + esc(w.full_name) + (w.is_verified ? ' <span class="wrk-chip" style="background:#DCFCE7;color:#166534;"><i class="fas fa-badge-check"></i> Verified</span>' : '') + '</div>' +
          '<div class="wrk-meta-row">' +
            (showRating ? '<span class="wrk-rating" style="color:var(--text-primary);">' + starsHTML(w.rating) + ' ' + w.rating + ' (' + (w.total_reviews || 0) + ')</span>' : '') +
            '<span><i class="fas fa-map-marker-alt"></i> ' + esc(loc || 'Location not set') + '</span>' +
            (w.experience_years ? '<span><i class="fas fa-award"></i> ' + esc(w.experience_years) + ' yr' + (w.experience_years > 1 ? 's' : '') + ' experience</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="wrk-section"><h4><i class="fas fa-chart-line"></i> Rate</h4><div class="wrk-rate-box">' +
        (w.daily_rate != null && w.daily_rate > 0 ? '<div class="wrk-rate-pill"><b>' + moneys(w.daily_rate) + '</b><span>Per Day</span></div>' : '') +
        (w.hourly_rate != null && w.hourly_rate > 0 ? '<div class="wrk-rate-pill"><b>' + moneys(w.hourly_rate) + '</b><span>Per Hour</span></div>' : '') +
        (!r ? '<div class="wrk-rate-pill"><b>Contact</b><span>Rate on request</span></div>' : '') +
      '</div></div>' +

      '<div class="wrk-section"><h4><i class="fas fa-cogs"></i> Skills</h4><div class="wrk-skills">' +
        (skills.length ? skills.map(function (s) { return '<span class="wrk-chip">' + esc(s) + '</span>'; }).join('') : '<span class="wrk-chip">Farm work</span>') +
      '</div></div>' +

      (w.bio ? '<div class="wrk-section"><h4><i class="fas fa-info-circle"></i> About</h4><p style="font-size:12.5px;color:var(--text-secondary);line-height:1.6;">' + esc(w.bio) + '</p></div>' : '') +

      '<div class="wrk-section"><h4><i class="fas fa-calendar-week"></i> Availability</h4>' +
        (availRows || '<div style="font-size:12px;color:var(--text-muted);">' + esc(availabilityLabel(w)) + '</div>') +
      '</div>' +

      '<div class="wrk-section"><h4><i class="fas fa-briefcase"></i> Completed Jobs</h4>' + historyHtml + '</div>' +

      '<div class="wrk-section"><h4><i class="fas fa-star"></i> Reviews</h4>' + reviewsHtml + '</div>' +

      '<div style="display:flex;gap:10px;margin-top:6px;">' +
        '<button class="wrk-btn wrk-btn-secondary" style="flex:1;padding:11px;background:var(--wrk-bg);color:var(--wrk-dark);border:none;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;" onclick="WorkersApp.closeDetail()">Close</button>' +
        '<button class="wrk-btn" style="flex:1;padding:11px;background:var(--wrk);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;" onclick="WorkersApp.startBooking(\'' + esc(w.id) + '\')"' + (!w.is_available ? ' disabled' : '') + '><i class="fas fa-calendar-check"></i> Book Worker</button>' +
      '</div>';
  }

  // ---------- Booking wizard ----------
  var BSTEP = 1;
  var booking = {
    worker_id: null,
    farm_id: null,
    plot_id: null,
    work_type: '',
    booking_date: '',
    start_time: '',
    end_time: '',
    duration_days: 1,
    hours_per_day: 8,
    notes: '',
    wallet_pin: '',
    walletBalance: null,
    farm_name: '',
    plot_name: '',
    maxStep: 1
  };

  function resetBookingDraft() {
    booking = {
      worker_id: null, farm_id: null, plot_id: null, work_type: '',
      booking_date: '', start_time: '', end_time: '', duration_days: 1,
      hours_per_day: 8, notes: '', wallet_pin: '', walletBalance: null,
      farm_name: '', plot_name: '', maxStep: 1
    };
    farmNameMap = {};
    plotNameMap = {};
  }

  function startBooking(id) {
    // Reopening the wizard for the same worker resumes where you left off,
    // with everything previously entered pre-filled and editable.
    if (booking.worker_id && booking.worker_id === id && currentWorker && currentWorker.id === id && (booking.maxStep > 1 || booking.farm_id)) {
      var m0 = $('wrkBookingModal');
      m0.classList.add('open');
      if (booking.maxStep >= 4) renderBookingStep4();
      else if (booking.maxStep === 3) renderBookingStep3();
      else if (booking.maxStep === 2) renderBookingStep2();
      else renderBookingStep1();
      return;
    }
    BSTEP = 1;
    resetBookingDraft();
    booking.worker_id = id;
    if (currentWorker && currentWorker.id === id) {
      renderBookingStep1();
    } else {
      var modal = $('wrkBookingModal');
      modal.classList.add('open');
      $('wrkBookingContent').innerHTML = '<div class="wrk-empty"><i class="fas fa-spinner fa-spin" style="color:var(--wrk);"></i><h3>Loading availability...</h3></div>';
      renderSteps();
      API.Worker.get(id).then(function (w) {
        currentWorker = w;
        booking.worker_id = id;
        renderBookingStep1();
      }).catch(function (err) {
        modal.classList.remove('open');
        toast('Unable to load the worker. Please try again.', 'error');
      });
    }
  }

  function renderSteps() {
    var labels = ['Farm &amp; Work', 'Date &amp; Time', 'Details', 'Review'];
    var html = '';
    for (var i = 1; i <= 4; i++) {
      var cls = i === BSTEP ? 'active' : (i < BSTEP ? 'done' : '');
      html += '<div class="wrk-step ' + cls + '"><span class="wrk-step-num">' + (i < BSTEP ? '<i class="fas fa-check"></i>' : i) + '</span><div class="wrk-step-label">' + labels[i - 1] + '</div></div>';
    }
    $('wrkSteps').innerHTML = html;
  }

  function resetBookingContent() {
    var modal = $('wrkBookingModal');
    modal.classList.add('open');
    renderSteps();
    $('wrkBookingContent').innerHTML = '<div class="wrk-empty" style="padding:30px 0;"><i class="fas fa-spinner fa-spin" style="color:var(--wrk);"></i><h3>Loading...</h3></div>';
  }

  function workerSummaryLine() {
    if (!currentWorker) return '';
    var r = parseRate(currentWorker);
    return '<div class="wrk-summary"><div class="line"><span>Worker</span><span>' + esc(currentWorker.full_name) + '</span></div>' +
      (r ? '<div class="line"><span>Rate</span><span>' + moneys(r.value) + '/' + (r.type === 'day' ? 'day' : 'hr') + '</span></div>' : '') +
      '</div>';
  }

  function bookingWorkTypeOptions() {
    var list = WORK_TYPES.slice();
    if (filtersData && Array.isArray(filtersData.work_types)) {
      filtersData.work_types.forEach(function (wt) { if (list.indexOf(wt) === -1) list.push(wt); });
    }
    return list.map(function (wt) { return '<option value="' + esc(wt) + '">' + esc(wt) + '</option>'; }).join('');
  }

  function renderBookingStep1() {
    BSTEP = 1;
    resetBookingContent();
    $('wrkBookingContent').innerHTML =
      workerSummaryLine() +
      '<div class="wrk-field"><label>Farm</label><select class="wrk-input" id="bFarm" onchange="WorkersApp.onFarmChange()"><option value="">Select farm...</option></select></div>' +
      '<div class="wrk-field" id="bPlotWrap" style="display:none;"><label>Plot <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label><select class="wrk-input" id="bPlot"></select></div>' +
      '<div class="wrk-field"><label>Work Type</label><select class="wrk-input" id="bWorkType" onchange="WorkersApp.onWorkTypeChange()">' +
        bookingWorkTypeOptions() +
      '</select></div>' +
      '<div class="wrk-wizard-actions"><button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.closeBooking()">Cancel</button><button class="wrk-btn wrk-btn-primary" onclick="WorkersApp.bookingNext1()">Next <i class="fas fa-chevron-right"></i></button></div>';

    // Load farms
    API.Farm.list().then(function (farms) {
      var sel = $('bFarm');
      var rows = Array.isArray(farms) ? farms : (farms && Array.isArray(farms.items) ? farms.items : []);
      if (!rows.length) {
        sel.insertAdjacentHTML('beforeend', '<option value="">No farms found</option>');
        sel.disabled = true;
        toast('Add a farm in Farm Management before booking.', 'warning');
        return;
      }
      rows.forEach(function (f) {
        var name = f.farm_name || 'Farm';
        var key = String(f.farm_id || f.id);
        farmNameMap[key] = name;
        var loc = [f.village, f.district, f.state].filter(Boolean).join(', ');
        sel.insertAdjacentHTML('beforeend', '<option value="' + esc(key) + '">' + esc(name) + (loc ? ' — ' + esc(loc) : '') + '</option>');
      });
      var savedPlot = booking.plot_id;
      if (booking.farm_id) sel.value = booking.farm_id;
      if (savedPlot) WorkersApp.onFarmChange(savedPlot);
    }).catch(function () { toast('Unable to load your farms.', 'error'); });

    // Pre-select work type = previously saved value, else the worker's first matching skill
    var savedWork = booking.work_type;
    if (savedWork) {
      setTimeout(function () { var s = $('bWorkType'); if (s) s.value = savedWork; }, 0);
    } else {
      var first = firstSkill(currentWorker && currentWorker.skills);
      if (first && WORK_TYPES.indexOf(first) !== -1) {
        setTimeout(function () { var s = $('bWorkType'); if (s) s.value = first; }, 0);
      }
    }
  }

  function onFarmChange(preselectPlot) {
    var fsel = $('bFarm');
    var fval = fsel.value;
    var wrap = $('bPlotWrap');
    var psel = $('bPlot');
    booking.farm_id = fval || null;
    booking.farm_name = (fval && farmNameMap[fval]) ? farmNameMap[fval] : (fval || '');
    booking.plot_id = null;
    booking.plot_name = '';
    if (!fval) { wrap.style.display = 'none'; psel.innerHTML = '<option value="">Select plot...</option>'; return; }
    wrap.style.display = 'block';
    psel.innerHTML = '<option value="">Loading plots...</option>';
    API.Farm.getPlots(fval).then(function (plots) {
      var rows = Array.isArray(plots) ? plots : (plots && Array.isArray(plots.items) ? plots.items : []);
      if (!rows.length) {
        wrap.style.display = 'none';
        psel.innerHTML = '<option value="">No plots</option>';
        return;
      }
      psel.innerHTML = '<option value="">No specific plot</option>';
      rows.forEach(function (p) {
        plotNameMap[p.id] = p.plot_name || 'Plot';
        psel.insertAdjacentHTML('beforeend', '<option value="' + esc(p.id) + '">' + esc(p.plot_name) + (p.area ? ' (' + p.area + ')' : '') + '</option>');
      });
      if (preselectPlot) psel.value = preselectPlot;
    }).catch(function () { wrap.style.display = 'none'; psel.innerHTML = '<option value="">No specific plot</option>'; });
  }

  function bookingNext1() {
    var fsel = $('bFarm');
    var fval = (fsel && fsel.value) || '';
    if (!fval) { toast('Please select a farm.', 'error'); return; }
    booking.farm_id = fval;
    booking.farm_name = (fval && farmNameMap[fval]) ? farmNameMap[fval] : fval;
    var psel = $('bPlot');
    booking.plot_id = (psel && psel.value) ? psel.value : null;
    booking.plot_name = (booking.plot_id && plotNameMap[booking.plot_id]) ? plotNameMap[booking.plot_id] : '';
    var wsel = $('bWorkType');
    booking.work_type = (wsel && wsel.value) || '';
    if (booking.maxStep < 2) booking.maxStep = 2;
    renderBookingStep2();
  }

  function localToday() {
    var d = new Date();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function renderBookingStep2() {
    BSTEP = 2;
    resetBookingContent();

    function timeOpts(sel) {
      var html = '';
      for (var h = 6; h <= 18; h++) {
        var label = (h > 12 ? (h - 12) + ':00 PM' : h + ':00 AM');
        var v = (h < 10 ? '0' + h : h) + ':00';
        html += '<option value="' + v + '"' + (sel === v ? ' selected' : '') + '>' + label + '</option>';
      }
      return html;
    }

    var iso = localToday();
    var dateVal = (booking.booking_date && booking.booking_date >= iso) ? booking.booking_date : iso;

    $('wrkBookingContent').innerHTML =
      workerSummaryLine() +
      '<div class="wrk-field"><label>Date</label><input type="date" class="wrk-input" id="bDate" min="' + iso + '" value="' + dateVal + '" onchange="WorkersApp.onBookingCalc()"></div>' +
      '<div class="wrk-row">' +
        '<div class="wrk-field"><label>Start Time</label><select class="wrk-input" id="bStart" onchange="WorkersApp.onBookingCalc()"><option value="">Select...</option>' + timeOpts(booking.start_time) + '</select></div>' +
        '<div class="wrk-field"><label>End Time</label><select class="wrk-input" id="bEnd" onchange="WorkersApp.onBookingCalc()"><option value="">Select...</option>' + timeOpts(booking.end_time) + '</select></div>' +
      '</div>' +
      '<div class="wrk-field"><label>Number of Days</label><select class="wrk-input" id="bDays" onchange="WorkersApp.onBookingCalc()">' +
        [1, 2, 3, 4, 5, 7, 10].map(function (d) { return '<option value="' + d + '"' + (d === (booking.duration_days || 1) ? ' selected' : '') + '>' + d + ' day' + (d > 1 ? 's' : '') + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="wrk-summary" id="bCostBox"><div class="line"><span>Estimated total</span><span>\u20b90</span></div></div>' +
      '<div class="wrk-wizard-actions"><button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.bookingBack()"><i class="fas fa-chevron-left"></i> Back</button><button class="wrk-btn wrk-btn-primary" onclick="WorkersApp.bookingNext2()">Next <i class="fas fa-chevron-right"></i></button></div>';

    if (booking.start_time && booking.end_time) onBookingCalc();
  }

  function onWorkTypeChange() {
    var wsel = $('bWorkType');
    if (wsel && wsel.value) booking.work_type = wsel.value;
  }

  function onBookingCalc() {
    var st = $('bStart').value;
    var en = $('bEnd').value;
    var days = parseInt($('bDays').value, 10) || 1;
    var dt = $('bDate').value;
    if (dt) booking.booking_date = dt;
    if (st) booking.start_time = st;
    if (en) booking.end_time = en;
    booking.duration_days = days;
    if (!st || !en) {
      $('bCostBox').innerHTML = '<div class="line"><span>Estimated total</span><span>\u20b90</span></div>';
      return;
    }
    var sh = parseFloat(st.split(':')[0]);
    var eh = parseFloat(en.split(':')[0]);
    var hrs = Math.max(0, eh - sh);
    var r = parseRate(currentWorker);
    var cost = costFor(currentWorker, sh, eh, days);
    var html =
      '<div class="line"><span>Worker</span><span>' + esc(currentWorker.full_name) + '</span></div>' +
      (r ? '<div class="line"><span>Rate</span><span>' + moneys(r.value) + '/' + (r.type === 'day' ? 'day' : 'hr') + '</span></div>' : '') +
      '<div class="line"><span>Duration</span><span>' + days + ' day' + (days > 1 ? 's' : '') + '</span></div>' +
      (hrs > 0 ? '<div class="line"><span>Hours/day</span><span>' + hrs.toFixed(0) + '</span></div>' : '') +
      '<div class="line total"><span>Estimated Total</span><span>' + moneys(cost) + '</span></div>';
    $('bCostBox').innerHTML = html;
  }

  function bookingNext2() {
    var dt = $('bDate').value;
    var st = $('bStart').value;
    var en = $('bEnd').value;
    if (!dt) { toast('Please select a date.', 'error'); return; }
    if (!st || !en) { toast('Please select start and end time.', 'error'); return; }
    var sh = parseFloat(st.split(':')[0]);
    var eh = parseFloat(en.split(':')[0]);
    if (eh <= sh) { toast('End time must be after start time.', 'error'); return; }
    booking.booking_date = dt;
    booking.start_time = st;
    booking.end_time = en;
    booking.duration_days = parseInt($('bDays').value, 10) || 1;
    booking.hours_per_day = eh - sh;
    if (booking.maxStep < 3) booking.maxStep = 3;
    renderBookingStep3();
  }

  function renderBookingStep3() {
    BSTEP = 3;
    resetBookingContent();
    $('wrkBookingContent').innerHTML =
      workerSummaryLine() +
      '<div class="wrk-field"><label>Work Description <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>' +
      '<textarea class="wrk-input" id="bNotes" rows="3" placeholder="Describe what work is needed...">' + esc(booking.notes) + '</textarea></div>' +
      '<div class="wrk-wizard-actions"><button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.bookingBack()"><i class="fas fa-chevron-left"></i> Back</button><button class="wrk-btn wrk-btn-primary" onclick="WorkersApp.bookingNext3()">Review &amp; Confirm <i class="fas fa-chevron-right"></i></button></div>';
    try { $('wrkBookingContent').querySelector('#bNotes').value = booking.notes || ''; } catch (e) {}
  }

  function bookingNext3() {
    var notesEl = $('bNotes');
    booking.notes = notesEl ? notesEl.value.trim() : booking.notes;
    if (booking.maxStep < 4) booking.maxStep = 4;
    renderBookingStep4();
  }

  function renderBookingStep4() {
    BSTEP = 4;
    resetBookingContent();

    var cost = costFor(currentWorker, parseFloat(booking.start_time.split(':')[0]), parseFloat(booking.end_time.split(':')[0]), booking.duration_days);
    var r = parseRate(currentWorker);
    var farmName = booking.farm_name || 'Selected farm';
    var plotName = booking.plot_name || 'Selected plot';

    var walletHtml =
      '<div class="wrk-field"><label>Wallet PIN <span style="color:var(--text-muted);font-weight:400;">(for payment)</span></label>' +
      '<input type="password" class="wrk-input" id="bPin" inputmode="numeric" maxlength="6" placeholder="Enter your 6-digit wallet PIN" autocomplete="off">' +
      '<div class="wrk-pin-hint">Enter the PIN you set in <a href="wallet.html" target="_blank" rel="noopener">Wallet &rarr; Security</a>. If you forgot it, reset it there first &mdash; this is always your own PIN, never a default one.</div></div>';

    $('wrkBookingContent').innerHTML =
      '<div class="wrk-summary">' +
        '<div class="line"><span>Worker</span><span>' + esc(currentWorker.full_name) + '</span></div>' +
        '<div class="line"><span>Farm</span><span>' + esc(farmName) + '</span></div>' +
        (booking.plot_id ? '<div class="line"><span>Plot</span><span>' + esc(plotName) + '</span></div>' : '') +
        '<div class="line"><span>Work</span><span>' + esc(booking.work_type) + '</span></div>' +
        '<div class="line"><span>Date</span><span>' + esc(booking.booking_date) + '</span></div>' +
        '<div class="line"><span>Time</span><span>' + esc(booking.start_time) + ' - ' + esc(booking.end_time) + '</span></div>' +
        '<div class="line"><span>Duration</span><span>' + booking.duration_days + ' day' + (booking.duration_days > 1 ? 's' : '') + '</span></div>' +
        (r ? '<div class="line"><span>Rate</span><span>' + moneys(r.value) + '/' + (r.type === 'day' ? 'day' : 'hr') + '</span></div>' : '') +
        '<div class="line total"><span>Estimated Total</span><span>' + moneys(cost) + '</span></div>' +
      '</div>' +
      (cost > 0 ? walletHtml : '') +
      '<div class="wrk-wizard-actions"><button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.bookingBack()"><i class="fas fa-chevron-left"></i> Back</button><button class="wrk-btn wrk-btn-primary" id="bConfirmBtn" onclick="WorkersApp.confirmBooking()"><i class="fas fa-check-circle"></i> Confirm Booking</button></div>';

    // Fetch wallet balance
    API.Wallet.get().then(function (w) {
      booking.walletBalance = (w && w.balance != null) ? w.balance : null;
      var pinField = $('bPin');
      if (pinField) {
        var balNote = document.createElement('div');
        balNote.className = 'wrk-balance';
        balNote.style.marginTop = '6px';
        balNote.innerHTML = 'Wallet balance: <b>' + moneys(w.balance) + '</b>' + (cost > (w.balance || 0) ? ' <span style="color:#B91C1C;">— insufficient balance</span>' : '');
        pinField.parentNode.appendChild(balNote);
      }
    }).catch(function () {});
  }

  function confirmBooking() {
    var cost = costFor(currentWorker, parseFloat(booking.start_time.split(':')[0]), parseFloat(booking.end_time.split(':')[0]), booking.duration_days);
    var pin = '';
    var pinEl = $('bPin');
    if (pinEl) pin = pinEl.value.trim();

    if (cost > 0 && !pin) { toast('Enter your wallet PIN to pay for this booking.', 'error'); return; }

    var btn = $('bConfirmBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating booking...'; }

    var payload = {
      worker_id: booking.worker_id,
      farm_id: booking.farm_id,
      plot_id: booking.plot_id || null,
      work_type: booking.work_type || 'General Farm Work',
      booking_date: booking.booking_date,
      start_time: booking.start_time,
      end_time: booking.end_time,
      duration_days: booking.duration_days,
      hours_per_day: booking.hours_per_day,
      notes: booking.notes,
      wallet_pin: pin || null
    };

    API.Worker.book(payload).then(function (res) {
      closeBooking();
      resetBookingDraft();
      var bId = res && res.booking_id;
      toast('Booking created! ' + (res && res.status === 'confirmed' ? 'Worker booked and payment processed.' : 'Your booking is pending.') + ' Ref: ' + bId, 'success');
      loadBookings();
      refreshBookingCount();
      switchTab('bookings');
      refreshNotifBadge();
      addTaskSuggestion(res);
    }).catch(function (err) {
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirm Booking'; }
      var msg = errMsg(err, 'Unable to complete the booking right now.');
      if (typeof msg !== 'string') msg = 'Unable to complete the booking right now.';
      toast(msg, 'error');
    });
  }

  function addTaskSuggestion(res) {
    // Optional: offer to add to crop tasks if the farmer has an active crop cycle.
    if (!res || !res.booking_id) return;
    if (!window.API || !API.Crop || !API.Crop.listCycles || !API.Crop.createTask) return;
    API.Crop.listCycles().then(function (cycles) {
      var rows = Array.isArray(cycles) ? cycles : (cycles && Array.isArray(cycles.items) ? cycles.items : []);
      var active = rows.filter(function (c) { return c && (c.status === 'active' || c.status === 'ongoing'); })[0] || rows[0];
      if (!active) return;
      var title = 'Worker: ' + (currentWorker ? currentWorker.full_name : '') + ' — ' + (booking.work_type || 'Farm Work');
      API.Crop.createTask({
        crop_cycle_id: active.id,
        title: title,
        category: booking.work_type || 'General',
        due_date: booking.booking_date,
        status: 'pending',
        priority: 'medium'
      }).then(function () {
        toast('Added to your farm tasks.', 'success');
      }).catch(function () {});
    }).catch(function () {});
  }

  function bookingBack() {
    if (BSTEP === 2) renderBookingStep1();
    else if (BSTEP === 3) renderBookingStep2();
    else if (BSTEP === 4) renderBookingStep3();
  }

  // ---------- Bookings ----------
  var BK_GROUPS = [
    { key: 'booked', label: 'Booked', icon: 'fa-calendar-check', match: function (b) { return ['pending', 'confirmed', 'in_progress'].indexOf(b.status) !== -1; } },
    { key: 'completed', label: 'Completed', icon: 'fa-check-circle', match: function (b) { return b.status === 'completed'; } },
    { key: 'cancelled', label: 'Cancelled', icon: 'fa-ban', match: function (b) { return b.status === 'cancelled'; } }
  ];

  function loadBookings() {
    if (bookings.loading) return;
    bookings.loading = true;
    var list = $('wrkBookingsList');
    list.innerHTML = '<div class="wrk-skel"></div><div class="wrk-skel"></div>';
    var p = { page: 1, limit: 100 };
    API.Worker.listBookings(p).then(function (res) {
      bookings.loading = false;
      if (!res || !Array.isArray(res.items)) {
        bookings.items = [];
        bookings.total = 0;
        bookings.totalPages = 1;
        bookings.filter = 'all';
        renderBookingsChips();
        $('wrkBookingsPagination').innerHTML = '';
        list.innerHTML = '<div class="wrk-empty"><i class="fas fa-clipboard-list"></i><h3>No bookings yet</h3><p>Book a worker to see it here.</p></div>';
        return;
      }
      bookings.items = res.items;
      bookings.total = res.total || 0;
      bookings.totalPages = 1;
      if (bookings.filter !== 'all' && !(bookings.items || []).some(function (b) { return BK_GROUPS.some(function (g) { return g.key === bookings.filter && g.match(b); }); })) {
        bookings.filter = 'all';
      }
      renderBookingsChips();
      renderBookingsArea();
      refreshBookingCount();
    }).catch(function (err) {
      bookings.loading = false;
      console.error('bookings load error', err);
      if (err && (err.status === 401 || err.status === 403)) { notFound(); return; }
      list.innerHTML = '<div class="wrk-empty"><i class="fas fa-exclamation-triangle"></i><h3>Unable to load bookings</h3><div style="margin-top:14px;"><button class="wrk-btn wrk-btn-primary" style="max-width:150px;margin:0 auto;" onclick="WorkersApp.loadBookings()">Try Again</button></div></div>';
    });
  }

  function renderBookingsChips() {
    var el = $('wrkBkChips');
    if (!el) return;
    var all = (bookings.items || []).length;
    if (!all) { el.style.display = 'none'; el.innerHTML = ''; return; }
    var html = '<button class="wrk-bk-chip' + (bookings.filter === 'all' ? ' active' : '') + '" onclick="WorkersApp.setBookingsFilter(\'all\')">All (' + all + ')</button>';
    BK_GROUPS.forEach(function (g) {
      var count = (bookings.items || []).filter(g.match).length;
      if (!count) return;
      html += '<button class="wrk-bk-chip' + (bookings.filter === g.key ? ' active' : '') + '" onclick="WorkersApp.setBookingsFilter(\'' + g.key + '\')"><i class="fas ' + g.icon + '"></i> ' + g.label + ' (' + count + ')</button>';
    });
    el.innerHTML = html;
    el.style.display = 'flex';
  }

  function setBookingsFilter(key) {
    if (key !== 'all' && !(bookings.items || []).some(function (b) { return BK_GROUPS.some(function (g) { return g.key === key && g.match(b); }); })) return;
    bookings.filter = key;
    renderBookingsChips();
    renderBookingsArea();
  }

  function renderBookingsArea() {
    var list = $('wrkBookingsList');
    var g = BK_GROUPS.filter(function (x) { return x.key === bookings.filter; })[0];
    var rows = (bookings.items || []).filter(function (b) { return bookings.filter === 'all' ? true : g.match(b); });
    if (!rows.length) {
      var emptyTitle = bookings.filter === 'all' ? 'No bookings yet' : 'No ' + g.label.toLowerCase() + ' bookings';
      var emptyBody = bookings.filter === 'all'
        ? '<p>Book a worker to see it here.</p><div style="margin-top:14px;"><button class="wrk-btn wrk-btn-primary" style="max-width:200px;margin:0 auto;" onclick="WorkersApp.switchTab(\'explore\')">Explore Workers</button></div>'
        : '<p>Bookings in this status will appear here.</p>';
      list.innerHTML = '<div class="wrk-empty"><i class="fas fa-clipboard-list"></i><h3>' + emptyTitle + '</h3>' + emptyBody + '</div>';
      $('wrkBookingsPagination').innerHTML = '';
      return;
    }
    list.innerHTML = rows.map(renderBookingCard).join('');
    renderBookingsPagination();
  }

  function renderBookingCard(b) {
    var status = b.status || 'pending';
    var pay = b.payment_status || 'unpaid';
    var payCls = pay === 'completed' ? 'paid' : (pay === 'refunded' ? 'refunded' : 'unpaid');
    var loc = [b.worker_name ? '' : '', b.farm_name ? ' on ' + b.farm_name : ''].join('');
    var timeStr = '';
    if (b.booking_date) timeStr += b.booking_date;
    if (b.start_time && b.end_time) timeStr += ' · ' + b.start_time + '–' + b.end_time;
    timeStr += (b.duration_days > 1 ? ' · ' + b.duration_days + ' days' : '');

    var actions = '<button class="wrk-btn wrk-btn-ghost" onclick="WorkersApp.viewBooking(\'' + esc(b.booking_id) + '\')"><i class="fas fa-eye"></i> View</button>';
    if (status === 'pending' || status === 'confirmed') {
      actions += '<button class="wrk-btn wrk-btn-danger" onclick="WorkersApp.cancelBooking(\'' + esc(b.booking_id) + '\')"><i class="fas fa-ban"></i> Cancel</button>';
    }
    if (status === 'completed') {
      actions += '<button class="wrk-btn wrk-btn-subtle" onclick="WorkersApp.openReview(\'' + esc(b.worker_id) + '\',\'' + esc(b.worker_name) + '\',\'' + esc(b.booking_id) + '\')"><i class="fas fa-star"></i> Review</button>';
    }

    return '' +
      '<div class="wrk-booking-card">' +
        '<div class="wrk-booking-icon"><i class="fas fa-user-tie"></i></div>' +
        '<div class="wrk-booking-info">' +
          '<div class="wrk-booking-title">' + esc(b.worker_name || 'Worker') + ' <span class="wrk-badge ' + status + '">' + esc(status.replace(/_/g, ' ')) + '</span></div>' +
          '<div class="wrk-booking-sub">' + esc(b.work_type || 'Farm work') + loc + '</div>' +
          '<div class="wrk-booking-sub"><i class="fas fa-calendar"></i> ' + esc(timeStr || 'Date TBD') + '</div>' +
          '<div class="wrk-booking-sub"><span class="wrk-badge ' + payCls + '">Pay: ' + esc(pay) + '</span>' + (b.total_cost != null ? ' <b style="color:var(--wrk);">' + moneys(b.total_cost) + '</b>' : '') + '</div>' +
          '<div class="wrk-booking-actions">' + actions + '</div>' +
        '</div>' +
      '</div>';
  }

  function renderBookingsPagination() {
    var el = $('wrkBookingsPagination');
    if (bookings.totalPages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML =
      '<button class="wrk-page-btn" onclick="WorkersApp.goBookingsPage(' + (bookings.page - 1) + ')" ' + (bookings.page <= 1 ? 'disabled' : '') + '><i class="fas fa-chevron-left"></i> Prev</button>' +
      '<span class="wrk-page-info">Page ' + bookings.page + ' of ' + bookings.totalPages + '</span>' +
      '<button class="wrk-page-btn" onclick="WorkersApp.goBookingsPage(' + (bookings.page + 1) + ')" ' + (bookings.page >= bookings.totalPages ? 'disabled' : '') + '>Next <i class="fas fa-chevron-right"></i></button>';
  }

  function refreshBookingCount() {
    var el = $('wrkBookedCount');
    if (!el) return;
    var active = (bookings.items || []).filter(function (b) { return ['pending', 'confirmed', 'in_progress'].indexOf(b.status) !== -1; }).length;
    if (active > 0) { el.style.display = 'flex'; el.textContent = active; }
    else el.style.display = 'none';
  }

  function refreshNotifBadge() {
    try {
      if (!(window.UserStore && UserStore.isLoggedIn())) return;
      var token = localStorage.getItem('fa-auth-token') || '';
      if (!token) return;
      fetch('/api/v1/notifications/unread', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.status === 'success' && d.data && typeof d.data.unread_count === 'number' && window.updateBadge) {
            window.updateBadge(d.data.unread_count);
          }
        }).catch(function () {});
    } catch (e) {}
  }

  function viewBooking(id) {
    var modal = $('wrkBDetailModal');
    $('wrkBDetailContent').innerHTML = '<div class="wrk-empty" style="padding:30px 0;"><i class="fas fa-spinner fa-spin" style="color:var(--wrk);"></i><h3>Loading booking...</h3></div>';
    modal.classList.add('open');
    API.Worker.getBooking(id).then(function (b) {
      renderBookingDetail(b);
    }).catch(function (err) {
      modal.classList.remove('open');
      toast(errMsg(err, 'Unable to load booking details.'), 'error');
    });
  }

  function renderBookingDetail(b) {
    var status = b.status || 'pending';
    var pay = b.payment_status || 'unpaid';
    var loc = b.booking_date || '';
    if (b.start_time && b.end_time) loc += ' · ' + b.start_time + '–' + b.end_time;
    loc += (b.duration_days > 1 ? ' · ' + b.duration_days + ' days' : '');

    var actions = '';
    if (status === 'pending' || status === 'confirmed') {
      actions += '<button class="wrk-btn wrk-btn-danger" style="flex:1;" onclick="WorkersApp.cancelBookingFromDetail(\'' + esc(b.booking_id) + '\')"><i class="fas fa-ban"></i> Cancel Booking</button>';
    }
    if (status === 'completed') {
      actions += '<button class="wrk-btn wrk-btn-primary" style="flex:1;" onclick="WorkersApp.openReview(\'' + esc(b.worker_id) + '\',\'' + esc(b.worker_name) + '\',\'' + esc(b.booking_id) + '\')"><i class="fas fa-star"></i> Review Worker</button>';
    }

    $('wrkBDetailContent').innerHTML =
      '<div class="wrk-detail-top">' +
        '<div class="wrk-avatar-lg" style="background:' + avatarColor(b.worker_id) + ';">' + esc(initials(b.worker_name)) + '</div>' +
        '<div style="flex:1;min-width:180px;">' +
          '<div class="wrk-detail-name">' + esc(b.worker_name || 'Worker') + (b.worker_verified ? ' <i class="fas fa-badge-check" style="color:#16A34A;font-size:14px;"></i>' : '') + '</div>' +
          (b.worker_rating != null && b.worker_rating > 0 ? '<div class="wrk-rating" style="margin-top:4px;">' + starsHTML(b.worker_rating) + ' ' + b.worker_rating + '</div>' : '') +
          '<div style="margin-top:6px;"><span class="wrk-badge ' + status + '">' + esc(status.replace(/_/g, ' ')) + '</span> <span class="wrk-badge ' + pay + '">Pay: ' + esc(pay) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="wrk-section"><h4><i class="fas fa-file-alt"></i> Booking Information</h4>' +
        '<div class="wrk-summary" style="margin:0;">' +
          '<div class="line"><span>Booking ID</span><span>' + esc(b.booking_id) + '</span></div>' +
          '<div class="line"><span>Farm</span><span>' + esc(b.farm_name || '—') + '</span></div>' +
          '<div class="line"><span>Plot</span><span>' + esc(b.plot_name || '—') + '</span></div>' +
          '<div class="line"><span>Work Type</span><span>' + esc(b.work_type || '—') + '</span></div>' +
          '<div class="line"><span>Date &amp; Time</span><span>' + esc(loc || '—') + '</span></div>' +
          '<div class="line"><span>Total Cost</span><span>' + moneys(b.total_cost) + '</span></div>' +
          (b.created_at ? '<div class="line"><span>Created</span><span>' + esc(String(b.created_at).slice(0, 16)) + '</span></div>' : '') +
        '</div>' +
      '</div>' +
      (b.notes ? '<div class="wrk-section"><h4><i class="fas fa-sticky-note"></i> Notes</h4><p style="font-size:12.5px;color:var(--text-secondary);line-height:1.6;">' + esc(b.notes) + '</p></div>' : '') +
      '<div style="display:flex;gap:10px;margin-top:4px;">' +
        '<button class="wrk-btn wrk-btn-ghost" style="flex:1;background:var(--wrk-bg);color:var(--wrk-dark);border:none;" onclick="WorkersApp.closeBDetail()">Close</button>' +
        actions +
      '</div>';
  }

  function cancelBooking(id) {
    var ok = window.confirm('Cancel this booking? ' + (bookingHadPayment(id) ? 'Your payment will be refunded to your wallet.' : ''));
    if (!ok) return;
    doCancel(id);
  }

  function cancelBookingFromDetail(id) {
    var ok = window.confirm('Cancel this booking? ' + (bookingHadPayment(id) ? 'Your payment will be refunded to your wallet.' : ''));
    if (!ok) return;
    closeBDetail();
    doCancel(id);
  }

  function bookingHadPayment(id) {
    var b = (bookings.items || []).filter(function (x) { return x.booking_id === id; })[0];
    return b && b.total_cost > 0;
  }

  function doCancel(id) {
    API.Worker.updateBooking(id, { status: 'cancelled' }).then(function () {
      toast('Booking cancelled successfully.', 'success');
      loadBookings();
      refreshBookingCount();
      refreshNotifBadge();
    }).catch(function (err) {
      toast(errMsg(err, 'Unable to cancel the booking.'), 'error');
    });
  }

  // ---------- Review ----------
  function openReview(workerId, workerName, bookingId) {
    reviewCtx = { workerId: workerId, workerName: workerName, bookingId: bookingId };
    $('wrkReviewWorker').innerHTML =
      '<div class="wrk-avatar" style="background:' + avatarColor(workerId) + ';">' + esc(initials(workerName)) + '</div>' +
      '<div><div style="font-weight:700;font-size:14px;">' + esc(workerName) + '</div><div style="font-size:11px;color:var(--text-muted);">Share your experience</div></div>';
    var stars = document.querySelectorAll('#wrkReviewStars i');
    stars.forEach(function (s) { s.className = 'far fa-star'; });
    $('wrkReviewComment').value = '';
    $('wrkReviewModal').classList.add('open');
  }

  function onReviewStarClick(v) {
    document.querySelectorAll('#wrkReviewStars i').forEach(function (s) {
      var n = parseInt(s.getAttribute('data-v'), 10);
      s.className = (n <= v) ? 'fas fa-star lit' : 'far fa-star';
    });
  }

  function submitReview() {
    if (!reviewCtx) return;
    var rating = 0;
    document.querySelectorAll('#wrkReviewStars i').forEach(function (s) {
      if (s.className.indexOf('lit') !== -1) rating = Math.max(rating, parseInt(s.getAttribute('data-v'), 10));
    });
    if (!rating) { toast('Please select a rating.', 'error'); return; }
    var comment = ($('wrkReviewComment').value || '').trim();
    var btn = $('wrkReviewSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
    API.Worker.addReview(reviewCtx.workerId, {
      rating: rating,
      comment: comment || null,
      booking_id: reviewCtx.bookingId || null
    }).then(function () {
      closeReview();
      toast('Thank you! Your review has been submitted.', 'success');
      loadBookings();
    }).catch(function (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Review';
      toast(errMsg(err, 'Unable to submit the review.'), 'error');
    });
  }

  // ---------- Navigation / toggles ----------
  function switchTab(tab) {
    editMode = tab;
    document.querySelectorAll('.wrk-tab').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    $('wrkExplorePane').style.display = tab === 'explore' ? 'block' : 'none';
    $('wrkBookingsPane').style.display = tab === 'bookings' ? 'block' : 'none';
    if (tab === 'bookings') loadBookings();
  }

  function toggleBookings() {
    switchTab(editMode === 'bookings' ? 'explore' : 'bookings');
  }

  function closeDetail() { $('wrkDetailModal').classList.remove('open'); }
  function closeBooking() { $('wrkBookingModal').classList.remove('open'); BSTEP = 1; }
  function closeBDetail() { $('wrkBDetailModal').classList.remove('open'); }
  function closeReview() { $('wrkReviewModal').classList.remove('open'); reviewCtx = null; }

  function toggleFilters() {
    var sheet = $('wrkFilterSheet');
    var open = !sheet.classList.contains('open');
    sheet.classList.toggle('open', open);
    $('wrkFilterToggle').classList.toggle('active', open);
    if (open) updateFilterCount();
  }

  function applyFilters() {
    activeFilters = gatherActiveFilters();
    catalog.page = 1;
    toggleFilters();
    loadWorkers(1);
  }

  function clearFilters() {
    $('fltWorkType').value = '';
    $('fltSkill').value = '';
    $('fltLocation').value = '';
    $('fltExp').value = '';
    $('fltRating').value = '';
    $('fltAvail').checked = false;
    activeFilters = {};
    updateFilterCount();
    catalog.page = 1;
    loadWorkers(1);
  }

  function onSortChange() {
    catalog.page = 1;
    loadWorkers(1);
  }

  function goPage(p) {
    if (p < 1 || p > catalog.totalPages) return;
    loadWorkers(p);
  }

  function goBookingsPage(p) {
    if (p < 1 || p > bookings.totalPages) return;
    loadBookings(p);
  }

  function clearSearch() {
    $('wrkSearch').value = '';
    $('wrkSearchClear').style.display = 'none';
    catalog.page = 1;
    loadWorkers(1);
  }

  // ---------- Init ----------
  function init() {
    if (!isAuthed()) { notFound(); return; }
    loadFilters();
    loadWorkers(1);

    var searchInput = $('wrkSearch');
    searchInput.addEventListener('input', function () {
      var v = searchInput.value.trim();
      $('wrkSearchClear').style.display = v ? 'inline-flex' : 'none';
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        catalog.page = 1;
        loadWorkers(1);
      }, 450);
    });
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { clearTimeout(searchTimer); catalog.page = 1; loadWorkers(1); }
    });

    // review star interactions
    document.querySelectorAll('#wrkReviewStars i').forEach(function (s) {
      s.addEventListener('mouseenter', function () { onReviewStarClick(parseInt(s.getAttribute('data-v'), 10)); });
      s.addEventListener('click', function () {
        var v = parseInt(s.getAttribute('data-v'), 10);
        document.querySelectorAll('#wrkReviewStars i').forEach(function (x) {
          x.className = (parseInt(x.getAttribute('data-v'), 10) <= v) ? 'fas fa-star lit' : 'far fa-star';
        });
      });
    });

    // close modal on backdrop click
    document.querySelectorAll('.wrk-modal').forEach(function (m) {
      m.addEventListener('mousedown', function (e) {
        if (e.target === m) { m.classList.remove('open'); if (m.id === 'wrkBookingModal') BSTEP = 1; if (m.id === 'wrkReviewModal') reviewCtx = null; }
      });
    });

    // preload bookings count badge
    loadBookings();
  }

  document.addEventListener('DOMContentLoaded', init);

  // expose app
  window.WorkersApp = {
    toggleFilters: toggleFilters,
    applyFilters: applyFilters,
    clearFilters: clearFilters,
    clearSearch: clearSearch,
    onSortChange: onSortChange,
    switchTab: switchTab,
    toggleBookings: toggleBookings,
    loadWorkers: loadWorkers,
    loadBookings: loadBookings,
    setBookingsFilter: setBookingsFilter,
    goPage: goPage,
    goBookingsPage: goBookingsPage,
    viewWorker: viewWorker,
    startBooking: startBooking,
    viewBooking: viewBooking,
    cancelBooking: cancelBooking,
    cancelBookingFromDetail: cancelBookingFromDetail,
    openReview: openReview,
    submitReview: submitReview,
    onFarmChange: onFarmChange,
    onWorkTypeChange: onWorkTypeChange,
    bookingNext1: bookingNext1,
    bookingNext2: bookingNext2,
    bookingNext3: bookingNext3,
    bookingBack: bookingBack,
    confirmBooking: confirmBooking,
    onBookingCalc: onBookingCalc,
    closeDetail: closeDetail,
    closeBooking: closeBooking,
    closeBDetail: closeBDetail,
    closeReview: closeReview
  };
})();
</script>
</body>
</html>
