<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="workers">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="api-base-url" content="/api/v1">
  <script>
    window._API_BASE_URL = '/api/v1';
  </script>
  <title>Farm Assist - Workers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root {
      --wrk: var(--primary-green);
      --wrk-dark: var(--forest-800);
      --wrk-soft: var(--soft-green);
      --wrk-bg: rgba(45,134,89,0.08);
    }
    body { background: var(--bg-app); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .page-container { max-width: 1120px; }

    /* ---------- Header ---------- */
    .wrk-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .wrk-header h1 { font-size: 22px; color: var(--wrk); display: flex; align-items: center; gap: 10px; }
    .wrk-header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .wrk-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .wrk-action { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--border-light); background: #fff; color: var(--text-primary); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; box-shadow: var(--shadow-sm); }
    .wrk-action:hover { border-color: var(--wrk); color: var(--wrk); }
    .wrk-action .fa-filter-count { font-size: 10px; background: var(--wrk); color: white; border-radius: 20px; padding: 0 5px; height: 15px; line-height: 15px; min-width: 15px; text-align: center; }
    .wrk-action.active { background: var(--wrk); color: #fff; border-color: var(--wrk); }
    .wrk-count-badge { position: absolute; top: -7px; right: -7px; background: #D63031; color: #fff; font-size: 10px; font-weight: 800; border-radius: 20px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid var(--bg-app); }

    /* ---------- Search ---------- */
    .wrk-search { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 12px; padding: 0 14px; margin-bottom: 12px; transition: border-color .2s; }
    .wrk-search:focus-within { border-color: var(--wrk); box-shadow: 0 0 0 3px rgba(15,118,110,0.08); }
    .wrk-search i { color: var(--text-muted); font-size: 13px; }
    .wrk-search input { flex: 1; border: none; outline: none; padding: 11px 0; font-size: 13px; background: transparent; color: var(--text-primary); }
    .wrk-search .wrk-search-clear { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 13px; padding: 4px; }

    /* ---------- Explore / Bookings switcher (header) ---------- */
    .wrk-seg { display: inline-flex; align-items: center; gap: 4px; padding: 4px; background: rgba(15,118,110,0.07); border-radius: 12px; }
    .wrk-tab { position: relative; padding: 8px 14px; font-size: 12px; font-weight: 700; border-radius: 9px; cursor: pointer; transition: all .2s; background: transparent; color: var(--text-secondary); border: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .wrk-tab:hover:not(.active) { color: var(--wrk); }
    .wrk-tab.active { background: var(--wrk); color: #fff; box-shadow: 0 2px 8px rgba(15,118,110,.25); }
    .wrk-tab .wrk-count-badge { position: static; min-width: 17px; height: 17px; font-size: 10px; border: none; }

    /* ---------- Filters panel ---------- */
    .wrk-filter-sheet { display: none; background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .wrk-filter-sheet.open { display: block; animation: wrkFade .2s ease; }
    @keyframes wrkFade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .wrk-filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .wrk-filter-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; display: block; }
    .wrk-select { width: 100%; padding: 9px 10px; border: 1px solid var(--border-medium); border-radius: 9px; background: #fff; color: var(--text-primary); font-size: 12px; outline: none; }
    .wrk-select:focus { border-color: var(--wrk); }
    .wrk-toggle { display: flex; align-items: center; gap: 9px; padding: 9px 0; cursor: pointer; font-size: 12.5px; color: var(--text-primary); font-weight: 500; }
    .wrk-toggle input { width: 16px; height: 16px; accent-color: var(--wrk); }
    .wrk-filter-actions { display: flex; gap: 10px; margin-top: 14px; }
    .wrk-filter-actions .wrk-btn { flex: 1; }
    @media (max-width: 680px) {
      .wrk-filter-grid { grid-template-columns: 1fr; }
      .wrk-filter-sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; border-radius: 16px 16px 0 0; max-height: 78vh; overflow-y: auto; z-index: 1500; box-shadow: 0 -6px 24px rgba(15,46,30,.18); }
    }

    /* ---------- Sort / result bar ---------- */
    .wrk-sort { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .wrk-result-count { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .wrk-sort select { padding: 7px 10px; border: 1px solid var(--border-light); border-radius: 9px; background: #fff; font-size: 12px; color: var(--text-primary); }

    /* ---------- Worker grid ---------- */
    .wrk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    @media (max-width: 1000px) { .wrk-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 820px) { .wrk-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .wrk-grid { grid-template-columns: 1fr; } }

    .wrk-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s, border-color .2s; box-shadow: var(--shadow-sm); }
    .wrk-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--medium-green); }
    .wrk-card-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 4px; position: relative; }
    .wrk-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 17px; flex-shrink: 0; position: relative; }
    .wrk-avatar .wrk-verified { position: absolute; bottom: -2px; right: -3px; width: 18px; height: 18px; border-radius: 50%; background: #16A34A; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
    .wrk-card-name { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
    .wrk-card-skill { font-size: 11.5px; color: var(--wrk-dark); font-weight: 600; margin-top: 2px; }
    .wrk-card-meta { display: flex; align-items: center; gap: 10px; padding: 8px 14px 0; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
    .wrk-card-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .wrk-rating { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-primary); font-weight: 700; }
    .wrk-rating i { color: #F5A623; font-size: 11px; }
    .wrk-card-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--border-light); margin-top: 12px; }
    .wrk-avail { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 3px 9px; border-radius: 20px; }
    .wrk-avail.on { background: #DCFCE7; color: #166534; }
    .wrk-avail.off { background: #FEE2E2; color: #B91C1C; }
    .wrk-rate { font-size: 14px; font-weight: 800; color: var(--wrk); }
    .wrk-rate small { font-size: 10px; font-weight: 500; color: var(--text-muted); }
    .wrk-bio { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; padding: 8px 14px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
    .wrk-card-actions { display: flex; gap: 8px; padding: 0 14px 14px; }
    .wrk-btn { flex: 1; padding: 9px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all .2s; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .wrk-btn:disabled { opacity: .5; cursor: default; }
    .wrk-btn-primary { background: var(--wrk); color: #fff; }
    .wrk-btn-primary:hover { background: var(--wrk-dark); }
    .wrk-btn-ghost { background: transparent; color: var(--wrk); border: 1px solid var(--wrk-soft); }
    .wrk-btn-ghost:hover { background: var(--wrk-soft); }
    .wrk-btn-subtle { background: var(--wrk-bg); color: var(--wrk-dark); }
    .wrk-btn-danger { background: #FEE2E2; color: #B91C1C; }

    /* ---------- Skeleton ---------- */
    .wrk-skel { background: linear-gradient(90deg, #eef2ef 25%, #f7faf7 50%, #eef2ef 75%); background-size: 200% 100%; animation: skel 1.4s infinite; border-radius: var(--radius-md); height: 240px; }
    @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ---------- Empty / error ---------- */
    .wrk-empty { text-align: center; padding: 56px 18px; color: var(--text-muted); grid-column: 1 / -1; }
    .wrk-empty i { font-size: 40px; margin-bottom: 12px; color: var(--border-medium); display: block; }
    .wrk-empty h3 { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
    .wrk-empty p { font-size: 12.5px; }

    /* ---------- Pagination ---------- */
    .wrk-pagination { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 18px 0 8px; }
    .wrk-page-btn { padding: 8px 16px; border: 1px solid var(--border-light); border-radius: 10px; background: #fff; font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .2s; }
    .wrk-page-btn:hover:not(:disabled) { border-color: var(--wrk); color: var(--wrk); }
    .wrk-page-btn:disabled { opacity: .45; cursor: default; }
    .wrk-page-info { font-size: 11px; color: var(--text-muted); }

    /* ---------- Bookings list ---------- */
    .wrk-bookings { display: flex; flex-direction: column; gap: 12px; }
    .wrk-booking-card { background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 16px; display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; box-shadow: var(--shadow-sm); }
    .wrk-booking-icon { width: 46px; height: 46px; border-radius: 12px; background: var(--wrk-bg); color: var(--wrk); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .wrk-booking-info { flex: 1; min-width: 220px; }
    .wrk-booking-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .wrk-booking-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; line-height: 1.55; }
    .wrk-booking-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .wrk-booking-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .wrk-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    .wrk-badge.pending { background: #FEF3C7; color: #92400E; }
    .wrk-badge.confirmed { background: #DCFCE7; color: #166534; }
    .wrk-badge.in_progress { background: #DBEAFE; color: #1E40AF; }
    .wrk-badge.completed { background: #E2E8F0; color: #334155; }
    .wrk-badge.cancelled, .wrk-badge.rejected { background: #F3F4F6; color: #6B7280; }
    .wrk-badge.paid { background: #DCFCE7; color: #166534; }
    .wrk-badge.unpaid, .wrk-badge.refunded { background: #FEF3C7; color: #92400E; }

    /* ---------- Booking status chips ---------- */
    .wrk-bk-chipbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 14px; }
    .wrk-bk-chip { padding: 7px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--border-light); font-size: 12px; font-weight: 600; color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
    .wrk-bk-chip:hover { border-color: var(--wrk); color: var(--wrk); }
    .wrk-bk-chip.active { background: var(--wrk); border-color: var(--wrk); color: #fff; }

    .wrk-pin-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.55; }
    .wrk-pin-hint a { color: var(--wrk); text-decoration: none; font-weight: 600; }

    /* ---------- Modal ---------- */
    .wrk-modal { position: fixed; inset: 0; background: rgba(15,46,30,.55); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .wrk-modal.open { display: flex; }
    .wrk-modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; position: relative; animation: wrkFade .2s ease; }
    .wrk-modal-box.wide { max-width: 640px; }
    .wrk-modal-close { position: absolute; top: 12px; right: 12px; background: var(--bg-card-soft, #f3f5f4); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; cursor: pointer; color: var(--text-secondary); z-index: 5; }
    .wrk-modal-head { padding: 18px 20px 6px; border-bottom: 1px solid var(--border-light); }
    .wrk-modal-head h3 { font-size: 16px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .wrk-modal-body { padding: 16px 20px 22px; }

    /* ---------- Worker detail ---------- */
    .wrk-detail-top { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .wrk-avatar-lg { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 26px; flex-shrink: 0; position: relative; }
    .wrk-avatar-lg .wrk-verified { position: absolute; bottom: 0; right: 0; width: 22px; height: 22px; border-radius: 50%; background: #16A34A; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
    .wrk-detail-name { font-size: 19px; font-weight: 800; color: var(--text-primary); }
    .wrk-chip { display: inline-block; padding: 4px 11px; border-radius: 8px; background: var(--wrk-bg); color: var(--wrk-dark); font-size: 11px; font-weight: 600; }
    .wrk-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0; font-size: 12px; color: var(--text-muted); }
    .wrk-meta-row span { display: inline-flex; align-items: center; gap: 5px; }
    .wrk-section { margin-bottom: 16px; }
    .wrk-section h4 { font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .wrk-section h4 i { color: var(--wrk); }
    .wrk-skills { display: flex; gap: 6px; flex-wrap: wrap; }
    .wrk-rate-box { display: flex; gap: 10px; flex-wrap: wrap; }
    .wrk-rate-box .wrk-rate-pill { flex: 1; min-width: 120px; background: var(--bg-card-soft, #f3f5f4); border-radius: 10px; padding: 10px 12px; text-align: center; }
    .wrk-rate-pill b { display: block; font-size: 15px; color: var(--wrk); }
    .wrk-rate-pill span { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
    .wrk-history { display: flex; flex-direction: column; }
    .wrk-history-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: 12px; }
    .wrk-history-item:last-child { border-bottom: none; }
    .wrk-history-item .h-w { color: var(--text-primary); font-weight: 600; }
    .wrk-history-item .h-m { color: var(--text-muted); }
    .wrk-review-item { padding: 10px 0; border-bottom: 1px solid var(--border-light); }
    .wrk-review-item:last-child { border-bottom: none; }
    .wrk-review-item .r-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .wrk-review-item .r-name { font-weight: 700; color: var(--text-primary); }
    .wrk-review-item .r-stars { color: #F5A623; font-size: 11px; }
    .wrk-review-item .r-text { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
    .wrk-avail-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .wrk-avail-table th, .wrk-avail-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-light); text-align: left; }
    .wrk-avail-table th { color: var(--text-muted); font-weight: 700; }

    /* ---------- Booking wizard ---------- */
    .wrk-steps { display: flex; gap: 4px; margin-bottom: 16px; }
    .wrk-step { flex: 1; text-align: center; }
    .wrk-step .wrk-step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--border-light); color: var(--text-muted); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; transition: all .2s; }
    .wrk-step .wrk-step-label { font-size: 9.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; }
    .wrk-step.done .wrk-step-num { background: var(--wrk); color: #fff; }
    .wrk-step.active .wrk-step-num { background: var(--wrk); color: #fff; box-shadow: 0 0 0 3px var(--wrk-soft); }
    .wrk-step.active .wrk-step-label { color: var(--wrk-dark); }
    .wrk-field { margin-bottom: 13px; }
    .wrk-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 5px; }
    .wrk-input, .wrk-input select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-medium); border-radius: 9px; background: #fff; color: var(--text-primary); font-size: 13px; outline: none; transition: border-color .2s; font-family: inherit; }
    .wrk-input:focus { border-color: var(--wrk); box-shadow: 0 0 0 3px rgba(15,118,110,0.08); }
    .wrk-row { display: flex; gap: 10px; }
    .wrk-row .wrk-field { flex: 1; }
    .wrk-summary { background: var(--wrk-bg); border: 1px solid rgba(15,118,110,0.15); border-radius: 12px; padding: 14px; margin: 10px 0 16px; }
    .wrk-summary .line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12.5px; border-bottom: 1px solid rgba(15,118,110,0.1); }
    .wrk-summary .line:last-child { border-bottom: none; }
    .wrk-summary .total { font-size: 17px; font-weight: 800; color: var(--wrk); padding-top: 8px; border-top: 2px solid var(--wrk); margin-top: 4px; }
    .wrk-wizard-actions { display: flex; gap: 10px; margin-top: 16px; }
    .wrk-wizard-actions .wrk-btn { flex: 1; }
    .wrk-balance { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .wrk-balance b { color: var(--wrk); }

    /* ---------- Toast ---------- */
    .wrk-toasts { position: fixed; top: 74px; right: 16px; z-index: 2500; display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
    .wrk-toast { background: #fff; border-left: 4px solid var(--wrk); padding: 12px 15px; border-radius: 12px; box-shadow: var(--shadow-lg); color: var(--text-primary); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateX(40px); transition: all .3s; }
    .wrk-toast.show { opacity: 1; transform: none; }
    .wrk-toast.success { border-left-color: #166534; }
    .wrk-toast.error { border-left-color: #D63031; }
    .wrk-toast.warning { border-left-color: #D97706; }
    .wrk-toast i { font-size: 15px; }

    .wrk-btn-full { width: 100%; }
  </style>
</head>
<body>
<main class="page-container">

  <!-- Header -->
  <div class="wrk-header">
    <div>
      <h1><i class="fas fa-users"></i> Workers</h1>
      <p>Find trusted agricultural workers for your farm.</p>
    </div>
    <div class="wrk-header-actions">
      <div class="wrk-seg" id="wrkTypeSeg">
        <button class="wrk-tab active" data-tab="explore" onclick="WorkersApp.switchTab('explore')">Explore Workers</button>
        <button class="wrk-tab" data-tab="bookings" onclick="WorkersApp.switchTab('bookings')">My Bookings <span class="wrk-count-badge" id="wrkBookedCount" style="display:none;">0</span></button>
      </div>
      <button class="wrk-action" id="wrkFilterToggle" onclick="WorkersApp.toggleFilters()">
        <i class="fas fa-sliders-h"></i> Filters <span class="fa-filter-count" id="wrkFilterCount" style="display:none;"></span>
      </button>
    </div>
  </div>

  <!-- Search -->
  <div class="wrk-search">
    <i class="fas fa-search"></i>
    <input type="text" id="wrkSearch" placeholder="Search workers, skills or services..." autocomplete="off">
    <button class="wrk-search-clear" id="wrkSearchClear" style="display:none;" onclick="WorkersApp.clearSearch()"><i class="fas fa-times"></i></button>
  </div>

  <!-- Filters -->
  <div class="wrk-filter-sheet" id="wrkFilterSheet">
    <div class="wrk-filter-grid">
      <div>
        <label class="wrk-filter-label">Work Type</label>
