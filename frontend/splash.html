<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Assist - Welcome</title>
  <meta name="description" content="Welcome to Farm Assist - Empowering Farmers with Smart Agriculture">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B3D2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farm Assist">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180x180.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh; overflow-x: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff; background: #0B3D2E;
    }

    .splash-screen {
      position: fixed; inset: 0; min-height: 100vh; width: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .splash-screen::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(11,30,20,0.10) 0%,
        rgba(11,30,20,0.25) 45%,
        rgba(11,30,20,0.62) 78%,
        rgba(8,22,15,0.88) 100%);
    }
    .splash-screen::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(120% 80% at 50% 100%, rgba(11,61,46,0.35) 0%, transparent 60%);
      pointer-events: none;
    }

    .splash-shell {
      position: relative; z-index: 2; width: 100%; max-width: 720px;
      padding: 24px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    }

    .splash-card {
      background: #fff; border-radius: 26px 26px 20px 20px;
      padding: 26px 24px 22px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      animation: splashRise .7s cubic-bezier(.2,.9,.3,1);
    }

    .splash-logo {
      width: 60px; height: 60px; margin: 0 auto 12px; border-radius: 18px;
      background: linear-gradient(135deg, #0B3D2E, #2d8659);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(11,61,46,0.3);
      animation: splashPop .7s cubic-bezier(.2,.9,.3,1) .1s backwards;
    }
    .splash-logo i { font-size: 28px; color: #a5d6a7; }

    .splash-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.4px; color: #0B3D2E;
      animation: splashFade .6s ease .2s backwards;
    }
    .splash-tagline {
      margin: 6px auto 0; max-width: 340px; font-size: 14px; font-weight: 600;
      color: #2d8659; line-height: 1.5;
      animation: splashFade .6s ease .3s backwards;
    }

    .splash-features {
      display: flex; justify-content: center; gap: 10px; margin: 18px 0 6px; flex-wrap: wrap;
      animation: splashFade .6s ease .4s backwards;
    }
    .splash-feature {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f0f7ee; color: #1a3c2a; font-size: 11px; font-weight: 600;
      padding: 6px 11px; border-radius: 20px; white-space: nowrap;
    }
    .splash-feature i { color: #2d8659; font-size: 11px; }

    .btn-continue {
      width: 100%; min-height: 54px; margin-top: 18px;
      border: none; border-radius: 16px;
      background: linear-gradient(135deg, #0B3D2E, #2d8659);
      color: #fff; font-family: inherit; font-size: 16px; font-weight: 800;
      letter-spacing: 0.2px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 28px rgba(11,61,46,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
      animation: splashFade .6s ease .5s backwards;
    }
    .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(11,61,46,0.38); }
    .btn-continue:active { transform: translateY(0); }
    .btn-continue:focus-visible { outline: 3px solid #a5d6a7; outline-offset: 3px; }

    .splash-footer {
      margin-top: 16px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.75);
      font-weight: 600; letter-spacing: 0.3px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      animation: splashFade .6s ease .6s backwards;
    }

    @keyframes splashRise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes splashFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes splashPop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 380px) {
      .splash-title { font-size: 26px; }
      .splash-card { padding: 22px 18px 18px; border-radius: 22px 22px 18px 18px; }
      .splash-feature { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="splash-screen" id="splash-screen" aria-label="Farm Assist welcome">
    <div class="splash-shell">
      <div class="splash-card">
        <div class="splash-logo" aria-hidden="true"><i class="fas fa-seedling"></i></div>
        <h1 class="splash-title">Farm Assist</h1>
        <p class="splash-tagline">Your Farmer Companion</p>
        <div class="splash-features" aria-hidden="true">
          <span class="splash-feature"><i class="fas fa-tractor"></i> Farm Management</span>
          <span class="splash-feature"><i class="fas fa-book-open"></i> Farm Techniques</span>
          <span class="splash-feature"><i class="fas fa-user-doctor"></i> Access to Specialists</span>
          <span class="splash-feature"><i class="fas fa-store"></i> Markets</span>
        </div>
        <button type="button" class="btn-continue" id="btn-continue">
          Continue <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <p class="splash-footer">Farm Assist &mdash; Your Farmer Companion</p>
    </div>
  </main>

  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script>
    (function () {
      'use strict';

      var KEY = 'fa-splash-done';
      var IMAGES = [
        'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1400&q=70',
        'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=1400&q=70',
        'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=1400&q=70',
        'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1400&q=70'
      ];

      function isAlreadyDone() {
        return localStorage.getItem(KEY) === 'true';
      }

      function finish() {
        try { localStorage.setItem(KEY, 'true'); } catch (e) {}
        // Check if user is already authenticated
        try {
          if (window.UserStore && window.UserStore.isLoggedIn()) {
            window.location.replace('index.html');
          } else {
            window.location.href = 'login.html';
          }
        } catch (e) {
          window.location.href = 'login.html';
        }
      }

      if (/[?&]reset=1/.test(window.location.search)) {
        try { localStorage.removeItem(KEY); } catch (e) {}
      }

      // Auto-redirect if already authenticated (bypass splash)
      try {
        if (window.UserStore && window.UserStore.isLoggedIn()) {
          window.location.replace('index.html');
        }
      } catch (e) {}

      var continueBtn = document.getElementById('btn-continue');
      if (continueBtn) continueBtn.addEventListener('click', finish);

      var screen = document.getElementById('splash-screen');
      function setBg(url) {
        if (!screen) return;
        var img = new Image();
        img.onload = function () { screen.style.backgroundImage = 'url("' + url + '")'; };
        img.src = url;
      }
      var chosen = IMAGES[Math.floor(Math.random() * IMAGES.length)];
      setBg(chosen);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && continueBtn && document.activeElement === continueBtn) finish();
      });
    })();
  </script>
</body>
</html>
