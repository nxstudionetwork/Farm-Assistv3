<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - Equipment Rental</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="page-container">
    <div class="page-header">
      <div><h1>Equipment Rental</h1><p>Tractors, harvesters, drones & more for rent near you</p></div>
      <button class="btn-primary btn-sm" onclick="showToast('List your equipment for rent! Opening registration form...','success')"><i class="fas fa-plus"></i> List Equipment</button>
    </div>
    <div id="equip-content"></div>
    <div class="card-premium" style="margin-top:16px;">
      <h3 style="font-size:15px;margin-bottom:12px;"><i class="fas fa-clock-rotate-left"></i> Rental History</h3>
      <div class="timeline-item"><strong>Mahindra 575 DI</strong> - 2 days <span style="float:right;">₹6,400</span><div style="font-size:10px;color:var(--text-muted);">Completed • 5★</div></div>
      <div class="timeline-item"><strong>Laser Land Leveler</strong> - 1 day <span style="float:right;">₹1,800</span><div style="font-size:10px;color:var(--text-muted);">Completed • 4★</div></div>
      <div class="timeline-item"><strong>NDVI Drone Survey</strong> - 1 session <span style="float:right;">₹6,000</span><div style="font-size:10px;color:var(--text-muted);">Completed • 5★</div></div>
    </div>
  </main>

  <script src="js/database.js"></script>
  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
