<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Farm Assist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { padding: 0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--sidebar-gradient); font-family: 'Inter', sans-serif; }
    .nf-card { background: #fff; border-radius: 28px; padding: 48px 36px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
    .nf-icon { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 22px; background: var(--soft-green); color: var(--primary-green); display: flex; align-items: center; justify-content: center; font-size: 44px; }
    .nf-code { font-family: 'Outfit', sans-serif; font-size: 64px; font-weight: 800; color: var(--primary-dark); line-height: 1; margin-bottom: 6px; }
    .nf-card h2 { font-size: 20px; color: var(--text-primary); margin-bottom: 8px; }
    .nf-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 26px; }
    .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="nf-card">
    <div class="nf-icon"><i class="fas fa-seedling"></i></div>
    <div class="nf-code">404</div>
    <h2>Field Not Found</h2>
    <p>The page you are looking for has been harvested or never planted. Let's get you back to fertile ground.</p>
    <div class="nf-actions">
      <a href="index.html" class="btn-primary"><i class="fas fa-house"></i> Dashboard</a>
      <a href="more.html" class="btn-secondary"><i class="fas fa-grip"></i> All Features</a>
    </div>
  </div>
</body>
</html>
