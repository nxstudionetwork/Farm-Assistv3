<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="my-listings" data-hide-nav="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Listings - Farm Assist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root{--mp-accent:#C9760A;--mp-green:#2D8659;--mp-amber:#B8860B;--mp-radius:12px;--mp-radius-sm:8px}
    html,body{overflow-x:hidden;max-width:100vw}
    *{box-sizing:border-box}
    body{background:var(--bg, #f4f6f5);margin:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
    .ml-top{position:sticky;top:0;z-index:900;background:var(--bg-card,#fff);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px;padding:12px 16px}
    .ml-top .back{background:var(--bg-card-soft);border:1px solid var(--border-light);width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary);cursor:pointer;font-size:15px;text-decoration:none;flex-shrink:0}
    .ml-top .back:hover{color:var(--mp-green);border-color:var(--mp-green)}
    .ml-top h1{margin:0;font-size:18px;font-weight:800;color:var(--text-primary);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ml-top h1 i{color:var(--mp-accent);margin-right:8px}
    .ml-top .cnt{font-size:12px;font-weight:700;color:var(--text-secondary);background:var(--bg-card-soft);border:1px solid var(--border-light);padding:5px 11px;border-radius:15px;flex-shrink:0}
    .ml-page{max-width:980px;margin:0 auto;padding:16px 16px 90px}
    .ml-cta{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
    .ml-cta p{margin:0;font-size:12.5px;color:var(--text-muted);flex:1;min-width:200px}
    .mp-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--mp-radius-sm);border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;text-decoration:none;flex-shrink:0}
    .mp-btn.primary{background:var(--mp-green);color:#fff}
    .mp-btn.primary:hover{filter:brightness(1.1)}
    .mp-btn.ghost{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-light)}
    .mp-btn.ghost:hover{border-color:var(--mp-green);color:var(--mp-green)}
    .mp-btn.danger{background:#fff5f5;color:#c0392b;border:1px solid #f5c6c6}
    .mp-btn:disabled{opacity:.5;cursor:not-allowed}
    .mp-status-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
    .mp-status-pills::-webkit-scrollbar{display:none}
    .mp-pill{padding:7px 13px;border-radius:18px;border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-secondary);font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
    .mp-pill:hover{border-color:var(--mp-green);color:var(--mp-green)}
    .mp-pill.active{background:var(--mp-green);color:#fff;border-color:var(--mp-green)}
    .mp-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .mp-type-pills{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 0 12px;margin:0 0 0 0;flex-wrap:nowrap}
    .mp-type-pills::-webkit-scrollbar{display:none}
    .mp-type-label{font-size:10.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:5px;flex-shrink:0;padding-right:2px}
    .mp-type-pills .mp-pill{display:inline-flex;align-items:center;gap:5px}
    .ml-type-toggle{display:flex;gap:8px}
    .ml-type-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:var(--mp-radius-sm);border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .ml-type-btn:hover{border-color:var(--mp-green);color:var(--mp-green)}
    .ml-type-btn.active{background:var(--mp-green);border-color:var(--mp-green);color:#fff}
    .mp-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);line-height:1.4;margin-top:2px}
    .mp-hint i{color:var(--mp-green);flex-shrink:0}
    .mp-rent-head{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--mp-accent);text-transform:uppercase;letter-spacing:.4px;background:#fef8ec;border:1px solid #f1e3bc;border-radius:var(--mp-radius-sm);padding:9px 12px;margin:2px 0}
    .chip.rent{background:#fef3e2;color:#B45309;border:1px solid #f5d9a8}
    .chip.sell{background:#e8f5e9;color:#2e7d32}
    .mp-search{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
    .mp-search i{position:absolute;left:12px;color:var(--text-muted);font-size:12px}
    .mp-search input{width:100%;padding:11px 12px 11px 34px;border:1px solid var(--border-light);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font-size:13px;outline:none}
    .mp-search input:focus{border-color:var(--mp-green)}
    .mp-tbfield{flex:0 1 auto;min-width:110px;padding:9px 10px;border:1px solid var(--border-light);border-radius:10px;background:var(--bg-card-soft);color:var(--text-secondary);font-size:12.5px}
    .mp-tbfield:focus{outline:none;border-color:var(--mp-green)}
    @media(max-width:560px){.mp-tbfield{flex:1 1 calc(50% - 8px);min-width:0}}
    .is-table-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--mp-radius);overflow:hidden}
    .sale-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
    .sale-row:last-child{border-bottom:none}
    .is-table-card .sale-row:hover{background:var(--bg-card-soft)}
    .is-table-card .sale-row .t{cursor:pointer}
    .sale-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#e9ecef;flex-shrink:0}
    .sale-thumb-fallback{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,#C9760A,#E8A83D);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .sale-info{flex:1;min-width:170px}
    .sale-info .t{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:4px;overflow-wrap:anywhere}
    .sale-info .m{font-size:11px;color:var(--text-secondary);display:flex;gap:5px 9px;flex-wrap:wrap;align-items:center;line-height:1.7}
    .sale-info .m i{font-size:10px;flex-shrink:0}
    .sale-info .m>span{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;overflow-wrap:anywhere}
    .sale-info .m .ml-icon-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bg-card-soft);border:1px solid var(--border-light);color:var(--mp-green);font-size:10px;flex-shrink:0}
    .sale-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .sale-amount{font-size:14px;font-weight:800;color:var(--mp-green);white-space:nowrap}
    .sale-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
    .sale-row .mp-link-btn{white-space:nowrap}
    @media(max-width:640px){
      .sale-row{gap:10px;padding:12px}
      .sale-info{flex:1 1 100%;min-width:0}
      .sale-right{flex:1 1 100%;width:100%;justify-content:space-between;gap:8px}
      .sale-btns{justify-content:flex-start}
    }
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
    .chip.el{background:var(--bg-card-soft);color:var(--text-secondary)}
    .chip.ok{background:#e8f5e9;color:#2e7d32}
    .chip.warn{background:#fff8e1;color:#b7791f}
    .chip.bad{background:#ffebee;color:#c62828}
    .chip.info{background:#e8f0fe;color:#1a56db}
    .mp-link-btn{background:none;border:none;color:var(--mp-green);font-size:11px;font-weight:700;cursor:pointer;padding:4px 6px;display:inline-flex;align-items:center;gap:4px;transition:opacity .15s}
    .mp-link-btn:hover{opacity:.75}
    .mp-link-btn.danger{color:#c0392b}
    .mp-link-btn.hot{color:var(--mp-amber)}
    .mp-loadmore{display:block;margin:18px auto 0;padding:10px 24px;border-radius:var(--mp-radius-sm);border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:700;cursor:pointer}
    .mp-loadmore:hover{color:var(--mp-green);border-color:var(--mp-green)}
    .req{color:#c0392b}
    .mp-field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    @media(max-width:480px){.mp-field-row3{grid-template-columns:1fr 1fr}}
    .mp-img-grid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .mp-img-box{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--border-light)}
    .mp-img-box img{width:100%;height:100%;object-fit:cover}
    .mp-img-box .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .mp-img-add{width:74px;height:74px;border:1px dashed #bbb;border-radius:8px;color:#999;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;background:var(--bg-card)}
    .mp-img-add small{font-size:9px;font-weight:600}
    .mp-buyer-hint{background:#fef8ec;border:1px solid #f1e3bc;color:#8a6d1b;font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
    /* -- Activity sheet (enquiries + sale history for a listing) -- */
    .act-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .act-tab{padding:7px 13px;border-radius:18px;border:1px solid var(--border-light);background:var(--bg-card);color:var(--text-secondary);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .act-tab.active{background:var(--mp-green);color:#fff;border-color:var(--mp-green)}
    .act-row{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
    .act-row:last-child{border-bottom:none}
    .act-avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--soft-green,#e8f5e9);color:var(--mp-green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden}
    .act-avatar img{width:100%;height:100%;object-fit:cover}
    .act-info{flex:1;min-width:170px}
    .act-info .t{font-size:12.5px;font-weight:700;color:var(--text-primary)}
    .act-info .m{font-size:11px;color:var(--text-secondary);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
    .act-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .act-reply-box{width:100%;margin-top:8px;display:flex;flex-direction:column;gap:8px}
    .act-reply-box textarea{width:100%;padding:10px 12px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-card-soft);color:var(--text-primary);font-size:12.5px;outline:none;font-family:inherit;box-sizing:border-box}
    .act-reply-box textarea:focus{border-color:var(--mp-green)}
    .act-reply-btns{display:flex;gap:8px;justify-content:flex-end}
    .mp-empty{border:1px dashed var(--border-light);border-radius:var(--mp-radius);padding:44px 24px;text-align:center;grid-column:1/-1}
    .mp-empty i{font-size:42px;opacity:.35;margin-bottom:12px;display:block}
    .mp-empty h4{font-size:16px;font-weight:800;color:var(--text-primary);margin:0 0 4px}
    .mp-empty p{font-size:13px;color:var(--text-muted);max-width:460px;margin:0 auto 14px}
    .mp-grid-error{background:var(--bg-card);border:1px dashed var(--border-light);border-radius:var(--mp-radius);padding:28px 18px;text-align:center}
    .mp-grid-error i{font-size:30px;color:#E5A9A5;display:block;margin-bottom:10px}
    .mp-grid-error p{margin:0 0 14px;font-size:13px;color:var(--text-secondary)}
    .mp-gerr-detail{display:block;font-size:11px;color:var(--text-muted);margin:-6px 0 12px;word-break:break-all}
    .mp-skel{height:66px;border-radius:var(--mp-radius);border:1px solid var(--border-light);background:linear-gradient(90deg,#eef4ef,#f9fbf9,#eef4ef);background-size:200% 100%;animation:mpSh 1.2s infinite;margin-bottom:10px}
    @keyframes mpSh{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .mp-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1039;display:none}
    .mp-sheet-bg.open{display:block}
    .mp-sheet-bg.full{background:rgba(0,0,0,.55)}
    .mp-sheet{position:fixed;z-index:1040;background:var(--bg-card);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.16,1,.3,1)}
    .mp-sheet.bottom{bottom:0;left:0;right:0;max-height:92vh;border-radius:var(--mp-radius) var(--mp-radius) 0 0;transform:translateY(100%)}
    .mp-sheet.bottom.open{transform:translateY(0)}
    .mp-sheet.bottom.full{height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;z-index:1650;border-radius:0}
    .mp-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border-light)}
    .mp-sheet-head h3{margin:0;font-size:16px;font-weight:800}
    .mp-sheet-head button{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer}
    .mp-sheet-body{padding:16px 18px;overflow-y:auto}
    .mp-form{display:flex;flex-direction:column;gap:12px}
    .mp-field{display:flex;flex-direction:column;gap:5px}
    .mp-field label{font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px}
    .mp-field input,.mp-field select{padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--mp-radius-sm);background:var(--bg-card-soft);color:var(--text-primary);font-size:13px;outline:none;font-family:inherit;width:100%;box-sizing:border-box}
    .mp-field input:focus,.mp-field select:focus{border-color:var(--mp-green)}
    .mp-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:480px){.mp-field-row{grid-template-columns:1fr}}
    .mp-form-foot{display:flex;gap:10px;justify-content:flex-end}
    .ml-detail{display:flex;flex-direction:column;gap:10px}
    .ml-detail .hero{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
    .ml-detail .hero img{width:92px;height:92px;border-radius:11px;object-fit:cover;background:#e9ecef;flex-shrink:0}
    .ml-detail .hero .fallback{width:92px;height:92px;border-radius:11px;background:linear-gradient(135deg,#C9760A,#E8A83D);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
    .ml-detail .hero .info{flex:1;min-width:190px}
    .ml-detail .hero .info h3{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--text-primary)}
    .ml-detail .hero .info .sub{font-size:11.5px;color:var(--text-muted);margin-bottom:6px}
    .ml-detail .price{font-size:18px;font-weight:800;color:var(--mp-green)}
    .ml-detail .price small{font-size:11px;color:var(--text-muted);font-weight:600}
    .ml-detail .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(max-width:480px){.ml-detail .grid{grid-template-columns:1fr}}
    .ml-detail .kv{background:var(--bg-card-soft);border:1px solid var(--border-light);border-radius:9px;padding:10px 12px}
    .ml-detail .kv .k{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
    .ml-detail .kv .v{font-size:13px;color:var(--text-primary);font-weight:600;word-break:break-word}
    .ml-detail .desc{background:var(--bg-card-soft);border:1px solid var(--border-light);border-radius:9px;padding:12px;font-size:12.5px;color:var(--text-secondary);line-height:1.5}
    .mp-toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:auto}
    .is-toast{background:#1d2a22;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:86vw;text-align:center}
    .is-toast.error{background:#b03030}
    .ml-bottom-cta{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card,#fff);border-top:1px solid var(--border-light);padding:11px 16px calc(11px + env(safe-area-inset-bottom));z-index:899}
    .ml-bottom-cta .inner{max-width:980px;margin:0 auto;display:flex;gap:10px}
    .ml-bottom-cta .inner .mp-btn{flex:1;justify-content:center;max-width:300px}
    @media(max-width:640px){.ml-bottom-cta .inner .mp-btn{max-width:none}}
  </style>
</head>
<body>
  <div class="ml-top">
    <a class="back" href="marketplace.html" aria-label="Back to Marketplace"><i class="fas fa-arrow-left"></i></a>
    <h1><i class="fas fa-boxes-stacked"></i>My Listings</h1>
    <span class="cnt" id="count-label">0</span>
  </div>

  <div class="ml-page">
    <div class="ml-cta">
      <p><i class="fas fa-circle-info" style="color:var(--mp-green);margin-right:6px"></i>Manage every item you are selling. View, edit, pause, mark as sold or delete your listings.</p>
    </div>

    <div class="mp-status-pills" id="ml-pills">
      <button class="mp-pill active" data-status="">All <span id="cnt-total">0</span></button>
      <button class="mp-pill" data-status="active">Active</button>
      <button class="mp-pill" data-status="pending">Pending</button>
      <button class="mp-pill" data-status="paused">Paused</button>
      <button class="mp-pill" data-status="sold">Sold</button>
      <button class="mp-pill" data-status="expired">Expired</button>
      <button class="mp-pill" data-status="cancelled">Cancelled</button>
    </div>

    <div class="mp-type-pills" id="ml-type-pills">
      <span class="mp-type-label"><i class="fas fa-layer-group"></i> Type</span>
      <button class="mp-pill active" data-ltype="">All</button>
      <button class="mp-pill" data-ltype="sell"><i class="fas fa-tags"></i> Sell</button>
      <button class="mp-pill" data-ltype="rent"><i class="fas fa-calendar-alt"></i> Rent</button>
    </div>

    <div class="mp-toolbar" id="ml-tools">
      <div class="mp-search"><i class="fas fa-magnifying-glass"></i><input id="ml-search" maxlength="60" placeholder="Search your listings"></div>
      <button type="button" class="mp-btn ghost" id="ml-filter-open"><i class="fas fa-sliders"></i> Filter</button>
    </div>

    <div class="is-table-card" id="ml-grid"></div>
    <button class="mp-loadmore" id="ml-more" style="display:none">Load more</button>
  </div>

  <!-- SHEET: FILTER -->
  <div class="mp-sheet-bg" id="ml-sheet-bg"></div>
  <div class="mp-sheet bottom" id="ml-sheet-filter">
    <div class="mp-sheet-head"><h3><i class="fas fa-sliders" style="color:var(--mp-green);margin-right:6px"></i>Filter your listings</h3><button data-close-sheet="ml-sheet-filter">×</button></div>
    <div class="mp-sheet-body">
      <form class="mp-form" id="ml-filter-form">
        <div class="mp-field-row">
          <div class="mp-field"><label>Category group</label><select id="mflt-group"><option value="">All groups</option><option value="produce">Produce / Crop</option><option value="items">Farm Item / Equipment</option></select></div>
          <div class="mp-field"><label>Category</label><select id="mflt-cat"><option value="">All categories</option></select></div>
        </div>
        <div class="mp-field-row">
          <div class="mp-field"><label>Offer type</label><select id="mflt-ltype"><option value="">Sell &amp; Rent</option><option value="sell">Sell only</option><option value="rent">Rent only</option></select></div>
          <div class="mp-field"><label>Status</label><select id="mflt-status"><option value="">All statuses</option><option value="active">Active</option><option value="pending">Pending</option><option value="paused">Paused</option><option value="sold">Sold</option><option value="expired">Expired</option><option value="cancelled">Cancelled</option></select></div>
        </div>
        <div class="mp-field-row">
          <div class="mp-field"><label>Min price (&#8377;)</label><input id="mflt-min" type="number" min="0" step="0.01" placeholder="Any"></div>
          <div class="mp-field"><label>Max price (&#8377;)</label><input id="mflt-max" type="number" min="0" step="0.01" placeholder="Any"></div>
        </div>
        <div class="mp-field-row">

        <div id="lb-item-fields" style="display:none">
          <div class="mp-field-row">

            <div class="mp-field"><label>Age (years)</label><input id="lb-age" maxlength="60" placeholder="e.g. 2 years"></div>

            <div class="mp-field"><label><span class="req">*</span> Delivery / pickup</label><select id="lb-rent-delivery"><option value="pickup">Buyer pickup only</option><option value="delivery">Delivery only</option><option value="both">Delivery + pickup</option></select></div>

  <!-- SHEET: ACTIVITY (buyer enquiries + sale history for one listing) -->
  <div class="mp-sheet bottom" id="ml-sheet-activity">

    <div class="mp-sheet-body">
      <div class="mp-buyer-hint" id="ml-act-listing" style="background:var(--bg-card-soft);border-color:var(--border-light);color:var(--text-secondary);margin-bottom:12px"><i class="fas fa-box-open"></i><span></span></div>

  <div class="ml-bottom-cta">
    <div class="inner">
      <button class="mp-btn primary" id="new-listing-2"><i class="fas fa-plus"></i> List New Item</button>
    </div>
  </div>

  <div class="mp-toast-wrap" id="ml-toast-wrap"></div>

  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    'use strict';

    var BASE_URL = (window.API && API.config && API.config.BASE_URL) || (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) || 'http://localhost:8000/api/v1';
    var SVC = window.MarketplaceSellerService;
    var LIMIT = 24, page = 1;
    var FILTERS = { status: '', ltype: '', search: '', group: '', category: '', minPrice: '', maxPrice: '', location: '', sort: 'newest' };
    var ITEMS = [], TOTAL = 0;
    var UNITS = ['kg', 'g', 'quintal', 'tonne', 'bag', 'pack', 'bundle', 'piece', 'set', 'unit', 'litre', 'dozen'];
    var RENT_PERIOD_LABEL = { day: 'day', week: 'week', month: 'month' };
    var DELIVERY_LABEL = { delivery: 'Delivery', pickup: 'Pickup', both: 'Delivery + pickup' };
    var CONTACT_ICON = { phone: 'fa-phone', whatsapp: 'fa-brands fa-whatsapp', 'in-app': 'fa-comment-dots' };
    var FORM = { mode: 'create', listing: null, images: [], saleListing: null, activityId: null };

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtPrice(v) { return '₹' + Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
    function qtyFmt(v, u) { return (Number(v) || 0) + ' ' + (u || ''); }
    function timeAgo(dateStr) {
      if (!dateStr) return '';
      var t = new Date(dateStr.replace(' ', 'T'));
      if (isNaN(t)) return '';
      var s = Math.floor((Date.now() - t.getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      if (s < 604800) return Math.floor(s / 86400) + 'd ago';
      return t.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function statusChip(st) {
      var map = {
        active: { t: 'Active', c: 'ok' }, pending: { t: 'Pending', c: 'warn' },
        sold: { t: 'Sold', c: 'el' }, paused: { t: 'Paused', c: 'warn' },
        expired: { t: 'Expired', c: 'bad' }, cancelled: { t: 'Cancelled', c: 'bad' },
        new: { t: 'New', c: 'info' }, replied: { t: 'Responded', c: 'el' },
        negotiating: { t: 'Negotiating', c: 'warn' }, closed: { t: 'Closed', c: 'bad' },
        accepted: { t: 'Accepted', c: 'ok' }, rejected: { t: 'Declined', c: 'bad' },
        completed: { t: 'Completed', c: 'ok' }, confirmed: { t: 'Confirmed', c: 'info' },
        paid: { t: 'Paid', c: 'ok' }, partial: { t: 'Partial', c: 'warn' },
        pickup: { t: 'Pickup', c: 'info' }, delivered: { t: 'Delivered', c: 'ok' }
      };
      var m = map[st] || { t: st || '—', c: 'el' };
      return '<span class="chip ' + m.c + '">' + m.t + '</span>';
    }
    function initials(name) {
      name = (name || '').trim().split(/\s+/).filter(Boolean);
      if (!name.length) return '?';
      var a = (name[0][0] || '?').toUpperCase();
      var b = name.length > 1 && name[name.length - 1][0] ? name[name.length - 1][0].toUpperCase() : '';
      return a + b;
    }
    function toast(msg, type) {
      var el = document.createElement('div');
      el.className = 'is-toast ' + (type || 'success');
      el.textContent = msg;
      $('ml-toast-wrap').appendChild(el);
      setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(function () { el.remove(); }, 320); }, 2600);
    }
    function errMsg(e) {
      if (e && e.data && e.data.detail) return e.data.detail;
      if (e && e.data && e.data.errors && e.data.errors.length) return e.data.errors[0].message;
      if (e && e.message) return e.message;
      return 'Something went wrong. Please try again.';
    }
    function firstImage(l) { var imgs = (l && l.images) || []; return imgs.length ? imgs[0].url : null; }
    function openSheet(id) {
      var bg = $('ml-sheet-bg');
      bg.classList.add('open');
      bg.classList.toggle('full', id === 'ml-sheet-listing');
      $(id).classList.add('open');
      $(id).classList.toggle('full', id === 'ml-sheet-listing');
    }
    function closeSheet(id) {
      $(id).classList.remove('open');
      $(id).classList.remove('full');
      if (!document.querySelector('.mp-sheet.open')) $('ml-sheet-bg').classList.remove('open');
      $('ml-sheet-bg').classList.remove('full');
    }
    function closeAllSheets() {
      document.querySelectorAll('.mp-sheet.open').forEach(function (s) { s.classList.remove('open'); s.classList.remove('full'); });
      $('ml-sheet-bg').classList.remove('open');
      $('ml-sheet-bg').classList.remove('full');
    }
    function setBtn(el, busy, busyHtml, normalHtml) {
      if (!el) return;
      if (busy) { el.disabled = true; el.innerHTML = busyHtml; }
      else { el.disabled = false; el.innerHTML = normalHtml; }
    }

    /* --------- Loading --------- */
    function query() {
      var q = { page: page, limit: LIMIT };
      if (FILTERS.status) q.status = FILTERS.status;
      if (FILTERS.ltype) q.listing_type = FILTERS.ltype;
      if (FILTERS.search) q.search = FILTERS.search;
      if (FILTERS.group) q.group = FILTERS.group;
      if (FILTERS.category) q.category_id = FILTERS.category;
      if (FILTERS.location) q.location = FILTERS.location;
      if (FILTERS.minPrice !== '' && !isNaN(Number(FILTERS.minPrice))) q.min_price = Number(FILTERS.minPrice);
      if (FILTERS.maxPrice !== '' && !isNaN(Number(FILTERS.maxPrice))) q.max_price = Number(FILTERS.maxPrice);
      if (FILTERS.sort && FILTERS.sort !== 'newest') q.sort = FILTERS.sort;
      return q;
    }

    function load(reset) {
      if (!SVC) return;
      if (reset !== false && page > 1) page = 1;
      var grid = $('ml-grid');
      if (!ITEMS.length && reset !== false) {
        var sk = '';
        for (var i = 0; i < 5; i++) sk += '<div class="mp-skel"></div>';
        grid.innerHTML = sk;
      }
      SVC.listListings(query()).then(function (d) {
        ITEMS = reset === false ? ITEMS.concat(d.items || []) : (d.items || []);
        TOTAL = d.total || 0;
        render();
        $('ml-more').style.display = TOTAL > ITEMS.length ? '' : 'none';
        $('count-label').textContent = TOTAL;
        $('cnt-total').textContent = TOTAL;
      }).catch(function (e) {
        grid.innerHTML = '<div class="mp-grid-error"><i class="fas fa-plug-circle-xmark"></i><p>' + esc(errMsg(e) || 'Unable to load listings') + '</p><button class="mp-btn ghost" id="ml-retry"><i class="fas fa-rotate-right"></i> Retry</button></div>';
        var btn = $('ml-retry');
        if (btn) btn.addEventListener('click', function () { load(true); });
      });
    }

    function render() {
      var grid = $('ml-grid');
      if (!ITEMS.length) {
        var active = FILTERS.status || FILTERS.ltype || FILTERS.search || FILTERS.group || FILTERS.category || FILTERS.location || FILTERS.minPrice !== '' || FILTERS.maxPrice !== '';
        grid.innerHTML = '<div class="mp-empty"><i class="fas ' + (active ? 'fa-filter' : 'fa-box-open') + '"></i>' +
          '<h4>' + (active ? 'No listings match your filters' : 'No listings yet') + '</h4>' +
          '<p>' + (active
            ? 'Try changing the search text, offer type, category, status, location or price range.'
            : 'List your first crop, produce or farm item to start selling through Farm Assist.') + '</p>' +
          (active
            ? '<button class="mp-btn ghost" id="ml-clear-filters"><i class="fas fa-rotate-left"></i> Clear filters</button>'
            : '<button class="mp-btn primary" id="ml-empty-add"><i class="fas fa-plus"></i> List New Item</button>') +
          '</div>';
        var ca = $('ml-clear-filters');
        if (ca) ca.addEventListener('click', resetAllFilters);
        var ea = $('ml-empty-add');
        if (ea) ea.addEventListener('click', newListing);
        return;
      }
      grid.innerHTML = ITEMS.map(row).join('');
    }

    function isRent(l) { return (l && l.listing_type) === 'rent'; }
    function typeChip(l) {
      return isRent(l)
        ? '<span class="chip rent"><i class="fas fa-calendar-alt"></i> Rent</span>'
        : '<span class="chip sell"><i class="fas fa-tags"></i> Sell</span>';
    }
    function priceLine(l) {
      if (isRent(l)) {
        var p = l.rental_period ? ('/' + (RENT_PERIOD_LABEL[l.rental_period] || l.rental_period)) : '';
        return '<div class="sale-amount">' + fmtPrice(l.price) + (p ? '<span style="font-size:11px;font-weight:600"> ' + esc(p) + '</span>' : '') + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted)">rent ' + (p ? 'per' : 'price') + '</div>';
      }
      return '<div class="sale-amount">' + fmtPrice(l.price) + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted)">per ' + esc(l.unit) + '</div>';
    }
    function rentMeta(l) {
      if (!isRent(l)) return '';
      var bits = [];
      if (l.min_rental_duration) bits.push('<span title="Minimum rental period"><i class="far fa-clock"></i> Min ' + esc(l.min_rental_duration) + '</span>');
      if (l.delivery_option) bits.push('<span title="Delivery / pickup"><i class="fas fa-truck-fast"></i> ' + esc(DELIVERY_LABEL[l.delivery_option] || l.delivery_option) + '</span>');
      if (l.security_deposit !== null && l.security_deposit !== undefined && l.security_deposit !== '') {
        bits.push('<span title="Security deposit"><i class="fas fa-indian-rupee-sign"></i> Deposit ' + esc(fmtPrice(l.security_deposit)) + '</span>');
      }
      var win = [];
      if (l.available_from) win.push(esc(l.available_from));
      if (l.available_until) win.push(esc(l.available_until));
      if (win.length) bits.push('<span title="Availability window"><i class="far fa-calendar"></i> ' + win.join(' → ') + '</span>');
      var area = l.service_area || l.location;
      if (area) bits.push('<span><i class="fas fa-location-dot"></i> ' + esc(area) + '</span>');
      return bits.join('');
    }
    function contactChip(l) {
      var icon = CONTACT_ICON[l.contact_method];
      if (!icon) return '';
      var label = l.contact_method === 'in-app' ? 'In-app chat' : (l.contact_method === 'whatsapp' ? 'WhatsApp' : 'Phone');
      return '<span class="ml-icon-chip" title="' + esc(label) + '"><i class="' + icon + '"></i></span>';
    }

    function row(l) {
      var actions = '';
      if (l.status === 'active' || l.status === 'pending') {
        actions += '<button class="mp-link-btn hot" data-act="sale" data-id="' + esc(l.id) + '"><i class="fas fa-check-circle"></i> ' + (isRent(l) ? 'Mark Rented' : 'Mark Sold') + '</button>';
      }
      if (l.status === 'active') {
        actions += '<button class="mp-link-btn" data-act="pause" data-id="' + esc(l.id) + '"><i class="fas fa-pause"></i> Pause</button>';
      } else if (l.status === 'paused') {
        actions += '<button class="mp-link-btn" data-act="resume" data-id="' + esc(l.id) + '"><i class="fas fa-play"></i> Resume</button>';
      }
      actions += '<button class="mp-link-btn" data-act="edit" data-id="' + esc(l.id) + '"><i class="fas fa-pen"></i> Edit</button>';
      actions += '<button class="mp-link-btn" data-act="activity" data-id="' + esc(l.id) + '"><i class="fas fa-chart-simple"></i> Activity</button>';
      actions += '<button class="mp-link-btn" data-act="view" data-id="' + esc(l.id) + '"><i class="fas fa-eye"></i> View</button>';
      if (l.status !== 'sold') {
        actions += '<button class="mp-link-btn danger" data-act="del" data-id="' + esc(l.id) + '"><i class="fas fa-trash"></i> Delete</button>';
      }
      var url = firstImage(l);
      var thumbHtml = url
        ? '<img class="sale-thumb" src="' + esc(url) + '" alt="">'
        : '<div class="sale-thumb-fallback"><i class="fas fa-seedling"></i></div>';
      var location = isRent(l) ? '' : (l.location ? '<span><i class="fas fa-location-dot"></i> ' + esc(l.location) + '</span>' : '');
      return '<div class="sale-row">' +
        thumbHtml +
        '<div class="sale-info">' +
        '<div class="t" data-act="view" data-id="' + esc(l.id) + '">' + esc(l.title) + '</div>' +
        '<div class="m">' + typeChip(l) + statusChip(l.status || '—') +
        '<span><i class="fas fa-boxes"></i> ' + qtyFmt(l.remaining_quantity, l.unit) + ' left</span>' +
        contactChip(l) +
        rentMeta(l) +
        location +
        (l.created_at ? '<span><i class="far fa-calendar"></i> ' + esc(timeAgo(l.created_at)) + '</span>' : '') +
        '</div></div>' +
        '<div class="sale-right">' +
        priceLine(l) +
        '<div class="sale-btns">' + actions + '</div>' +
        '</div></div>';
    }

    /* --------- Detail --------- */
    function viewDetail(id) {
      if (!SVC) return;
      SVC.getListing(id).then(function (l) {
        var url = firstImage(l);
        var heroImg = url
          ? '<img src="' + esc(url) + '" alt="">'
          : '<div class="fallback"><i class="fas fa-seedling"></i></div>';
        var contact = l.contact_method === 'phone' ? 'Phone' : l.contact_method === 'whatsapp' ? 'WhatsApp' : 'In-app chat';
        var pairs = [
          ['Category', (l.category && l.category.name) || '—'],
          ['Quantity', qtyFmt(l.remaining_quantity !== undefined ? l.remaining_quantity : l.quantity, l.unit)],
          ['Price', fmtPrice(l.price) + (l.pricing_type === 'negotiable' ? ' (negotiable)' : '')],
          ['Location', l.location || '—'],
          ['Availability', l.availability || '—'],
          ['Contact', contact],
          ['Status', statusChip(l.status || '—'), true],
          ['Listed', timeAgo(l.created_at) || '—']
        ];
        if (isRent(l)) {
          pairs[2] = ['Rent price', fmtPrice(l.price) + (l.rental_period ? ' per ' + (RENT_PERIOD_LABEL[l.rental_period] || l.rental_period) : '')];
          pairs.splice(4, 1, ['Available', (l.available_from || '—') + (l.available_until ? ' → ' + l.available_until : '')]);
          pairs.splice(5, 0,
            ['Min rental period', l.min_rental_duration || '—'],
            ['Delivery / pickup', DELIVERY_LABEL[l.delivery_option] || '—'],
            ['Security deposit', (l.security_deposit !== null && l.security_deposit !== undefined && l.security_deposit !== '') ? fmtPrice(l.security_deposit) : 'None'],
            ['Service area', l.service_area || l.location || '—'],
            ['Equipment condition', l.condition_type ? (l.condition_type === 'used' ? 'Used' : 'New') : '—']
          );
        }
        if (l.quality_grade) pairs.push(['Grade', l.quality_grade]);
        if (l.brand) pairs.push(['Brand', l.brand]);
        if (l.model) pairs.push(['Model', l.model]);
        if (isRent(l) && l.rental_terms) pairs.push(['Rental terms', l.rental_terms]);
        var actions = '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:flex-end">' +
          '<button class="mp-btn ghost" data-close-sheet="ml-sheet-detail">Close</button>';
        if (l.status === 'active' || l.status === 'pending') {
          actions += '<button class="mp-btn primary" data-act="sale" data-id="' + esc(l.id) + '"><i class="fas fa-check-circle"></i> ' + (isRent(l) ? 'Mark Rented' : 'Mark Sold') + '</button>';
        }
        if (l.status === 'paused') {
          actions += '<button class="mp-btn ghost" data-act="resume" data-id="' + esc(l.id) + '"><i class="fas fa-play"></i> Resume</button>';
        }
        actions += '<button class="mp-btn ghost" data-act="edit" data-id="' + esc(l.id) + '"><i class="fas fa-pen"></i> Edit</button>' +
          '<button class="mp-btn ghost" data-act="activity" data-id="' + esc(l.id) + '"><i class="fas fa-chart-simple"></i> Activity</button>' +
          '</div>';
        $('ml-detail-body').innerHTML =
          '<div class="ml-detail">' +
          '<div class="hero">' + heroImg +
          '<div class="info"><h3>' + esc(l.title) + '</h3>' +
          '<div class="sub">' + typeChip(l) + ' ' + statusChip(l.status || '—') + ' — Listed ' + esc(timeAgo(l.created_at) || '—') + '</div>' +
          '<div class="price">' + (isRent(l)
            ? fmtPrice(l.price) + (l.rental_period ? ' <small>per ' + esc(RENT_PERIOD_LABEL[l.rental_period] || l.rental_period) + '</small>' : ' <small>rent</small>')
            : fmtPrice(l.price) + ' <small>per ' + esc(l.unit) + '</small>') + '</div>' +
          '</div></div>' +
          '<div class="grid">' + pairs.map(function (p) {
            return '<div class="kv"><div class="k">' + esc(p[0]) + '</div><div class="v">' + (p[2] ? p[1] : esc(p[1])) + '</div></div>';
          }).join('') + '</div>' +
          (l.description ? '<div class="desc">' + esc(l.description) + '</div>' : '') +
          actions +
          '</div>';
        openSheet('ml-sheet-detail');
      }).catch(function (e) { toast(errMsg(e), 'error'); });
    }

    /* --------- Actions --------- */
    function newListing() { openCreateForm(); }

    function onAction(id, act) {
      if (!SVC) return;
      if (act === 'view') { viewDetail(id); return; }
      if (act === 'activity') { openActivity(id); return; }
      if (act === 'edit') {
        SVC.getListing(id).then(function (l) { openEditForm(l); }).catch(function (e) { toast(errMsg(e), 'error'); });
        return;
      }
      if (act === 'sale') {
        SVC.getListing(id).then(function (l) { openSaleForm(l, null); }).catch(function (e) { toast(errMsg(e), 'error'); });
        return;
      }
      if (act === 'pause') {
        SVC.updateListingStatus(id, 'paused').then(function () {
          toast('Listing paused.');
          load(true); refreshCount();
        }).catch(function (e) { toast(errMsg(e), 'error'); });
        return;
      }
      if (act === 'resume') {
        SVC.updateListingStatus(id, 'active').then(function () {
          toast('Listing is active again.');
          load(true); refreshCount();
        }).catch(function (e) { toast(errMsg(e), 'error'); });
        return;
      }
      if (act === 'del') {
        showConfirm('Delete listing?', 'This listing will be removed from the marketplace. If it has sale history, the listing is hidden but your sales records stay safe.', function () {
          SVC.deleteListing(id).then(function () {
            toast('Listing deleted.');
            load(true); refreshCount();
          }).catch(function (e) { toast(errMsg(e), 'error'); });
        });
      }
    }

    function showConfirm(title, text, fn) {
      $('ml-confirm-title').textContent = title;
      $('ml-confirm-text').textContent = text;
      $('ml-confirm-ok').onclick = function () { closeSheet('ml-sheet-confirm'); fn(); };
      openSheet('ml-sheet-confirm');
    }

    /* --------- Listing form (create / edit) --------- */
    function openCreateForm() {
      FORM.mode = 'create';
      FORM.listing = null;
      FORM.images = [];
      $('ml-listing-title').innerHTML = '<i class="fas fa-plus" style="color:var(--mp-green);margin-right:6px"></i>Add a new listing';
      var form = $('ml-listing-form');
      form.reset();
      setListingType('sell');
      $('lb-group').value = 'produce';
      $('lb-unit').innerHTML = UNITS.map(function (u) { return '<option value="' + u + '">' + u + '</option>'; }).join('');
      $('lb-unit').value = 'kg';
      $('lb-rental-period').value = 'week';
      $('lb-rent-delivery').value = 'pickup';
      updateCategoryOptions();
      applyListingType();
      renderFormImages();
      openSheet('ml-sheet-listing');
    }

    function openEditForm(listing) {
      FORM.mode = 'edit';
      FORM.listing = listing;
      FORM.images = (listing.images || []).map(function (im) { return im.url; });
      $('ml-listing-title').innerHTML = '<i class="fas fa-pen" style="color:var(--mp-green);margin-right:6px"></i>Edit listing';
      var form = $('ml-listing-form');
      form.reset();
      setListingType(isRent(listing) ? 'rent' : 'sell');
      $('lb-title').value = listing.title || '';
      $('lb-group').value = (listing.category && listing.category.group) || 'produce';
      $('lb-unit').innerHTML = UNITS.map(function (u) { return '<option value="' + u + '">' + u + '</option>'; }).join('');
      $('lb-unit').value = listing.unit || 'kg';
      updateCategoryOptions();
      $('lb-cat').value = listing.category_id || '';
      $('lb-qty').value = listing.quantity || '';
      $('lb-price').value = listing.price || '';
      $('lb-pricing').value = listing.pricing_type || 'fixed';
      $('lb-location').value = listing.location || '';
      $('lb-availability').value = listing.availability || '';
      $('lb-harvest').value = listing.harvest_date || '';
      $('lb-quality').value = listing.quality_grade || '';
      $('lb-contact').value = listing.contact_method || 'in-app';
      $('lb-condition').value = listing.condition_type || 'new';
      $('lb-age').value = listing.age_year || '';
      $('lb-brand').value = listing.brand || '';
      $('lb-model').value = listing.model || '';
      $('lb-usage').value = listing.usage_details || '';
      $('lb-condition-detail').value = listing.condition_detail || '';
      $('lb-rental-period').value = listing.rental_period || 'week';
      $('lb-rent-min').value = listing.min_rental_duration || '';
      $('lb-rent-from').value = listing.available_from || '';
      $('lb-rent-until').value = listing.available_until || '';
      $('lb-rent-deposit').value = (listing.security_deposit !== null && listing.security_deposit !== undefined) ? listing.security_deposit : '';
      $('lb-rent-delivery').value = listing.delivery_option || 'pickup';
      $('lb-rent-area').value = listing.service_area || '';
      $('lb-rent-terms').value = listing.rental_terms || '';
      $('lb-desc').value = listing.description || '';
      renderFormImages();
      openSheet('ml-sheet-listing');
    }

    function setListingType(type) {
      $('lb-type').value = (type === 'rent') ? 'rent' : 'sell';
      document.querySelectorAll('#lb-type-toggle .ml-type-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.listingType === $('lb-type').value);
      });
      applyListingType();
    }

    function applyListingType() {
      var rent = $('lb-type').value === 'rent';
      $('lb-rent-fields').style.display = rent ? '' : 'none';
      $('lb-type-hint').innerHTML = rent
        ? '<i class="fas fa-calendar-alt"></i> Rent: set the rental price, minimum period and availability below.'
        : '<i class="fas fa-circle-info"></i> Sell: list your produce or farm item at a fixed price.';
      var priceLabel = $('lb-price-label');
      if (priceLabel) {
        priceLabel.innerHTML = rent
          ? '<span class="req">*</span> Rent price (&#8377;)'
          : '<span class="req">*</span> Price per unit (&#8377;)';
      }
      var titleLabel = $('lb-title-label');
      if (titleLabel) {
        titleLabel.innerHTML = rent
          ? '<span class="req">*</span> What are you renting out?'
          : '<span class="req">*</span> What are you selling?';
      }
      $('lb-harvest-field').style.display = rent ? 'none' : '';
      $('lb-availability-field').style.display = rent ? 'none' : '';
    }

    function updateCategoryOptions() {
      var group = $('lb-group').value;
      $('lb-group').value = group;
      $('lb-item-fields').style.display = group === 'items' ? '' : 'none';
      if (!window._ML_CATS) return;
      var cats = window._ML_CATS[group] || [];
      $('lb-cat').innerHTML = '<option value="">Select category…</option>' + cats.map(function (c) {
        return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
      }).join('');
    }

    function renderFormImages() {
      var grid = $('lb-images');
      var html = FORM.images.map(function (u, i) {
        return '<div class="mp-img-box"><img src="' + esc(u) + '" alt="photo ' + (i + 1) + '"><button type="button" class="rm" data-rm="' + i + '"><i class="fas fa-xmark"></i></button></div>';
      }).join('');
      if (FORM.images.length < 5) {
        html += '<button type="button" class="mp-img-add" id="img-add"><i class="fas fa-camera"></i><small>Add photo</small></button>';
      }
      grid.innerHTML = html;
      var add = $('img-add');
      if (add) add.addEventListener('click', function () { $('lb-img-input').click(); });
      grid.querySelectorAll('.rm').forEach(function (b) {
        b.addEventListener('click', function () {
          FORM.images.splice(Number(b.dataset.rm), 1);
          renderFormImages();
        });
      });
    }

    function uploadImages(files) {
      var token = localStorage.getItem('fa-auth-token');
      var batch = [];
      for (var i = 0; i < files.length && FORM.images.length < 5; i++) {
        (function (file) {
          batch.push(new Promise(function (resolve, reject) {
            var fd = new FormData();
            fd.append('file', file);
            fd.append('subdir', 'marketplace');
            fetch(BASE_URL + '/storage/upload', {
              method: 'POST',
              headers: token ? { 'Authorization': 'Bearer ' + token } : {},
              body: fd
            }).then(function (r) {
              return r.json().catch(function () { return {}; }).then(function (d) {
                if (!r.ok) {
                  var err = new Error((d && d.detail) || ('HTTP ' + r.status));
                  err.status = r.status;
                  reject(err);
                  return;
                }
                resolve(d && d.data && d.data.url);
              });
            }).catch(reject);
          }));
        })(files[i]);
      }
      return Promise.all(batch);
    }

    function submitListingForm(ev) {
      ev.preventDefault();
      var title = $('lb-title').value.trim();
      var cat = $('lb-cat').value;
      var qty = Number($('lb-qty').value);
      var price = Number($('lb-price').value);
      var type = $('lb-type').value === 'rent' ? 'rent' : 'sell';
      if (!title) return toast('Please enter a listing title.', 'error');
      if (!cat) return toast('Please select a category.', 'error');
      if (!(qty > 0)) return toast('Quantity must be greater than zero.', 'error');
      if (!(price > 0)) return toast('Price must be greater than zero.', 'error');

      var isItem = $('lb-group').value === 'items';
      var payload = {
        title: title,
        listing_type: type,
        category_id: cat,
        quantity: qty,
        unit: $('lb-unit').value,
        price: price,
        pricing_type: $('lb-pricing').value,
        location: $('lb-location').value.trim() || null,
        availability: type === 'rent' ? null : ($('lb-availability').value.trim() || null),
        harvest_date: type === 'rent' ? null : ($('lb-harvest').value.trim() || null),
        quality_grade: $('lb-quality').value.trim() || null,
        contact_method: $('lb-contact').value,
        description: $('lb-desc').value.trim() || null,
        images: FORM.images,
      };
      if (FORM.mode === 'create') payload.status = 'active';
      if (isItem) {
        payload.condition_type = $('lb-condition').value;
        payload.age_year = $('lb-age').value.trim() || null;
        payload.brand = $('lb-brand').value.trim() || null;
        payload.model = $('lb-model').value.trim() || null;
        payload.usage_details = $('lb-usage').value.trim() || null;
        payload.condition_detail = $('lb-condition-detail').value.trim() || null;
      }
      if (type === 'rent') {
        var period = $('lb-rental-period').value;
        var minDur = $('lb-rent-min').value.trim();
        var from = $('lb-rent-from').value;
        var delivery = $('lb-rent-delivery').value;
        if (!period) return toast('Select the rent price period.', 'error');
        if (!minDur) return toast('Enter the minimum rental period.', 'error');
        if (!from) return toast('Select the date the item is available from.', 'error');
        if (!delivery) return toast('Choose delivery or pickup.', 'error');
        var until = $('lb-rent-until').value;
        if (until && from && until < from) return toast('"Available until" must be on or after "Available from".', 'error');
        var deposit = $('lb-rent-deposit').value;
        payload.rental_period = period;
        payload.min_rental_duration = minDur;
        payload.available_from = from;
        payload.available_until = until || null;
        payload.security_deposit = (deposit === '' || isNaN(Number(deposit))) ? null : Number(deposit);
        payload.delivery_option = delivery;
        payload.service_area = $('lb-rent-area').value.trim() || null;
        payload.rental_terms = $('lb-rent-terms').value.trim() || null;
      } else {
        payload.rental_period = null;
        payload.min_rental_duration = null;
        payload.available_from = null;
        payload.available_until = null;
        payload.security_deposit = null;
        payload.delivery_option = null;
        payload.service_area = null;
        payload.rental_terms = null;
      }

      var btn = $('lb-submit');
      setBtn(btn, true, '<i class="fas fa-spinner fa-spin"></i> Saving…', '<i class="fas fa-check"></i> Save Listing');
      var req = FORM.mode === 'edit'
        ? SVC.updateListing(FORM.listing.id, payload)
        : SVC.createListing(payload);
      req.then(function () {
        toast(FORM.mode === 'edit' ? 'Listing updated.' : 'Listing created successfully!', 'success');
        closeSheet('ml-sheet-listing');
        load(true);
        refreshCount();
      }).catch(function (e) {
        toast(errMsg(e), 'error');
        setBtn(btn, false, '', '<i class="fas fa-check"></i> Save Listing');
      });
    }

    /* --------- Record / manage sale --------- */
    function openSaleForm(listing) {
      FORM.saleListing = listing;
      var rent = isRent(listing);
      var periodLabel = rent && listing.rental_period ? (' ' + (RENT_PERIOD_LABEL[listing.rental_period] || listing.rental_period)) : '';
      $('ml-sale-title').innerHTML = rent
        ? '<i class="fas fa-calendar-alt" style="color:var(--mp-green);margin-right:6px"></i>Record a rental'
        : '<i class="fas fa-check-circle" style="color:var(--mp-green);margin-right:6px"></i>Record a sale';
      var form = $('ml-sale-form');
      form.reset();
      var hint = $('ml-sale-hint');
      hint.style.display = '';
      hint.innerHTML = rent
        ? '<i class="fas fa-circle-info"></i><span>Recording a <b>Completed</b> rental closes <b>' + esc(listing.title) + '</b> for that period and reduces the units still available to rent.</span>'
        : '<i class="fas fa-circle-info"></i><span>Recording a <b>Completed</b> sale marks <b>' + esc(listing.title) + '</b> as sold and reduces your available stock.</span>';
      var remaining = Number(listing.remaining_quantity !== undefined ? listing.remaining_quantity : listing.quantity);
      $('sb-qty').value = remaining || '';
      $('sb-price').value = listing.price || '';
      $('sb-price-label').innerHTML = rent
        ? '<span class="req">*</span> Rent price per' + (listing.rental_period ? esc(RENT_PERIOD_LABEL[listing.rental_period] || listing.rental_period) : ' period') + ' (&#8377;)'
        : '<span class="req">*</span> Unit price (&#8377;)';
      $('sb-qty-label').innerHTML = rent ? '<span class="req">*</span> Units rented' : '<span class="req">*</span> Quantity';
      $('sb-submit').innerHTML = rent
        ? '<i class="fas fa-check"></i> Save Rental'
        : '<i class="fas fa-check"></i> Save Sale';
      $('sb-payment').value = 'pending';
      $('sb-status').value = 'completed';
      $('sb-delivery').value = listing.delivery_option === 'delivery' ? 'delivered' : listing.delivery_option === 'both' ? 'pickup' : 'pickup';
      $('sb-notes').value = '';
      if (periodLabel) $('sb-price').placeholder = 'e.g. 2000';
      openSheet('ml-sheet-sale');
    }

    function submitSaleForm(ev) {
      ev.preventDefault();
      var qty = Number($('sb-qty').value);
      var price = Number($('sb-price').value);
      if (!(qty > 0)) return toast('Quantity must be greater than zero.', 'error');
      if (!(price > 0)) return toast('Unit price must be greater than zero.', 'error');

      var payload = {
        buyer_name: $('sb-name').value.trim() || null,
        buyer_phone: $('sb-phone').value.trim() || null,
        quantity: qty,
        unit_price: price,
        payment_status: $('sb-payment').value,
        status: $('sb-status').value,
        delivery_status: $('sb-delivery').value,
        notes: $('sb-notes').value.trim() || null
      };

      var btn = $('sb-submit');
      setBtn(btn, true, '<i class="fas fa-spinner fa-spin"></i> Saving…', '<i class="fas fa-check"></i> Save Sale');
      SVC.recordSale(FORM.saleListing.id, payload).then(function () {
        toast('Sale recorded.');
        closeSheet('ml-sheet-sale');
        load(true);
        refreshCount();
      }).catch(function (e) {
        toast(errMsg(e), 'error');
        setBtn(btn, false, '', '<i class="fas fa-check"></i> Save Sale');
      });
    }

    /* --------- Listing activity (buyer enquiries + sale history) --------- */
    function openActivity(id) {
      FORM.activityId = id;
      var it = ITEMS.filter(function (x) { return x.id === id; })[0];
      $('ml-act-listing').innerHTML = '<i class="fas fa-box-open"></i><span>' + esc((it && it.title) || 'Listing') + ' — enquiries and sale history for this item.</span>';
      openSheet('ml-sheet-activity');
      loadActivity();
    }

    function loadActivity() {
      var id = FORM.activityId;
      if (!id || !SVC) return;
      var box = $('ml-act-enq');
      box.innerHTML = '<div class="mp-empty"><i class="fas fa-spinner fa-pulse"></i><h4>Loading activity…</h4></div>';
      Promise.all([
        SVC.listEnquiries({ page: 1, limit: 100 }),
        SVC.listSales({ page: 1, limit: 100 })
      ]).then(function (rs) {
        var enqs = ((rs[0] && rs[0].items) || []).filter(function (e) { return e.listing_id === id; });
        var sales = ((rs[1] && rs[1].items) || []).filter(function (s) { return s.listing_id === id; });
        $('ml-act-enq-count').textContent = enqs.length;
        $('ml-act-sale-count').textContent = sales.length;
        renderActivityEnqs(enqs);
        renderActivitySales(sales);
      }).catch(function (e) {
        box.innerHTML = '<div class="mp-grid-error"><i class="fas fa-plug-circle-xmark"></i><p>' + esc(errMsg(e)) + '</p></div>';
      });
    }

    function renderActivityEnqs(enqs) {
      var box = $('ml-act-enq');
      if (!enqs.length) {
        box.innerHTML = '<div class="mp-empty"><i class="fas fa-comments"></i><h4>No buyer enquiries</h4><p>Enquiries buyers send on this listing will appear here with the buyer, quantity and offered price.</p></div>';
        return;
      }
      box.innerHTML = enqs.map(function (en) {
        var buyer = en.buyer || {};
        var name = en.buyer_name || buyer.full_name || 'Buyer';
        var canReply = en.status !== 'rejected' && en.status !== 'completed' && en.status !== 'closed';
        var avatar = buyer.profile_image
          ? '<img src="' + esc(buyer.profile_image) + '" alt="">'
          : esc(initials(name));
        return '<div class="act-row">' +
          '<div class="act-avatar">' + avatar + '</div>' +
          '<div class="act-info">' +
          '<div class="t">' + esc(name) + '</div>' +
          '<div class="m">' + statusChip(en.status) +
          (en.requested_quantity ? '<span><i class="fas fa-boxes"></i> ' + esc(qtyFmt(en.requested_quantity, (en.listing && en.listing.unit) || '')) + '</span>' : '') +
          (en.offered_price ? '<span><i class="fas fa-hand-holding-dollar"></i> ' + fmtPrice(en.offered_price) + '</span>' : '') +
          (en.buyer_phone ? '<span><i class="fas fa-phone"></i> ' + esc(en.buyer_phone) + '</span>' : '') +
          '<span><i class="far fa-calendar"></i> ' + esc(timeAgo(en.created_at)) + '</span>' +
          '</div>' +
          '<div class="act-reply-box" id="act-reply-' + esc(en.id) + '" style="display:none">' +
          '<textarea placeholder="Write your reply here… It is sent through Messages." maxlength="4000"></textarea>' +
          '<div class="act-reply-btns">' +
          '<button type="button" class="mp-btn ghost" data-close-reply="' + esc(en.id) + '">Cancel</button>' +
          '<button type="button" class="mp-btn primary" data-send-reply="' + esc(en.id) + '" style="min-width:130px;justify-content:center"><i class="fas fa-paper-plane"></i> Send</button>' +
          '</div></div>' +
          '</div>' +
          '<div class="act-actions">' +
          '<button class="mp-link-btn" data-act-reply="' + esc(en.id) + '" style="' + (canReply ? '' : 'pointer-events:none;opacity:.4') + '"><i class="fas fa-reply"></i> Reply</button>' +
          '</div>' +
          '</div>';
      }).join('');
    }

    function renderActivitySales(sales) {
      var box = $('ml-act-sales');
      if (!sales.length) {
        box.innerHTML = '<div class="mp-empty"><i class="fas fa-chart-line"></i><h4>No sale records</h4><p>Sales recorded for this listing will appear here with status and amount.</p></div>';
        return;
      }
      box.innerHTML = sales.map(function (s) {
        return '<div class="act-row">' +
          '<div class="act-avatar"><i class="fas fa-sack-dollar"></i></div>' +
          '<div class="act-info">' +
          '<div class="t">' + esc(s.buyer_name || (s.buyer && s.buyer.full_name) || 'Buyer') + '</div>' +
          '<div class="m">' + statusChip(s.status) + statusChip(s.payment_status) + statusChip(s.delivery_status) +
          '<span><i class="fas fa-boxes"></i> ' + esc(qtyFmt(s.quantity, (s.listing && s.listing.unit) || '')) + '</span>' +
          '<span><i class="far fa-calendar"></i> ' + esc(timeAgo(s.sold_at || s.created_at)) + '</span>' +
          '</div>' +
          (s.notes ? '<div class="desc" style="background:var(--bg-card-soft);border:1px solid var(--border-light);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--text-secondary);margin-top:6px">' + esc(s.notes) + '</div>' : '') +
          '</div>' +
          '<div class="act-actions"><div class="sale-amount">' + fmtPrice(s.total_amount) + '</div></div>' +
          '</div>';
      }).join('');
    }

    function submitActivityReply(id) {
      if (!SVC || !id) return;
      var area = $('act-reply-' + id);
      var ta = area ? area.querySelector('textarea') : null;
      var msg = ta ? ta.value.trim() : '';
      if (!msg) return toast('Please write a reply first.', 'error');
      var btn = area ? area.querySelector('[data-send-reply]') : null;
      setBtn(btn, true, '<i class="fas fa-spinner fa-spin"></i> Sending…', '<i class="fas fa-paper-plane"></i> Send');
      SVC.replyEnquiry(id, msg).then(function () {
        toast('Reply sent through Messages.');
        loadActivity();
      }).catch(function (e) {
        toast(errMsg(e), 'error');
        setBtn(btn, false, '', '<i class="fas fa-paper-plane"></i> Send');
      });
    }

    function refreshCount() {
      if (!SVC) return;
      SVC.listListings({ page: 1, limit: 1 }).then(function (d) {
        $('count-label').textContent = d.total || 0;
        $('cnt-total').textContent = d.total || 0;
      }).catch(function () {});
    }

    /* --------- Filters --------- */
    function setActivePills(value) {
      document.querySelectorAll('#ml-pills .mp-pill').forEach(function (p) {
        p.classList.toggle('active', p.dataset.status === (value || ''));
      });
    }
    function setActiveTypePills(value) {
      document.querySelectorAll('#ml-type-pills .mp-pill').forEach(function (p) {
        p.classList.toggle('active', p.dataset.ltype === (value || ''));
      });
    }
    function openFilters() {
      $('mflt-group').value = FILTERS.group || '';
      $('mflt-cat').value = FILTERS.category || '';
      $('mflt-ltype').value = FILTERS.ltype || '';
      $('mflt-status').value = FILTERS.status || '';
      $('mflt-min').value = FILTERS.minPrice || '';
      $('mflt-max').value = FILTERS.maxPrice || '';
      $('mflt-loc').value = FILTERS.location || '';
      $('mflt-sort').value = FILTERS.sort || 'newest';
      openSheet('ml-sheet-filter');
    }
    function applyFilters(ev) {
      if (ev) ev.preventDefault();
      FILTERS.group = $('mflt-group').value;
      FILTERS.category = $('mflt-cat').value;
      FILTERS.ltype = $('mflt-ltype').value;
      FILTERS.status = $('mflt-status').value;
      FILTERS.minPrice = $('mflt-min').value;
      FILTERS.maxPrice = $('mflt-max').value;
      FILTERS.location = $('mflt-loc').value.trim();
      FILTERS.sort = $('mflt-sort').value;
      setActivePills(FILTERS.status);
      setActiveTypePills(FILTERS.ltype);
      closeSheet('ml-sheet-filter');
      page = 1;
      load(true);
    }
    function resetAllFilters() {
      FILTERS = { status: '', ltype: '', search: '', group: '', category: '', minPrice: '', maxPrice: '', location: '', sort: 'newest' };
      $('ml-search').value = '';
      setActivePills('');
      setActiveTypePills('');
      page = 1;
      load(true);
    }
    function fillCategories(d) {
      window._ML_CATS = d || { produce: [], items: [] };
      var opts = '<option value="">All categories</option>';
      (d.produce || []).concat(d.items || []).forEach(function (c) {
        opts += '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
      });
      $('mflt-cat').innerHTML = opts;
      updateCategoryOptions();
    }

    /* --------- Boot --------- */
    function applyQueryPresets() {
      try {
        var qs = new URLSearchParams(window.location.search);
        var st = (qs.get('status') || '').toLowerCase();
        if (['active', 'pending', 'paused', 'sold', 'expired', 'cancelled'].indexOf(st) !== -1) {
          FILTERS.status = st;
          setActivePills(st);
          $('mflt-status').value = st;
        }
        if (qs.get('create') === '1') {
          window.setTimeout(newListing, 80);
        }
      } catch (e) {}
    }
    function boot() {
      if (!window.UserStore || !UserStore.isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      applyQueryPresets();
      $('ml-search').addEventListener('keydown', function (e) { if (e.key === 'Enter') { FILTERS.search = this.value.trim(); page = 1; load(true); } });
      $('ml-filter-open').addEventListener('click', openFilters);
      $('ml-filter-form').addEventListener('submit', applyFilters);
      $('mflt-reset').addEventListener('click', function () {
        FILTERS = { status: '', ltype: '', search: '', group: '', category: '', minPrice: '', maxPrice: '', location: '', sort: 'newest' };
        $('ml-search').value = '';
        setActivePills('');
        setActiveTypePills('');
        closeSheet('ml-sheet-filter');
        page = 1;
        load(true);
      });
      $('ml-type-pills').addEventListener('click', function (e) {
        var pill = e.target.closest('.mp-pill');
        if (!pill) return;
        FILTERS.ltype = pill.dataset.ltype || '';
        setActiveTypePills(FILTERS.ltype);
        $('mflt-ltype').value = FILTERS.ltype;
        page = 1;
        load(true);
      });
      $('ml-pills').addEventListener('click', function (e) {
        var pill = e.target.closest('.mp-pill');
        if (!pill) return;
        FILTERS.status = pill.dataset.status || '';
        setActivePills(FILTERS.status);
        $('mflt-status').value = FILTERS.status;
        page = 1;
        load(true);
      });
      $('ml-grid').addEventListener('click', function (e) {
        var t = e.target.closest('.t');
        if (t) { onAction(t.dataset.id, 'view'); return; }
        var btn = e.target.closest('[data-act]');
        if (btn) onAction(btn.dataset.id, btn.dataset.act);
      });
      $('ml-sheet-detail').querySelector('[data-close-sheet]').addEventListener('click', function () { closeSheet('ml-sheet-detail'); });
      $('ml-detail-body').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]');
        if (btn) { closeSheet('ml-sheet-detail'); onAction(btn.dataset.id, btn.dataset.act); }
      });
      $('ml-more').addEventListener('click', function () { page += 1; load(false); });
      $('new-listing-2').addEventListener('click', newListing);
      $('ml-sheet-bg').addEventListener('click', closeAllSheets);
      document.querySelectorAll('[data-close-sheet]').forEach(function (b) {
        b.addEventListener('click', function () { closeSheet(b.dataset.closeSheet); });
      });

      // Listing form (create / edit)
      $('lb-group').addEventListener('change', updateCategoryOptions);
      $('lb-type-toggle').addEventListener('click', function (e) {
        var btn = e.target.closest('.ml-type-btn');
        if (btn) setListingType(btn.dataset.listingType);
      });
      $('lb-rental-period').addEventListener('change', function () {
        $('lb-price').placeholder = { day: 'e.g. 500 per day', week: 'e.g. 2000 per week', month: 'e.g. 6000 per month' }[this.value] || 'e.g. 2000';
      });
      $('lb-img-input').addEventListener('change', function () {
        var files = Array.prototype.slice.call(this.files || []);
        this.value = '';
        if (!files.length) return;
        uploadImages(files).then(function (urls) {
          urls.forEach(function (u) { if (u && FORM.images.length < 5) FORM.images.push(u); });
          renderFormImages();
        }).catch(function (e) { toast(errMsg(e) || 'Upload failed', 'error'); });
      });
      $('ml-listing-form').addEventListener('submit', submitListingForm);
      $('ml-sale-form').addEventListener('submit', submitSaleForm);

      // Activity sheet tab switching
      document.querySelectorAll('.act-tab').forEach(function (t) {
        t.addEventListener('click', function () {
          document.querySelectorAll('.act-tab').forEach(function (x) { x.classList.toggle('active', x === t); });
          var p = t.dataset.apanel;
          $('ml-act-enq').style.display = p === 'enquiries' ? '' : 'none';
          $('ml-act-sales').style.display = p === 'sales' ? '' : 'none';
        });
      });

      // Activity reply actions (delegated so re-rendered rows keep working)
      document.addEventListener('click', function (e) {
        var rep = e.target.closest('[data-act-reply]');
        if (rep) {
          var box = $('act-reply-' + rep.dataset.actReply);
          if (box) box.style.display = box.style.display === 'none' ? 'flex' : 'none';
          e.preventDefault();
          return;
        }
        var closeRep = e.target.closest('[data-close-reply]');
        if (closeRep) {
          var box2 = $('act-reply-' + closeRep.dataset.closeReply);
          if (box2) box2.style.display = 'none';
          e.preventDefault();
          return;
        }
        var sendRep = e.target.closest('[data-send-reply]');
        if (sendRep) {
          submitActivityReply(sendRep.dataset.sendReply);
          e.preventDefault();
        }
      });

      if (SVC) {
        SVC.categories().then(fillCategories).catch(function () {});
      }
      load(true);
      refreshCount();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
</html>
