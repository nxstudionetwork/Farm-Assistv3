<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="weather">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="api-base-url" content="/api/v1">
  <script>
    window._API_BASE_URL = '/api/v1';
  </script>
  <title>Farm Assist - Weather Forecast</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .stat-box { text-align: center; padding: 14px 10px; background: var(--card-bg, #f8f9fa); border-radius: 10px; border: 1px solid var(--border-color, #e9ecef); }
    .stat-box .stat-icon { font-size: 22px; margin-bottom: 6px; }
    .stat-box .stat-value { font-size: 18px; font-weight: 700; }
    .stat-box .stat-label { font-size: 11px; color: var(--text-muted, #6c757d); margin-top: 2px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .badge-warning { background: #fff3cd; color: #856404; }
    .badge-danger { background: #f8d7da; color: #721c24; }
    .badge-info { background: #d1ecf1; color: #0c5460; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-secondary { background: #e2e3e5; color: #383d41; }
    .badge-orange { background: #ffe5cc; color: #a04400; }
    .btn-primary { display: inline-block; padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: #1f7a4c; color: #fff; }
    .btn-secondary { display: inline-block; padding: 8px 18px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: #e9ecef; color: #495057; }
    .btn-sm { padding: 5px 12px; font-size: 11px; }
    .btn-primary:hover { opacity: 0.9; }
    .forecast-card { background: var(--card-bg, #fff); border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid var(--border-color, #e9ecef); }
    .forecast-card .day-name { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .forecast-card .day-icon { font-size: 24px; margin-bottom: 6px; }
    .forecast-card .day-temp { font-size: 15px; font-weight: 700; }
    .forecast-card .day-condition { font-size: 10px; color: var(--text-muted, #6c757d); margin-top: 2px; }
    .forecast-card .day-rain { font-size: 11px; margin-top: 4px; }
    .forecast-card .day-wind { font-size: 10px; color: var(--text-muted, #6c757d); margin-top: 2px; }
    .alert-strip { display: flex; align-items: flex-start; padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid; gap: 10px; }
    .alert-strip.warning { background: #fffbe6; }
    .alert-strip.info { background: #e8f4f8; }
    .alert-strip.danger { background: #fde8e8; }
    .alert-strip.success { background: #e6f7e6; }
    .alert-content { flex: 1; }
    .alert-content strong { font-size: 13px; }
    .alert-content div { font-size: 12px; color: var(--text-secondary, #6c757d); margin-top: 2px; line-height: 1.4; }
    .feature-card { background: var(--card-bg, #fff); border-radius: 10px; padding: 16px; border: 1px solid var(--border-color, #e9ecef); }
    .sunrise-set { display: flex; justify-content: space-around; padding: 10px 0; }
    .sunrise-set > div { text-align: center; }
    .sunrise-set i { font-size: 28px; margin-bottom: 6px; }
    .sunrise-set .time { font-size: 16px; font-weight: 700; }
    .sunrise-set .label { font-size: 11px; color: var(--text-muted, #6c757d); }
    .weather-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .weather-status { width: 100%; margin: 0 0 12px; }
    .section-title { font-size: 16px; margin-bottom: 14px; }
    .forecast-hidden { display: none !important; }
    .weather-empty { text-align: center; padding: 20px 16px; color: var(--text-muted, #6c757d); font-size: 13px; }
    .weather-empty i { font-size: 28px; margin-bottom: 8px; display: block; opacity: 0.5; }

    /* Responsive Layout - 2-column grid on desktop/tablet, single-column on mobile */
    @media (min-width: 769px) {
      .weather-content-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }

    @media (max-width: 768px) {
      .weather-content-grid {
        display: block;
      }
      .grid-2 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .weather-actions { width: 100%; }
    }

    @media (max-width: 480px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .forecast-card { padding: 10px 6px; }
      .forecast-card .day-icon { font-size: 20px; }
    }

    @media (max-width: 340px) {
      .forecast-card { padding: 8px 4px; }
      .forecast-card .day-icon { font-size: 18px; }
      .stat-box { padding: 10px 6px; }
      .stat-box .stat-value { font-size: 16px; }
    }
  </style>
</head>
<body>

  <main class="page-container">

    <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <h1><i class="fas fa-cloud-sun"></i> Weather Forecast</h1>
      <div class="weather-actions">
        <button class="btn-secondary btn-sm" id="btn-use-location" type="button"><i class="fas fa-location-crosshairs"></i> Use my location</button>
        <button class="btn-primary btn-sm" id="btn-refresh-weather" type="button"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
    </div>

    <div class="weather-content-grid">
      <!-- Left Column: Current Weather & Forecast -->
      <div>
        <!-- Current Weather -->
        <section class="card-premium" style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            <h2 style="font-size:16px; margin:0;" id="weather-location-label">Your Area Weather</h2>
            <span style="font-size:11px; color:var(--text-muted, #6c757d);" id="weather-updated-label">Loading...</span>
          </div>
          <div id="weather-status" class="weather-status" aria-live="polite"></div>

          <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:16px;">
            <i class="fas fa-cloud-sun-rain" style="font-size:52px;" id="weather-main-icon"></i>
            <div>
              <div class="weather-temp" style="font-size:40px;" id="weather-temp">--&deg;C</div>
              <div style="font-size:14px; font-weight:500;" id="weather-condition">Loading...</div>
            </div>
          </div>

          <div class="grid-4" style="margin-bottom:4px;">
            <div class="stat-box">
              <div class="stat-icon"><i class="fas fa-thermometer-half"></i></div>
              <div class="stat-value" id="stat-feels-like">--&deg;C</div>
              <div class="stat-label">Feels Like</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon"><i class="fas fa-tint"></i></div>
              <div class="stat-value" id="stat-humidity">--%</div>
              <div class="stat-label">Humidity</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon"><i class="fas fa-wind"></i></div>
              <div class="stat-value" id="stat-wind">-- km/h</div>
              <div class="stat-label">Wind Speed</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon"><i class="fas fa-location-arrow"></i></div>
              <div class="stat-value" id="stat-wind-dir">--</div>
              <div class="stat-label">Wind Direction</div>
            </div>
          </div>

          <div class="grid-2" style="margin-top:6px;">
            <div class="stat-box">
              <div class="stat-icon" style="color:#e67e22;"><i class="fas fa-sunrise"></i></div>
              <div class="stat-value" id="stat-sunrise">--:--</div>
              <div class="stat-label">Sunrise</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon" style="color:#e74c3c;"><i class="fas fa-sunset"></i></div>
              <div class="stat-value" id="stat-sunset">--:--</div>
              <div class="stat-label">Sunset</div>
            </div>
          </div>
        </section>

        <!-- 7-Day + 14-Day Forecast -->
        <section class="card-premium" style="margin-bottom:16px;">
          <h3 class="section-title"><i class="fas fa-calendar-alt" style="color:var(--premium-green, #1f7a4c); margin-right:8px;"></i> Multi-Day Forecast</h3>
          <div id="forecast-grid" class="grid-4"></div>
          <div id="forecast-grid-extra" class="grid-4" style="margin-top:12px;"></div>
          <div style="text-align:center; margin-top:12px;">
            <button class="btn-primary btn-sm" id="btn-show-14" onclick="window.toggle14Day()"><i class="fas fa-chevron-down"></i> Show 14-Day Forecast</button>
          </div>
        </section>
      </div>

      <!-- Right Column: Alerts & Advice -->
      <div>
        <!-- Weather Alerts -->
        <section class="card-premium" style="margin-bottom:16px;">
          <h3 class="section-title"><i class="fas fa-exclamation-triangle" style="color:var(--danger, #e74c3c); margin-right:8px;"></i> Weather Alerts</h3>
          <div id="weather-alerts-container"></div>
        </section>

        <!-- Farming Advice -->
        <section class="card-premium" style="margin-bottom:16px;">
          <h3 class="section-title"><i class="fas fa-leaf" style="color:var(--premium-green, #1f7a4c); margin-right:8px;"></i> Farming Advice</h3>
          <div id="farming-advice-container"></div>
        </section>
      </div>
    </div>

  </main>

  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (function () {
    'use strict';

    var weatherData = {
      current: null,
      alerts: [],
      advice: [],
      forecast: [],
      locationLabel: 'Your Area',
      isLoading: true,
      error: null
    };

    function wmoIcon(code) {
      if (code === 0) return 'fa-sun';
      if (code === 1 || code === 2) return 'fa-cloud-sun';
      if (code === 3) return 'fa-cloud';
      if (code === 45 || code === 48) return 'fa-smog';
      if (code >= 51 && code <= 57) return 'fa-cloud-rain';
      if (code >= 61 && code <= 67) return 'fa-cloud-showers-heavy';
      if (code >= 71 && code <= 77) return 'fa-snowflake';
      if (code >= 80 && code <= 82) return 'fa-cloud-showers-heavy';
      if (code >= 95) return 'fa-bolt';
      return 'fa-cloud-sun';
    }

    function wmoCondition(code) {
      if (code === 0) return 'Clear Sky';
      if (code === 1) return 'Mainly Clear';
      if (code === 2) return 'Partly Cloudy';
      if (code === 3) return 'Overcast';
      if (code === 45 || code === 48) return 'Foggy';
      if (code >= 51 && code <= 57) return 'Drizzle';
      if (code >= 61 && code <= 67) return 'Rain';
      if (code >= 71 && code <= 77) return 'Snow';
      if (code >= 80 && code <= 82) return 'Rain Showers';
      if (code >= 95) return 'Thunderstorm';
      return 'Partly Cloudy';
    }

    function getFallbackCoords() {
      return { lat: null, lon: null };
    }

    function getCoords() {
      return new Promise(function (resolve) {
        // First check if user has manually provided coordinates via location button
        if (window.weatherCoords && window.weatherCoords.lat && window.weatherCoords.lon) {
          resolve(window.weatherCoords);
          return;
        }

        // Try geolocation
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function (pos) {
            resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude });
          }, function () {
            // Return null to let backend use saved farm location
            resolve({ lat: null, lon: null });
          }, { timeout: 10000 });
        } else {
          // Return null to let backend use saved farm location
          resolve({ lat: null, lon: null });
        }
      });
    }

    function loadLiveWeather() {
      if (!window.API) {
        showError('Weather service not available');
        return Promise.resolve(false);
      }

      setLoading(true);
      clearError();

      return getCoords().then(function (coords) {
        // Build API request with or without coordinates
        var currentPromise, forecastPromise;

        if (coords.lat !== null && coords.lon !== null) {
          currentPromise = window.API.Weather.getCurrent(coords.lat, coords.lon);
          forecastPromise = window.API.Weather.getForecast(coords.lat, coords.lon);
        } else {
          // Let backend use saved farm location
          currentPromise = window.API.Weather.getCurrent();
          forecastPromise = window.API.Weather.getForecast();
        }

        return Promise.all([currentPromise, forecastPromise]).then(function (results) {
          var current = results[0];
          var forecastData = results[1];

          if (current && typeof current.temperature === 'number') {
            weatherData.current = {
              temperature: current.temperature,
              feels_like: typeof current.feels_like === 'number' ? current.feels_like : current.temperature,
              humidity: current.humidity,
              wind_speed: current.wind_speed,
              rain: current.rain,
              weather_code: current.weather_code,
              description: current.description || current.weather_condition || wmoCondition(current.weather_code),
              wind_dir: current.wind_direction || current.wind_dir || '--',
              sunrise: formatTime(current.sunrise),
              sunset: formatTime(current.sunset)
            };
            weatherData.locationLabel = current.location_label || 'Your Area';
          }

          if (forecastData && forecastData.forecast && forecastData.forecast.length) {
            weatherData.forecast = forecastData.forecast.map(function (f, i) {
              var d = new Date((f.date || '').replace(/-/g, '/'));
              if (isNaN(d.getTime())) d = new Date(Date.now() + i * 86400000);
              var code = f.weather_code;
              return {
                day: dayName(i),
                icon: wmoIcon(code),
                tempHigh: Math.round(f.temperature_max || 0),
                tempLow: Math.round(f.temperature_min || 0),
                condition: f.description || f.weather_condition || wmoCondition(code),
                rainProb: Math.round(f.precipitation_probability || 0) || 0,
                windSpeed: Math.round(f.wind_speed || 0),
                windDir: f.wind_direction || '--'
              };
            });
          }

          if (current && (current.alerts || current.advice)) {
            weatherData.alerts = (current.alerts || []).map(normalizeAlert);
            weatherData.advice = (current.advice || []).map(normalizeAdvice);
          }

          weatherData.isLoading = false;
          return true;
        }).catch(function (error) {
          console.error('Weather loading error:', error);
          showError('Unable to load weather data. Please try again.');
          weatherData.isLoading = false;
          return false;
        });
      }).catch(function (error) {
        console.error('Location error:', error);
        showError('Unable to get your location. Please set your farm location in profile.');
        weatherData.isLoading = false;
        return false;
      });
    }

    function formatTime(timestamp) {
      if (!timestamp) return '--:--';
      var date = new Date(timestamp);
      if (isNaN(date.getTime())) return '--:--';
      var hours = date.getHours();
      var minutes = date.getMinutes();
      return (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
    }

    function setLoading(loading) {
      weatherData.isLoading = loading;
      var statusEl = document.getElementById('weather-status');
      if (statusEl) {
        if (loading) {
          statusEl.innerHTML = '<div class="weather-empty"><i class="fas fa-spinner fa-spin"></i><div>Loading weather data...</div></div>';
        } else {
          statusEl.innerHTML = '';
        }
      }
    }

    function showError(message) {
      weatherData.error = message;
      var statusEl = document.getElementById('weather-status');
      if (statusEl) {
        statusEl.innerHTML = '<div class="weather-empty" style="color: var(--danger, #e74c3c);"><i class="fas fa-exclamation-circle"></i><div>' + message + '</div></div>';
      }
    }

    function clearError() {
      weatherData.error = null;
    }

    function normalizeAlert(a) {
      var severityMap = {
        'danger': 'danger',
        'warning': 'warning',
        'info': 'info',
        'success': 'success'
      };
      var iconMap = {
        'danger': 'fa-exclamation-triangle',
        'warning': 'fa-exclamation-circle',
        'info': 'fa-info-circle',
        'success': 'fa-check-circle'
      };
      var badgeClassMap = {
        'danger': 'badge-danger',
        'warning': 'badge-warning',
        'info': 'badge-info',
        'success': 'badge-success'
      };
      return {
        type: severityMap[a.severity] || 'warning',
        icon: iconMap[a.severity] || 'fa-exclamation-triangle',
        title: a.title || 'Weather Alert',
        detail: a.detail || a.description || '',
        badge: a.badge || 'Active',
        badgeClass: badgeClassMap[a.severity] || 'badge-warning',
        period: a.period || '',
        action: a.action || ''
      };
    }

    function normalizeAdvice(a) {
      var typeMap = {
        'warning': 'warning',
        'danger': 'danger',
        'info': 'info',
        'success': 'success'
      };
      var iconMap = {
        'warning': 'fa-exclamation-triangle',
        'danger': 'fa-exclamation-circle',
        'info': 'fa-info-circle',
        'success': 'fa-check-circle'
      };
      return {
        type: typeMap[a.type] || 'info',
        icon: iconMap[a.type] || 'fa-info-circle',
        title: a.title || 'Farm Advisory',
        detail: a.detail || a.description || '',
        category: a.category || ''
      };
    }

    function dayName(dateOffset) {
      var d = new Date();
      d.setDate(d.getDate() + dateOffset);
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (d.getTime() === today.getTime()) return 'Today';
      if (d.getTime() === tomorrow.getTime()) return 'Tomorrow';
      var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      return days[d.getDay()];
    }

    function getUserDistrict() {
      try {
        if (typeof UserStore !== 'undefined' && UserStore.getCurrentUser) {
          var user = UserStore.getCurrentUser();
          if (user && user.district) return user.district;
        }
      } catch (e) {}
      return null;
    }

    function updateCurrentWeather() {
      var d = weatherData.current;
      var el = document.getElementById('weather-location-label');
      var district = getUserDistrict();
      if (el) el.textContent = (weatherData.locationLabel || district || 'Your Area') + ' Weather';

      var tempEl = document.getElementById('weather-temp');
      var condEl = document.getElementById('weather-condition');
      var iconEl = document.getElementById('weather-main-icon');

      if (weatherData.isLoading) {
        if (tempEl) tempEl.textContent = '--\u00b0C';
        if (condEl) condEl.textContent = 'Loading...';
        return;
      }

      if (weatherData.error) {
        if (tempEl) tempEl.textContent = '--\u00b0C';
        if (condEl) condEl.textContent = 'Weather unavailable';
        return;
      }

      if (!d) {
        if (tempEl) tempEl.textContent = '--\u00b0C';
        if (condEl) condEl.textContent = 'No data available';
        return;
      }

      if (tempEl) tempEl.textContent = Math.round(d.temperature) + '\u00b0C';
      if (condEl) condEl.textContent = d.description;
      if (iconEl) {
        iconEl.className = 'fas ' + wmoIcon(d.weather_code);
        iconEl.style.fontSize = '52px';
      }

      var feelsEl = document.getElementById('stat-feels-like');
      var humEl = document.getElementById('stat-humidity');
      var windEl = document.getElementById('stat-wind');
      var dirEl = document.getElementById('stat-wind-dir');
      var sunriseEl = document.getElementById('stat-sunrise');
      var sunsetEl = document.getElementById('stat-sunset');

      if (feelsEl) feelsEl.textContent = Math.round(d.feels_like) + '\u00b0C';
      if (humEl) humEl.textContent = Math.round(d.humidity) + '%';
      if (windEl) windEl.textContent = Math.round(d.wind_speed) + ' km/h';
      if (dirEl) dirEl.textContent = d.wind_dir;
      if (sunriseEl) sunriseEl.textContent = d.sunrise;
      if (sunsetEl) sunsetEl.textContent = d.sunset;

      var updateEl = document.getElementById('weather-updated-label');
      if (updateEl) {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        updateEl.textContent = 'Updated ' + (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      }
    }

    function buildForecastCard(item, idx) {
      var rainColor = item.rainProb > 50 ? '#e74c3c' : item.rainProb > 20 ? '#e67e22' : '#6c757d';
      return '<div class="forecast-card">' +
        '<div class="day-name">' + item.day + '</div>' +
        '<div class="day-icon"><i class="fas ' + item.icon + '"></i></div>' +
        '<div class="day-temp">' + item.tempHigh + '\u00b0 / ' + item.tempLow + '\u00b0</div>' +
        '<div class="day-condition">' + item.condition + '</div>' +
        '<div class="day-rain" style="color:' + rainColor + ';"><i class="fas fa-umbrella"></i> ' + item.rainProb + '%</div>' +
        '<div class="day-wind"><i class="fas fa-wind"></i> ' + item.windSpeed + ' km/h</div>' +
        '</div>';
    }

    function renderForecast() {
      var container = document.getElementById('forecast-grid');
      var extraContainer = document.getElementById('forecast-grid-extra');
      if (!container) return;

      if (weatherData.isLoading) {
        container.innerHTML = '<div class="weather-empty" style="grid-column: 1/-1;"><i class="fas fa-spinner fa-spin"></i><div>Loading forecast...</div></div>';
        if (extraContainer) extraContainer.innerHTML = '';
        return;
      }

      if (weatherData.error) {
        container.innerHTML = '<div class="weather-empty" style="grid-column: 1/-1;"><i class="fas fa-exclamation-circle"></i><div>Unable to load forecast</div></div>';
        if (extraContainer) extraContainer.innerHTML = '';
        return;
      }

      if (!weatherData.forecast || weatherData.forecast.length === 0) {
        container.innerHTML = '<div class="weather-empty" style="grid-column: 1/-1;"><i class="fas fa-calendar-times"></i><div>No forecast data available</div></div>';
        if (extraContainer) extraContainer.innerHTML = '';
        return;
      }

      var html = '';
      var extraHtml = '';
      for (var i = 0; i < weatherData.forecast.length; i++) {
        var item = weatherData.forecast[i];
        if (i < 7) {
          html = html + buildForecastCard(item, i);
        } else {
          extraHtml = extraHtml + buildForecastCard(item, i);
        }
      }
      container.innerHTML = html;
      extraContainer.innerHTML = extraHtml;
      extraContainer.style.display = 'none';
    }

    window.toggle14Day = function () {
      var extra = document.getElementById('forecast-grid-extra');
      var btn = document.getElementById('btn-show-14');
      if (!extra || !btn) return;
      if (extra.style.display === 'none' || extra.style.display === '') {
        extra.style.display = 'grid';
        btn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide 14-Day Forecast';
      } else {
        extra.style.display = 'none';
        btn.innerHTML = '<i class="fas fa-chevron-down"></i> Show 14-Day Forecast';
      }
    };

    function renderFarmingAdvice() {
      var container = document.getElementById('farming-advice-container');
      if (!container) return;

      if (weatherData.isLoading) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-spinner fa-spin"></i><div>Loading farming advice...</div></div>';
        return;
      }

      if (weatherData.error) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-exclamation-circle"></i><div>Unable to load farming advice</div></div>';
        return;
      }

      if (!weatherData.advice || weatherData.advice.length === 0) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-leaf"></i><div>No farming advice available right now. Advice appears based on current weather conditions.</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < weatherData.advice.length; i++) {
        var a = weatherData.advice[i];
        var categoryLabel = a.category ? '<span class="badge badge-secondary" style="margin-left:8px;">' + a.category + '</span>' : '';
        html = html + '<div class="alert-strip ' + a.type + '">' +
          '<i class="fas ' + a.icon + '" style="font-size:16px; margin-top:2px;"></i>' +
          '<div class="alert-content">' +
          '<strong>' + a.title + categoryLabel + '</strong>' +
          '<div>' + a.detail + '</div>' +
          '</div>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    function renderAlerts() {
      var container = document.getElementById('weather-alerts-container');
      if (!container) return;

      if (weatherData.isLoading) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-spinner fa-spin"></i><div>Loading weather alerts...</div></div>';
        return;
      }

      if (weatherData.error) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-exclamation-circle"></i><div>Unable to load weather alerts</div></div>';
        return;
      }

      if (!weatherData.alerts || weatherData.alerts.length === 0) {
        container.innerHTML = '<div class="weather-empty"><i class="fas fa-shield-halved"></i><div>No weather alerts for your area. We\'ll notify you when conditions change.</div></div>';
        return;
      }

      var html = '';
      for (var i = 0; i < weatherData.alerts.length; i++) {
        var a = weatherData.alerts[i];
        var periodLabel = a.period ? '<div style="font-size:11px; color:var(--text-muted); margin-top:4px;"><i class="fas fa-clock"></i> ' + a.period + '</div>' : '';
        var actionLabel = a.action ? '<div style="font-size:11px; color:var(--text-muted); margin-top:2px;"><i class="fas fa-check-circle"></i> ' + a.action + '</div>' : '';
        html = html + '<div class="alert-strip ' + a.type + '">' +
          '<i class="fas ' + a.icon + '" style="font-size:18px; margin-top:2px;"></i>' +
          '<div class="alert-content">' +
          '<strong>' + a.title + '</strong>' +
          '<div>' + a.detail + '</div>' +
          periodLabel +
          actionLabel +
          '</div>' +
          '<span class="badge ' + a.badgeClass + '" style="white-space:nowrap;">' + a.badge + '</span>' +
          '</div>';
      }
      container.innerHTML = html;
    }

    function initWeather() {
      // Set up event listeners
      var refreshBtn = document.getElementById('btn-refresh-weather');
      var locationBtn = document.getElementById('btn-use-location');

      if (refreshBtn) {
        refreshBtn.addEventListener('click', function() {
          loadLiveWeather().then(function (loaded) {
            if (loaded) {
              updateCurrentWeather();
              renderForecast();
              renderFarmingAdvice();
              renderAlerts();
            }
          });
        });
      }

      if (locationBtn) {
        locationBtn.addEventListener('click', function() {
          if (navigator.geolocation) {
            locationBtn.disabled = true;
            locationBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting location...';
            navigator.geolocation.getCurrentPosition(function (pos) {
              // Force refresh with new coordinates
              window.weatherCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
              loadLiveWeather().then(function (loaded) {
                locationBtn.disabled = false;
                locationBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Use my location';
                if (loaded) {
                  updateCurrentWeather();
                  renderForecast();
                  renderFarmingAdvice();
                  renderAlerts();
                }
              });
            }, function (error) {
              locationBtn.disabled = false;
              locationBtn.innerHTML = '<i class="fas fa-location-crosshairs"></i> Use my location';
              showError('Unable to get your location. Please enable location services.');
            }, { timeout: 10000 });
          } else {
            showError('Geolocation not supported by your browser');
          }
        });
      }

      // Initial load
      updateCurrentWeather();
      renderForecast();
      renderFarmingAdvice();
      renderAlerts();
      loadLiveWeather().then(function (loaded) {
        if (loaded) {
          updateCurrentWeather();
          renderForecast();
          renderFarmingAdvice();
          renderAlerts();
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWeather);
    } else {
      initWeather();
    }

  })();
  </script>
</body>
</html>
