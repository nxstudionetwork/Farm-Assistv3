<!DOCTYPE html>
<html><head><title>Self Test</title></head>
<body><div id="log"></div>
<script>
(function(){
var log = document.getElementById('log');
function add(msg, cls){ var d=document.createElement('div'); d.style.cssText='font:13px monospace;padding:3px 0;color:'+(cls||'inherit')+';'; d.textContent=msg; log.appendChild(d); }
window.onerror = function(msg, src, line, col, err){ add('ERROR: '+msg+' ('+src+':'+line+':'+col+')','red'); return false; };
window.onunhandledrejection = function(e){ add('UNHANDLED REJECTION: '+(e&&e.reason),'red'); };
add('loading login...');
fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone_number:'9849912345',password:'1234'})})
.then(function(r){return r.json().then(function(d){return{status:r.status,body:d}})})
.then(function(res){
  add('login status: '+res.status);
  var data = res.body&&res.body.data?res.body.data:res.body;
  var t=data&&data.access_token;
  if(!t){ add('NO TOKEN - '+JSON.stringify(res.body),'orange'); return; }
  add('got token: '+t.substring(0,12)+'...');
  var user=data.user||{};
  localStorage.setItem('fa-auth-token',t);
  localStorage.setItem('fa-current-user-data',JSON.stringify(user));
  localStorage.setItem('fa-auth','true');
  localStorage.setItem('user-logged-in','true');
  localStorage.setItem('user-name',user.full_name||'Farmer');
  localStorage.setItem('user-role',user.role||'farmer');
  add('token stored, redirecting to insurance.html');
  setTimeout(function(){window.location.href='insurance.html';},150);
})
.catch(function(e){add('FETCH ERROR: '+e,'red');});
})();
</script>
</body></html>
