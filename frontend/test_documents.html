<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="http://localhost:8000/api/v1">
  <script>
    window._API_BASE_URL = 'http://localhost:8000/api/v1';
  </script>
  <title>Test Documents Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .test-container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .test-title { font-size: 24px; font-weight: bold; color: #1b5e3d; }
    .test-actions { display: flex; gap: 10px; }
    .test-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .test-btn-primary { background: #1b5e3d; color: white; }
    .test-btn-secondary { background: #e0e0e0; color: #333; }
    .test-status { margin: 15px 0; padding: 10px; border-radius: 6px; font-size: 14px; }
    .test-status.success { background: #d4edda; color: #155724; }
    .test-status.error { background: #f8d7da; color: #721c24; }
    .test-status.info { background: #d1ecf1; color: #0c5460; }
    .test-log { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; margin-top: 20px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .test-iframe { width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <div class="test-title">📄 Documents Page Test</div>
      <div class="test-actions">
        <button class="test-btn test-btn-secondary" onclick="clearLog()">Clear Log</button>
        <button class="test-btn test-btn-primary" onclick="loadDocuments()">Load Documents</button>
      </div>
    </div>
    
    <div id="test-status" class="test-status info">Ready to test. Click "Load Documents" to begin.</div>
    
    <div class="test-log" id="test-log">
      <div>Test log will appear here...</div>
    </div>
    
    <iframe id="documents-frame" class="test-iframe" src="documents.html"></iframe>
  </div>

  <script src="js/services.js"></script>
  <script>
    function log(message, type = 'info') {
      const logDiv = document.getElementById('test-log');
      const timestamp = new Date().toLocaleTimeString();
      const color = type === 'error' ? '#721c24' : type === 'success' ? '#155724' : '#0c5460';
      logDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setStatus(message, type = 'info') {
      const statusDiv = document.getElementById('test-status');
      statusDiv.className = `test-status ${type}`;
      statusDiv.textContent = message;
    }

    function clearLog() {
      document.getElementById('test-log').innerHTML = '<div>Test log cleared.</div>';
    }

    async function loadDocuments() {
      log('Starting document load test...', 'info');
      setStatus('Loading documents...', 'info');

      try {
        // Check if API is available
        if (!window.API || !window.API.Documents) {
          throw new Error('API service not available');
        }

        log('API service found', 'success');

        // Check authentication
        const token = localStorage.getItem('fa-auth-token');
        if (!token) {
          log('No auth token found. Creating test user...', 'info');
          
          // Try to register a test user
          try {
            const testUser = {
              full_name: 'Test Farmer',
              phone_number: '9876543210',
              email: 'test@farmassist.com',
              password: 'Test123456',
              pin: '1234'
            };
            
            log('Attempting to register test user...', 'info');
            await window.API.Auth.register(testUser);
            log('Test user registered successfully', 'success');
            
            // Now login
            log('Attempting to login...', 'info');
            const loginResult = await window.API.Auth.login({
              phone_number: '9876543210',
              password: 'Test123456'
            });
            log('Login successful', 'success');
          } catch (authError) {
            log(`Auth error: ${authError.message}`, 'error');
            // Try login directly if registration failed (user might exist)
            try {
              log('Trying direct login...', 'info');
              await window.API.Auth.login({
                phone_number: '9876543210',
                password: 'Test123456'
              });
              log('Login successful', 'success');
            } catch (loginError) {
              throw new Error(`Login failed: ${loginError.message}`);
            }
          }
        } else {
          log('Auth token found', 'success');
        }

        // Load documents
        log('Fetching documents from API...', 'info');
        const response = await window.API.Documents.list();
        
        if (response && response.data) {
          const docs = response.data.items || [];
          log(`Successfully loaded ${docs.length} documents`, 'success');
          log(`Total storage used: ${response.data.total_size_mb || 0} MB`, 'info');
          setStatus(`Loaded ${docs.length} documents successfully`, 'success');
          
          if (docs.length === 0) {
            log('No documents found. This is expected for a new user.', 'info');
          } else {
            docs.forEach((doc, index) => {
              log(`Document ${index + 1}: ${doc.document_name} (${doc.file_type})`, 'info');
            });
          }
        } else {
          throw new Error('Invalid response format');
        }

      } catch (error) {
        log(`Error: ${error.message}`, 'error');
        setStatus(`Error: ${error.message}`, 'error');
        console.error('Test error:', error);
      }
    }

    // Auto-run on load
    window.addEventListener('load', function() {
      log('Test page loaded', 'success');
      log('Backend should be running on http://localhost:8000', 'info');
      log('Click "Load Documents" to test the API', 'info');
    });
  </script>
</body>
</html>
