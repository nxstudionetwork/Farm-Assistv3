<!DOCTYPE html>
<html lang="en" data-theme="light" data-page="news">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Assist - News Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .news-hero {
      background: linear-gradient(135deg, #0F2E1E 0%, #1B5E3F 60%, #40916C 100%);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      color: white;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .news-hero::after {
      content: '\f1ea';
      font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; right: -10px; bottom: -20px; font-size: 120px; opacity: 0.07;
    }
    .news-hero h2 { color: white; font-size: 20px; margin: 0; }
    .news-hero p { font-size: 12px; opacity: 0.85; margin: 4px 0 0 0; }
    
    .news-search-wrap {
      position: relative; margin-bottom: 14px;
    }
    .news-search-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 14px;
    }
    .news-search {
      width: 100%; padding: 11px 14px 11px 38px;
      border: 1px solid var(--border-light); border-radius: var(--radius-md);
      background: white; font-size: 13px; transition: all 0.2s;
    }
    .news-search:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(45,106,79,0.08); }
    
    .category-chips { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
    .category-chips::-webkit-scrollbar { display: none; }
    .category-chip {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-light);
      background: white; color: var(--text-secondary); font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .category-chip:hover, .category-chip.active { background: var(--primary-green); color: white; border-color: var(--primary-green); }
    
    .news-count { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; padding-left: 4px; }
    
    .news-card {
      background: white; border: 1px solid var(--border-light); border-radius: var(--radius-lg);
      padding: 0; margin-bottom: 12px; cursor: pointer; transition: all 0.25s;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .news-card:hover { box-shadow: var(--shadow-md); border-color: var(--medium-green); transform: translateY(-2px); }
    
    .news-image {
      height: 140px; background: var(--soft-green); display: flex; align-items: center; justify-content: center;
      color: var(--primary-green); font-size: 32px; position: relative;
    }
    .news-badge {
      position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 12px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; color: white;
    }
    .news-badge.technology { background: #1565C0; }
    .news-badge.market { background: #2E7D32; }
    .news-badge.government { background: #C62828; }
    .news-badge.weather { background: #0097A7; }
    .news-badge.agri { background: #F57C00; }
    
    .news-content { padding: 14px; }
    .news-source { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
    .news-source img { width: 16px; height: 16px; border-radius: 50%; }
    .news-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .news-excerpt { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .news-meta { display: flex; gap: 12px; font-size: 10px; color: var(--text-muted); align-items: center; }
    .news-meta i { color: var(--medium-green); margin-right: 3px; }
    
    .featured-news {
      background: linear-gradient(135deg, #1B5E3F 0%, #2D8659 100%); border-radius: var(--radius-xl);
      padding: 16px; margin-bottom: 16px; color: white; position: relative; overflow: hidden;
    }
    .featured-news::before {
      content: '\f0e7'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; right: -10px; top: -20px; font-size: 80px; opacity: 0.1;
    }
    .featured-label {
      background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 8px;
    }
    .featured-news h3 { font-size: 16px; margin-bottom: 6px; line-height: 1.4; }
    .featured-news p { font-size: 12px; opacity: 0.9; margin-bottom: 10px; line-height: 1.5; }
    .featured-news .news-meta { color: rgba(255,255,255,0.8); }
    .featured-news .news-meta i { color: rgba(255,255,255,0.9); }
    
    .empty-news { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-news i { font-size: 48px; opacity: 0.3; margin-bottom: 12px; display: block; }
    .empty-news p { font-size: 13px; }
    
    .loading-spinner { text-align: center; padding: 40px; }
    .loading-spinner i { font-size: 32px; color: var(--primary-green); animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <main class="page-container">

    <div class="news-hero">
      <h2><i class="fas fa-newspaper" style="margin-right:8px;"></i> Agriculture News</h2>
      <p>Stay updated with the latest farming news, market trends, and government schemes.</p>
    </div>

    <div class="news-search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="news-search" class="news-search" placeholder="Search news articles...">
    </div>

    <div class="category-chips" id="category-chips">
      <button class="category-chip active" data-category="all">All News</button>
      <button class="category-chip" data-category="technology">Technology</button>
      <button class="category-chip" data-category="market">Market Trends</button>
      <button class="category-chip" data-category="government">Schemes</button>
      <button class="category-chip" data-category="weather">Weather</button>
      <button class="category-chip" data-category="agri">Agri Insights</button>
    </div>

    <div class="news-count" id="news-count">Showing 0 articles</div>

    <div id="featured-news-container"></div>
    <div id="news-list-container"></div>
    <div id="empty-news" class="empty-news" style="display:none;">
      <i class="fas fa-newspaper"></i>
      <p>No news articles found. Try a different search or category.</p>
    </div>

  </main>

  <script src="js/database.js"></script>
  <script src="js/services.js"></script>
  <script src="js/userStore.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="js/script.js"></script>
  <script>
  (function() {
    'use strict';

    var newsArticles = [
      { id: 1, title: 'PM-KISAN 15th Installment Released', excerpt: 'Government releases ₹20,000 crore to 10 crore farmer families under PM-KISAN scheme.', source: 'Agriculture Ministry', category: 'government', time: new Date(Date.now() - 1800000).toISOString(), featured: true, image: null },
      { id: 2, title: 'Monsoon Progress: 92% of Country Covered', excerpt: 'IMD reports normal monsoon progression with above-normal rainfall expected in central India.', source: 'India Meteorological Dept', category: 'weather', time: new Date(Date.now() - 3600000).toISOString(), featured: false, image: null },
      { id: 3, title: 'Cotton MSP Increased by 7%', excerpt: 'Cabinet approves minimum support price hike for cotton for the 2024-25 season.', source: 'Economic Times', category: 'market', time: new Date(Date.now() - 7200000).toISOString(), featured: false, image: null },
      { id: 4, title: 'Drone Spraying Subsidy Extended', excerpt: 'Government extends 50% subsidy for agricultural drone usage to all states.', source: 'Agri Tech News', category: 'technology', time: new Date(Date.now() - 14400000).toISOString(), featured: false, image: null },
      { id: 5, title: 'New Wheat Variety PBW-825 Released', excerpt: 'ICAR releases rust-resistant high-yielding wheat variety for northern plains.', source: 'ICAR', category: 'agri', time: new Date(Date.now() - 28800000).toISOString(), featured: false, image: null },
      { id: 6, title: 'Organic Farming Area Doubles in 5 Years', excerpt: 'India\'s organic farming area reaches 7.5 lakh hectares with growing export demand.', source: 'APEDA', category: 'agri', time: new Date(Date.now() - 43200000).toISOString(), featured: false, image: null },
      { id: 7, title: 'Kisan Credit Card Interest Rate Cut', excerpt: 'Banks reduce interest rates on KCC loans to 7% for farmers with good credit history.', source: 'RBI Bulletin', category: 'government', time: new Date(Date.now() - 86400000).toISOString(), featured: false, image: null },
      { id: 8, title: 'AI-Based Pest Detection App Launched', excerpt: 'ICAR launches mobile app using AI to detect crop diseases from leaf images.', source: 'Digital India', category: 'technology', time: new Date(Date.now() - 172800000).toISOString(), featured: false, image: null },
      { id: 9, title: 'Soybean Prices Hit 3-Year High', excerpt: 'Soybean prices surge in mandis due to reduced production and increased export demand.', source: 'Mandi Watch', category: 'market', time: new Date(Date.now() - 259200000).toISOString(), featured: false, image: null },
      { id: 10, title: 'El Niño Alert for Kharif Season', excerpt: 'Weather department issues El Niño watch for upcoming Kharif season, advises farmers.', source: 'IMD', category: 'weather', time: new Date(Date.now() - 345600000).toISOString(), featured: false, image: null }
    ];

    var currentCategory = 'all';
    var searchQuery = '';
    var container = document.getElementById('news-list-container');
    var featuredContainer = document.getElementById('featured-news-container');
    var emptyEl = document.getElementById('empty-news');
    var countEl = document.getElementById('news-count');

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      var diff = Date.now() - new Date(dateStr).getTime();
      var mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + 'm ago';
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      var days = Math.floor(hrs / 24);
      if (days < 7) return days + 'd ago';
      return new Date(dateStr).toLocaleDateString();
    }

    function getCategoryIcon(category) {
      var icons = {
        technology: 'fa-microchip',
        market: 'fa-chart-line',
        government: 'fa-landmark',
        weather: 'fa-cloud-sun',
        agri: 'fa-seedling'
      };
      return icons[category] || 'fa-newspaper';
    }

    function renderNews() {
      var filtered = newsArticles.filter(function(article) {
        var matchesCategory = currentCategory === 'all' || article.category === currentCategory;
        var query = searchQuery.toLowerCase();
        var matchesSearch = !query || 
          article.title.toLowerCase().indexOf(query) !== -1 || 
          article.excerpt.toLowerCase().indexOf(query) !== -1 ||
          article.source.toLowerCase().indexOf(query) !== -1;
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '';
        featuredContainer.innerHTML = '';
        emptyEl.style.display = 'block';
        countEl.textContent = 'Showing 0 articles';
        return;
      }

      emptyEl.style.display = 'none';
      countEl.textContent = 'Showing ' + filtered.length + ' article' + (filtered.length !== 1 ? 's' : '');

      var featured = filtered.find(function(a) { return a.featured; });
      var regular = filtered.filter(function(a) { return !a.featured; });

      if (featured) {
        featuredContainer.innerHTML = '<div class="featured-news">' +
          '<span class="featured-label"><i class="fas fa-star"></i> Featured</span>' +
          '<h3>' + featured.title + '</h3>' +
          '<p>' + featured.excerpt + '</p>' +
          '<div class="news-meta">' +
            '<span><i class="fas fa-newspaper"></i> ' + featured.source + '</span>' +
            '<span><i class="far fa-clock"></i> ' + timeAgo(featured.time) + '</span>' +
          '</div>' +
        '</div>';
      } else {
        featuredContainer.innerHTML = '';
      }

      container.innerHTML = regular.map(function(article) {
        return '<div class="news-card" data-id="' + article.id + '">' +
          '<div class="news-image"><i class="fas ' + getCategoryIcon(article.category) + '"></i>' +
            '<span class="news-badge ' + article.category + '">' + article.category + '</span>' +
          '</div>' +
          '<div class="news-content">' +
            '<div class="news-source"><i class="fas fa-newspaper"></i> ' + article.source + '</div>' +
            '<div class="news-title">' + article.title + '</div>' +
            '<div class="news-excerpt">' + article.excerpt + '</div>' +
            '<div class="news-meta">' +
              '<span><i class="far fa-clock"></i> ' + timeAgo(article.time) + '</span>' +
              '<span><i class="fas fa-tag"></i> ' + article.category + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      container.querySelectorAll('.news-card').forEach(function(card) {
        card.addEventListener('click', function() {
          if (typeof showToast === 'function') {
            showToast('Opening article...', 'info');
          }
        });
      });
    }

    document.getElementById('news-search').addEventListener('input', function() {
      searchQuery = this.value;
      renderNews();
    });

    document.querySelectorAll('.category-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.category-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentCategory = chip.getAttribute('data-category');
        renderNews();
      });
    });

    renderNews();
  })();
  </script>
</body>
</html>
