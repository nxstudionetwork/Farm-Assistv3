        if (currentCategory !== 'all' && e.specialization !== currentCategory) return false;
        if (currentQuery) {

          var nameMatch = e.name.toLowerCase().indexOf(q) !== -1;
          var specMatch = e.specialization.toLowerCase().indexOf(q) !== -1;
          var locMatch = e.location.toLowerCase().indexOf(q) !== -1;
          var langMatch = e.languages.toLowerCase().indexOf(q) !== -1;
          var qualMatch = e.qualification.toLowerCase().indexOf(q) !== -1;
          if (!nameMatch && !specMatch && !locMatch && !langMatch && !qualMatch) return false;
        }
        return true;
      });

      // Quick filter logic
      if (currentFilter === 'booked') {
        filtered = filtered.filter(function (e) { return e.availClass === 'today'; });
      } else if (currentFilter === 'recommended') {
        filtered = filtered.filter(function (e) { return e.rating >= 4.7; });
      } else if (currentFilter === 'starred') {
        filtered = filtered.filter(function (e) { return e.rating >= 4.8; });
      } else if (currentFilter === 'known') {
        filtered = filtered.filter(function (e) { return e.reviews >= 100; });

      if (countEl) countEl.textContent = filtered.length + ' expert' + (filtered.length === 1 ? '' : 's');

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-user-md"></i><h4>No experts found</h4><p>Try adjusting your filters or search terms.</p></div>';
        return;
      }

      list.innerHTML = filtered.map(function (e) {
        var availLabel = e.availability;
        var starsHtml = stars(e.rating);
        var initials = getInitials(e.name);
        return '' +
          '<div class="expert-card" data-id="' + e.id + '">' +
            '<div class="expert-card-top">' +
              '<div class="expert-avatar">' + esc(initials) + '</div>' +
              '<div class="expert-info">' +
                '<h4>' + esc(e.name) + ' <span class="badge badge-green">Expert</span></h4>' +
                '<div class="expert-qual">' + esc(e.qualification) + ' &bull; ' + esc(e.experience) + '</div>' +
                '<div class="expert-spec"><i class="fas fa-flask"></i> ' + esc(e.specialization) + '</div>' +
                '<div class="expert-stars">' + starsHtml + ' <b>' + e.rating + '</b> <small>(' + e.reviews + ' reviews)</small></div>' +
              '</div>' +
            '</div>' +
            '<div class="expert-meta">' +
              '<span><i class="fas fa-language"></i> ' + esc(e.languages) + '</span>' +
              '<span><i class="fas fa-map-marker-alt"></i> ' + esc(e.location) + '</span>' +
            '</div>' +
            '<div class="flex-between">' +
              '<span class="expert-avail ' + e.availClass + '"><i class="fas fa-circle"></i> ' + esc(availLabel) + '</span>' +
              '<span class="expert-fee">' + rupee(e.fee) + ' <small>/ consult</small></span>' +
            '</div>' +
            '<div class="expert-actions">' +
              '<button class="btn-secondary btn-sm" onclick="window._openDetail(' + e.id + ')"><i class="fas fa-eye"></i> View Details</button>' +
              '<button class="btn-secondary btn-sm" onclick="window._openMessage(' + e.id + ')"><i class="fas fa-comment-dots"></i> Message</button>' +
              '<button class="btn-primary btn-sm" onclick="window._openBooking(' + e.id + ')"><i class="fas fa-calendar-check"></i> Book</button>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    // ---- Detail Modal ----
    window._openDetail = function (id) {
      var e = null;
      for (var i = 0; i < experts.length; i++) {
        if (experts[i].id === id) { e = experts[i]; break; }
      }
      if (!e) return;

      var starsHtml = stars(e.rating);
      var initials = getInitials(e.name);
      var days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
      var hoursHtml = '';
      for (var d = 0; d < days.length; d++) {
        var day = days[d];
        var time = e.workingHours[day] || 'Closed';
        hoursHtml += '<div><span>' + day + '</span><span>' + time + '</span></div>';
      }
      var reviewsHtml = '';
      for (var r = 0; r < e.reviewsList.length; r++) {
        var rev = e.reviewsList[r];
        reviewsHtml += '' +
          '<div class="review-item">' +
            '<div class="review-header"><b>' + esc(rev.author) + '</b><span>' + stars(rev.rating) + '</span></div>' +
            '<div class="review-text">' + esc(rev.text) + '</div>' +
            '<small style="color:var(--text-muted);font-size:10px;">' + esc(rev.date) + '</small>' +
          '</div>';
      }

      var content = '' +
        '<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;">' +
          '<div class="expert-avatar" style="width:72px;height:72px;font-size:28px;">' + esc(initials) + '</div>' +
          '<div>' +
            '<h3 style="font-size:18px;margin-bottom:2px;">' + esc(e.name) + '</h3>' +
            '<div style="font-size:12px;color:var(--text-muted);">' + esc(e.qualification) + ' &bull; ' + esc(e.experience) + '</div>' +
            '<div class="expert-stars" style="margin-top:4px;">' + starsHtml + ' <b>' + e.rating + '</b> <small>(' + e.reviews + ' reviews)</small></div>' +
          '</div>' +
        '</div>' +
        '<div class="section-title"><i class="fas fa-user-circle"></i> About</div>' +
        '<div class="about-text">' + esc(e.about) + '</div>' +
        '<div class="section-title"><i class="fas fa-star"></i> Reviews (' + e.reviewsList.length + ')</div>' +
        reviewsHtml +
        '<div class="section-title" style="margin-top:12px;"><i class="fas fa-clock"></i> Working Hours</div>' +
        '<div class="working-hours">' + hoursHtml + '</div>' +
        '<div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-light);">' +
          '<button class="btn-secondary" onclick="closeDetailModal()" style="flex:1;">Close</button>' +
          '<button class="btn-primary" onclick="closeDetailModal();window._openBooking(' + e.id + ');" style="flex:1;"><i class="fas fa-calendar-check"></i> Book Appointment</button>' +
        '</div>';

      document.getElementById('detail-modal-content').innerHTML = content;
      openModal('detail-modal');
    };

    // ---- Booking Modal ----
    window._openBooking = function (id) {
      var e = null;
      for (var i = 0; i < experts.length; i++) {
        if (experts[i].id === id) { e = experts[i]; break; }
      }
      if (!e) return;
      currentBookedExpert = e;

      var initials = getInitials(e.name);
      var tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      var minDate = tomorrow.toISOString().slice(0, 10);

      var content = '' +
        '<div class="book-summary">' +
          '<div class="expert-avatar" style="width:44px;height:44px;font-size:16px;">' + esc(initials) + '</div>' +
          '<div class="book-summary-info">' +
            '<h4>' + esc(e.name) + '</h4>' +
            '<p>' + esc(e.specialization) + ' &bull; ' + esc(e.qualification) + '</p>' +
          '</div>' +
        '</div>' +
        '<form id="booking-form" novalidate>' +
          '<div class="form-group">' +
            '<label>Select Date</label>' +
            '<input type="date" class="form-input" id="booking-date" min="' + minDate + '" value="' + minDate + '">' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Time Slot</label>' +
            '<select class="form-select" id="booking-time">' +
              '<option value="Morning 9-12">Morning (9:00 AM - 12:00 PM)</option>' +
              '<option value="Afternoon 12-3">Afternoon (12:00 PM - 3:00 PM)</option>' +
              '<option value="Evening 3-6">Evening (3:00 PM - 6:00 PM)</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Consultation Type</label>' +
            '<select class="form-select" id="booking-type">' +
              '<option value="Video">Video Call</option>' +
              '<option value="Audio">Audio Call</option>' +
              '<option value="Chat">Chat</option>' +
              '<option value="In-person">In-person</option>' +
            '</select>' +
          '</div>' +
          '<div style="background:var(--soft-green);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">' +
            '<span style="font-size:13px;font-weight:600;color:var(--text-secondary);">Consultation Fee</span>' +
            '<span style="font-size:20px;font-weight:800;color:var(--primary-green);">' + rupee(e.fee) + '</span>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Notes (optional)</label>' +
            '<textarea class="form-textarea" id="booking-notes" rows="3" placeholder="Describe your issue or any questions for the expert..." style="width:100%;padding:10px 14px;border:1px solid var(--border-medium);border-radius:var(--radius-sm);font-size:13px;resize:vertical;"></textarea>' +
          '</div>' +
        '</form>' +
        '<div style="display:flex;gap:10px;padding-top:8px;">' +
          '<button class="btn-secondary" style="flex:1;" onclick="closeBookingModal()">Cancel</button>' +
          '<button class="btn-primary" style="flex:1;" onclick="confirmBooking()"><i class="fas fa-check"></i> Confirm Booking</button>' +
        '</div>';

      document.getElementById('booking-modal-content').innerHTML = content;
      openModal('booking-modal');
    };

    window.confirmBooking = function () {
      var date = document.getElementById('booking-date');
      var time = document.getElementById('booking-time');
      var type = document.getElementById('booking-type');
      var notes = document.getElementById('booking-notes');
      if (!date || !time || !type) return;

      var msg = 'Appointment booked with ' + esc(currentBookedExpert.name) + ' on ' + date.value + ' (' + time.value + ') via ' + type.value + '.';
      showToast(msg);
      closeBookingModal();
    };

    window._openMessage = function (id) {
      var e = null;
      for (var i = 0; i < experts.length; i++) {
        if (experts[i].id === id) { e = experts[i]; break; }
      }
      if (!e) return;
      showToast('Opening chat with ' + e.name + '...');
    };

    // ---- Modal Controls ----
    function openModal(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    window.closeDetailModal = function () {
      var el = document.getElementById('detail-modal');
      if (!el) return;
      el.classList.remove('active');
      document.body.style.overflow = '';
    };

    window.closeBookingModal = function () {
      var el = document.getElementById('booking-modal');
      if (!el) return;
      el.classList.remove('active');
      document.body.style.overflow = '';
    };

    // ---- Click outside to close modals ----
    document.addEventListener('click', function (e) {
      var dm = document.getElementById('detail-modal');
      var bm = document.getElementById('booking-modal');
      if (dm && dm.classList.contains('active') && e.target === dm) closeDetailModal();
      if (bm && bm.classList.contains('active') && e.target === bm) closeBookingModal();
    });

    // ---- Escape key to close modals ----
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeDetailModal();
        closeBookingModal();
      }
    });

    // ---- Toast ----
    function showToast(msg) {
      var el = document.getElementById('success-toast');
      var msgEl = document.getElementById('toast-message');
      if (!el || !msgEl) return;
      msgEl.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timeout);
      el._timeout = setTimeout(function () {
        el.classList.remove('show');
      }, 3500);
    }

    // ---- Bind UI Controls ----
    function bindUI() {
      // Search
      var search = document.getElementById('expert-search');
      if (search) {
        var timer;
        search.addEventListener('input', function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            currentQuery = search.value;
            renderExperts();
          }, 250);
        });
      }

      // Category filter
      var cat = document.getElementById('expert-category-filter');
      if (cat) {
        cat.addEventListener('change', function () {
          currentCategory = cat.value;
          renderExperts();
        });
      }

      // Quick filter icons
      var iconBtns = document.querySelectorAll('.filter-icon-btn');
      for (var i = 0; i < iconBtns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            var filter = btn.getAttribute('data-filter');
            if (currentFilter === filter) {
              currentFilter = 'all';
              btn.classList.remove('active');
            } else {
              for (var j = 0; j < iconBtns.length; j++) iconBtns[j].classList.remove('active');
              currentFilter = filter;
              btn.classList.add('active');
            }
            renderExperts();
          });
        })(iconBtns[i]);
      }
    }

    // ---- Init ----
    function init() {
      if (!document.getElementById('expert-list')) return;
      renderExperts();
      bindUI();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
